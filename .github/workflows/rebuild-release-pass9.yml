name: Rebuild managed release after complex grammar pass 9

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - '.github/workflows/rebuild-release-pass9.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
      - name: Rebuild managed release bundle
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release
        run: python tools/verify_release.py
      - name: Commit release bundle updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hxempirical-release.zip hxempirical-release.index release/hxempirical-release.b64.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh managed release after complex grammar pass'
          git push origin HEAD:ui-consistency-audit-20260815
