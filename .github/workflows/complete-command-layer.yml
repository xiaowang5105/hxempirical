name: Complete command layer

on:
  push:
    branches:
      - complete-command-layer

permissions:
  contents: write

jobs:
  complete-build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Apply command-layer completion patch
        run: python3 tools/complete_command_layer.py
      - name: Build and run complete offline audit
        run: bash tools/complete_command_layer_ci.sh
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hxregistry.ado hxsemantics.ado hxpreview.ado src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "[generated-complete] Finish ordinary command layer"
            git push
          fi
