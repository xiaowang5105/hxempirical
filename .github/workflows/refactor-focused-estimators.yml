name: Refactor focused estimator pages

on:
  push:
    branches:
      - ui-focused-estimators

permissions:
  contents: write

jobs:
  refactor-build-test:
    if: "${{ !contains(github.event.head_commit.message, '[generated-focused]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui-focused-estimators
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Refactor focused estimator pages
        run: python3 tools/refactor_focused_estimators.py
      - name: Compile and render smoke tests
        run: bash tools/build_focused_estimators_ci.sh
      - name: Commit generated production files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md hxsemantics.ado hxresolve.ado src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m '[generated-focused] Refine common estimator command pages'
            git push origin HEAD:ui-focused-estimators
          fi
