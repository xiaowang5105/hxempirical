name: Finalize 1.5.13 hotfix release

on:
  push:
    branches: [hotfix/install-shadowing-v1513]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/install-shadowing-v1513
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch workbench version constant without recompiling production JAR
        run: python tools/_finalize_v1513_release.py

      - name: Rebuild release bundle
        shell: pwsh
        run: ./tools/build_release_bundle.ps1

      - name: Verify managed release
        run: python tools/verify_release.py

      - name: Verify installer contracts
        run: python tools/verify_installer_contracts.py

      - name: Verify static contracts
        run: python tools/verify_static_contracts.py

      - name: Verify Statistics catalog
        run: python tools/verify_statistics_catalog.py

      - name: Verify JAR/source sync marker and Java level
        run: python tools/verify_hxworkbench_jar_sync.py

      - name: Check temporary release diff
        shell: bash
        run: git diff --check

      - name: Commit finalized 1.5.13 release artifacts only
        shell: bash
        run: |
          rm -f tools/_finalize_v1513_release.py
          rm -f .github/workflows/_finalize-v1513-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            hxworkbench.jar \
            src/main/java/com/hexie/stata/HxWorkbench.jar-source \
            hxempirical-release.zip \
            hxempirical-release.index \
            release \
            tools/_finalize_v1513_release.py \
            .github/workflows/_finalize-v1513-release.yml
          git diff --cached --check
          git commit -m "release: finalize hxempirical 1.5.13 hotfix"
          git push origin HEAD:hotfix/install-shadowing-v1513
