name: Third-round release audit v1.3.4

on:
  push:
    branches: [ui-selfcheck-v133-round3]
    paths:
      - '.github/workflows/ui-third-final-v134c.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-round product fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java=Path('src/main/java/com/hexie/stata/HxWorkbench.java'); s=java.read_text(encoding='utf-8')
          old='''            this.statusLabel.setText(rc == 0 ? "xtreg 已运行。右侧可查看结果与日志。" : "xtreg 运行失败，返回码：" + rc);\n            this.refreshDataset(false);'''
          new='''            this.refreshDataset(false);\n            this.statusLabel.setText(rc == 0 ? "xtreg 已运行。右侧可查看结果与日志。" : "xtreg 运行失败，返回码：" + rc);'''
          assert old in s
          s=s.replace(old,new,1).replace('public static final String VERSION = "1.3.3";','public static final String VERSION = "1.3.4";',1).replace('SFIToolkit.displayln("HxWorkbench 1.3.3");','SFIToolkit.displayln("HxWorkbench 1.3.4");',1)
          java.write_text(s,encoding='utf-8')
          p=Path('hxempirical.ado'); x=p.read_text(encoding='utf-8').replace('*! hxempirical 1.3.3  13aug2026','*! hxempirical 1.3.4  13aug2026',1).replace('"1.3.3"','"1.3.4"'); p.write_text(x,encoding='utf-8')
          p=Path('hxempirical.pkg'); p.write_text(p.read_text(encoding='utf-8').replace('d Version 1.3.3','d Version 1.3.4',1),encoding='utf-8')
          p=Path('README.md'); x=p.read_text(encoding='utf-8').replace('**当前发布版本：1.2.7**','**当前发布版本：1.3.4**',1).replace('**上次修改时间：2026-08-13 09:15（UTC+8）**','**上次修改时间：2026-08-13 13:39（UTC+8）**',1); p.write_text(x,encoding='utf-8')
          p=Path('hxempirical.sthlp'); x=p.read_text(encoding='utf-8').replace('{* *! version 1.2.7  13aug2026}{...}','{* *! version 1.3.4  13aug2026}{...}',1).replace('The 1.2.7 interface uses a stable desktop-workbench layout:','The 1.3.4 interface uses a stable desktop-workbench layout:',1); p.write_text(x,encoding='utf-8')
          p=Path('stata.toc'); x=p.read_text(encoding='utf-8').replace('d Launcher-style workbench with task search, parameter restore, visual regress builder, safe DID/event study, external OneClick, and History integration','d Launcher-style workbench with task search, parameter restore, visual regression tools, official DID commands, external OneClick, and History integration',1); p.write_text(x,encoding='utf-8')
          PY

      - name: Compile and rebuild jar
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-audit
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata

      - name: Xtreg and graph functional audit
        shell: bash
        run: |
          cat > /tmp/CoreAudit.java <<'EOF'
          import java.awt.*;import java.awt.datatransfer.StringSelection;import java.lang.reflect.*;import java.util.Objects;import javax.swing.*;
          public class CoreAudit{static Field f(Class<?>c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}static Method m(Class<?>c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}static void ck(boolean v,String s){if(!v)throw new AssertionError(s);}static void lay(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)lay((Container)x);}static void set(JFrame f,int w,int h){f.setSize(w,h);f.setVisible(true);f.validate();lay(f.getContentPane());}static AbstractButton b(Container c,String s){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&s.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton q=b((Container)x,s);if(q!=null)return q;}}return null;}static JComboBox<?> combo(Container c,String s){for(Component x:c.getComponents()){if(x instanceof JComboBox){JComboBox<?>q=(JComboBox<?>)x;for(int i=0;i<q.getItemCount();i++)if(s.equals(Objects.toString(q.getItemAt(i),"")))return q;}if(x instanceof Container){JComboBox<?>q=combo((Container)x,s);if(q!=null)return q;}}return null;}static void sel(JComboBox<?>q,String s){for(int i=0;i<q.getItemCount();i++)if(s.equals(Objects.toString(q.getItemAt(i),""))){q.setSelectedIndex(i);return;}throw new AssertionError(s);}static int idx(JList<?>l,String s){for(int i=0;i<l.getModel().getSize();i++)if(s.equals(Objects.toString(l.getModel().getElementAt(i),"")))return i;return-1;}public static void main(String[]a)throws Exception{final Throwable[]e={null};SwingUtilities.invokeAndWait(()->{try{Class<?>c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?>ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame fr=(JFrame)ct.newInstance(true);fr.addNotify();m(c,"showXtregWizardPageV130").invoke(fr);JSplitPane sp=(JSplitPane)f(c,"commandDataSplit").get(fr);JScrollPane sc=(JScrollPane)f(c,"formScroll").get(fr);JPanel form=(JPanel)f(c,"formPanel").get(fr);@SuppressWarnings("unchecked")JComboBox<String> panel=(JComboBox<String>)f(c,"xtregPanelVar").get(fr);@SuppressWarnings("unchecked")JComboBox<String> time=(JComboBox<String>)f(c,"xtregTimeVar").get(fr);@SuppressWarnings("unchecked")JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(fr);@SuppressWarnings("unchecked")JList<String> xs=(JList<String>)f(c,"xtregIndepList").get(fr);int[][]sz={{1920,1080},{1600,900},{1366,768},{1280,720}};double[]rr={.33,.40,.55,.70};for(int[]z:sz)for(double r:rr){set(fr,z[0],z[1]);sp.setDividerLocation(r);fr.validate();lay(fr.getContentPane());ck(form.getWidth()<=sc.getViewport().getExtentSize().width+2,"overflow");for(Component x:form.getComponents())if(x instanceof JPanel)ck(x.getWidth()>0&&x.getHeight()>0,"collapsed card");for(String s:new String[]{"固定效应（FE）","随机效应（RE）","between","population-averaged","上一步","清空设置","运行 xtreg"})ck(b(form,s)!=null&&b(form,s).getWidth()>20,"bad "+s);}
          sel(panel,"foreign");sel(time,"rep78");sel(dep,"price");int i1=idx(xs,"mpg"),i2=idx(xs,"weight");xs.setSelectedIndices(new int[]{i1,i2});AbstractButton fe=b(form,"固定效应（FE）"),re=b(form,"随机效应（RE）"),be=b(form,"between"),pa=b(form,"population-averaged");JComboBox<?>se=combo(form,"稳健标准误");JTextArea pv=(JTextArea)f(c,"previewArea").get(fr);fe.doClick();sel(se,"稳健标准误");ck("xtreg price mpg weight, fe vce(robust)".equals(pv.getText().trim()),"FE");re.doClick();sel(se,"默认标准误");ck("xtreg price mpg weight, re".equals(pv.getText().trim()),"RE");be.doClick();sel(se,"按面板聚类");ck("xtreg price mpg weight, be vce(cluster foreign)".equals(pv.getText().trim()),"BE");pa.doClick();sel(se,"稳健标准误");ck("xtreg price mpg weight, pa vce(robust)".equals(pv.getText().trim()),"PA");xs.clearSelection();ck(xs.getTransferHandler().importData(new TransferHandler.TransferSupport(xs,new StringSelection("mpg"))),"dnd1");ck(xs.getTransferHandler().importData(new TransferHandler.TransferSupport(xs,new StringSelection("weight"))),"dnd2");b(form,"运行 xtreg").doClick();ck(((JLabel)f(c,"statusLabel").get(fr)).getText().startsWith("xtreg 已运行"),"status overwritten");b(form,"清空设置").doClick();ck(Objects.toString(dep.getSelectedItem(),"").isBlank()&&xs.getSelectedIndices().length==0&&fe.isSelected(),"clear");for(String cmd:new String[]{"histogram","kdensity","scatter","lfit","graph_box","did_trends","twoway"}){m(c,"showSpecialGraphPage",String.class).invoke(fr,cmd);set(fr,1366,768);ck(cmd.equals(Objects.toString(f(c,"currentCommand").get(fr),"")),"graph "+cmd);}JTable t=(JTable)f(c,"dataTable").get(fr);ck(t.getTableHeader().getTransferHandler()!=null&&!t.getTableHeader().getReorderingAllowed(),"header dnd");fr.dispose();}catch(Throwable t){e[0]=t;}});if(e[0]!=null){e[0].printStackTrace();System.exit(2);}System.out.println("CORE_UI_AUDIT_OK");System.exit(0);}}
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/CoreAudit.java
          xvfb-run -a java -cp /tmp/classes CoreAudit

      - name: Official preview smoke tests
        shell: bash
        run: |
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-home-preview /tmp/ui-audit/home.png
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-graph-preview /tmp/ui-audit/graph.png
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-oneclick-preview /tmp/ui-audit/oneclick.png
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-regress-preview /tmp/ui-audit/regress.png
          test -s /tmp/ui-audit/home.png && test -s /tmp/ui-audit/graph.png && test -s /tmp/ui-audit/oneclick.png && test -s /tmp/ui-audit/regress.png

      - name: Package documentation version audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path('hxempirical.pkg').read_text(encoding='utf-8'); files=[x[2:].strip() for x in pkg.splitlines() if x.startswith('f ')]; assert not [x for x in files if not Path(x).exists()]
          assert 'd Version 1.3.4' in pkg
          assert '**当前发布版本：1.3.4**' in Path('README.md').read_text(encoding='utf-8')
          h=Path('hxempirical.sthlp').read_text(encoding='utf-8').lower(); assert 'version 1.3.4' in h and 'the 1.3.4 interface' in h
          assert 'official DID commands' in Path('stata.toc').read_text(encoding='utf-8')
          assert 'VERSION = "1.3.4"' in Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')
          assert 'return local version "1.3.4"' in Path('hxempirical.ado').read_text(encoding='utf-8')
          print('PACKAGE_DOC_AUDIT_OK')
          PY
          unzip -p hxworkbench.jar com/hexie/stata/HxWorkbench.class | strings | grep -q '1.3.4'

      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-third-release-v134
          path: /tmp/ui-audit/*.png
          if-no-files-found: error

      - name: Commit audited product tree
        shell: bash
        run: |
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix status persistence and documentation consistency after third self-check [ui-audit]'
          git push origin HEAD:ui-selfcheck-v133-round3
