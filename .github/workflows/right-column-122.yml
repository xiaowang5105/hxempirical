name: Right column 1.2.2

on:
  push:
    branches:
      - right-column-current-data-1.2.2

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Patch, compile and render fixed current-data column
        run: bash tools/audit_right_column_122.sh
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: hx-right-column-1.2.2
          path: build/previews/*.png
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar hxempirical.ado hxempirical.sthlp hxempirical.pkg README.md
          git commit -m "Fix current-data column and remove expanding run details for 1.2.2"
          git push
