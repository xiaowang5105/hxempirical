name: Final right-pane state audit v1.3.7

on:
  push:
    branches: [selfcheck-v137]
    paths: ['.github/workflows/selfcheck-v137.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch title synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/hexie/stata/HxWorkbench.java'); s=p.read_text(encoding='utf-8')
          s=s.replace('public static final String VERSION = "1.3.6";', 'public static final String VERSION = "1.3.7";', 1)
          s=s.replace('SFIToolkit.displayln("HxWorkbench 1.3.6");', 'SFIToolkit.displayln("HxWorkbench 1.3.7");', 1)
          s=s.replace('''         this.dataTabs.addTab("结果", this.resultCards);\n         this.dataTabs.addTab("日志", this.buildRunMonitorPanel());\n         this.dataTabs.addChangeListener(var0 -> this.syncRightPaneTitle());\n         this.dataTabs.setBackground(SURFACE);\n         this.syncRightPaneTitle();''','''         this.dataTabs.addTab("结果", this.resultCards);\n         this.dataTabs.addTab("日志", this.buildRunMonitorPanel());\n         this.dataTabs.setBackground(SURFACE);\n         this.syncRightPaneTitle();''',1)
          s=s.replace('''      private void populateMonitorDetailsPreviewState() {\n         this.dataTabs.setSelectedIndex(2);\n         this.rightPaneTitle.setText("当前数据");\n      }''','''      private void populateMonitorDetailsPreviewState() {\n         this.dataTabs.setSelectedIndex(2);\n         this.syncRightPaneTitle();\n      }''',1)
          s=s.replace('''      private void selectRunView() {\n         this.dataTabs.setSelectedIndex(2);\n         this.rightPaneTitle.setText("当前数据");\n      }''','''      private void selectRunView() {\n         this.dataTabs.setSelectedIndex(2);\n         this.syncRightPaneTitle();\n      }''',1)
          s=s.replace('this.dataTabs.addChangeListener(var1x -> this.rightPaneTitle.setText("当前数据"));','this.dataTabs.addChangeListener(var1x -> this.syncRightPaneTitle());',1)
          p.write_text(s,encoding='utf-8')
          p=Path('hxempirical.ado'); s=p.read_text(encoding='utf-8').replace('*! hxempirical 1.3.6  13aug2026','*! hxempirical 1.3.7  13aug2026',1).replace('"1.3.6"','"1.3.7"'); p.write_text(s,encoding='utf-8')
          p=Path('hxempirical.pkg'); p.write_text(p.read_text(encoding='utf-8').replace('d Version 1.3.6','d Version 1.3.7',1),encoding='utf-8')
          p=Path('hxempirical.sthlp'); p.write_text(p.read_text(encoding='utf-8').replace('version 1.3.6','version 1.3.7').replace('The 1.3.6 interface','The 1.3.7 interface'),encoding='utf-8')
          p=Path('README.md'); p.write_text(p.read_text(encoding='utf-8').replace('**当前发布版本：1.3.6**','**当前发布版本：1.3.7**',1).replace('**上次修改时间：2026-08-13 14:18（UTC+8）**','**上次修改时间：2026-08-13 14:26（UTC+8）**',1),encoding='utf-8')
          PY
      - name: Compile and runtime audit
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          printf '%s\n' 'package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }' > /tmp/sfi/com/stata/sfi/SFIToolkit.java
          printf '%s\n' 'package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }' > /tmp/sfi/com/stata/sfi/Characteristic.java
          printf '%s\n' 'package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }' > /tmp/sfi/com/stata/sfi/Macro.java
          printf '%s\n' 'package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }' > /tmp/sfi/com/stata/sfi/Missing.java
          printf '%s\n' 'package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }' > /tmp/sfi/com/stata/sfi/Scalar.java
          printf '%s\n' 'package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }' > /tmp/sfi/com/stata/sfi/Data.java
          printf '%s\n' 'package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }' > /tmp/sfi/com/stata/sfi/Frame.java
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          cat > /tmp/PaneAudit.java <<'EOF'
          import java.lang.reflect.*; import javax.swing.*;
          public class PaneAudit { static Field f(Class<?>c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;} static Method m(Class<?>c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;} static void ck(boolean v,String s){if(!v)throw new AssertionError(s);} public static void main(String[]a)throws Exception{final Throwable[]e={null};SwingUtilities.invokeAndWait(()->{try{Class<?>c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?>ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame fr=(JFrame)ct.newInstance(true);fr.addNotify();JLabel title=(JLabel)f(c,"rightPaneTitle").get(fr);m(c,"selectResultView",String.class,boolean.class).invoke(fr,"general",true);ck("结果".equals(title.getText()),"result title");m(c,"selectRunView").invoke(fr);ck("运行日志".equals(title.getText()),"run title="+title.getText());m(c,"selectDataView").invoke(fr);ck("当前数据".equals(title.getText()),"data title");m(c,"populateMonitorDetailsPreviewState").invoke(fr);ck("运行日志".equals(title.getText()),"preview log title");fr.dispose();}catch(Throwable t){e[0]=t;}});if(e[0]!=null)throw new RuntimeException(e[0]);System.out.println("PANE_AUDIT_OK");}}
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/PaneAudit.java
          xvfb-run -a java -cp /tmp/classes PaneAudit
          grep -q 'public static final String VERSION = "1.3.7"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'd Version 1.3.7' hxempirical.pkg
      - name: Commit product changes
        shell: bash
        run: |
          rm -f .github/workflows/selfcheck-v137.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix result and log pane title synchronization [v1.3.7]'
          git push origin HEAD:selfcheck-v137
