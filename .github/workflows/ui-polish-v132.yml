name: UI polish v1.3.2

on:
  push:
    branches: [ui-audit-v132]
    paths:
      - '.github/workflows/ui-polish-v132.yml'

permissions:
  contents: write

jobs:
  polish-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final polish
        run: python3 scripts/apply_ui_polish_v132.py

      - name: Create Stata SFI compile stubs
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi;
          public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF

      - name: Compile Java 11 and jar
        run: |
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar

      - name: Functional layout and drag-drop audit
        shell: bash
        run: |
          cat > /tmp/UiPolishAudit.java <<'EOF'
          import java.awt.*;
          import java.awt.datatransfer.StringSelection;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import java.lang.reflect.*;
          import java.util.Map;
          import javax.imageio.ImageIO;
          import javax.swing.*;

          public class UiPolishAudit {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static AbstractButton button(Container c,String text){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&text.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=button((Container)x,text);if(b!=null)return b;}}return null;}
            static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
            static void render(JFrame frame,String path)throws Exception{Container c=frame.getContentPane();layout(c);BufferedImage im=new BufferedImage(c.getWidth(),c.getHeight(),BufferedImage.TYPE_INT_RGB);Graphics2D g=im.createGraphics();c.printAll(g);g.dispose();ImageIO.write(im,"png",new File(path));}
            public static void main(String[] a)throws Exception{
              final Throwable[] err={null};
              SwingUtilities.invokeAndWait(()->{try{
                Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");
                Constructor<?> ctor=c.getDeclaredConstructor(boolean.class);ctor.setAccessible(true);
                JFrame frame=(JFrame)ctor.newInstance(true);
                m(c,"showXtregWizardPageV130").invoke(frame);
                frame.setSize(1672,901);frame.addNotify();frame.getContentPane().setSize(1672,901);frame.validate();layout(frame.getContentPane());
                JSplitPane split=(JSplitPane)f(c,"commandDataSplit").get(frame);split.setDividerLocation(.58);layout(frame.getContentPane());
                JScrollPane scroll=(JScrollPane)f(c,"formScroll").get(frame);JPanel form=(JPanel)f(c,"formPanel").get(frame);
                check(form.getWidth()<=scroll.getViewport().getExtentSize().width+2,"form horizontally overflows viewport");
                AbstractButton run=button(form,"运行 xtreg");AbstractButton pa=button(form,"population-averaged");
                check(run!=null&&run.getWidth()>20,"run button missing/clipped");check(pa!=null&&pa.getWidth()>20,"PA option missing/clipped");
                @SuppressWarnings("unchecked") JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(frame);
                @SuppressWarnings("unchecked") JList<String> indep=(JList<String>)f(c,"xtregIndepList").get(frame);
                check(dep.getHeight()<=40,"dependent-variable selector is vertically stretched: "+dep.getHeight());
                TransferHandler.TransferSupport d=new TransferHandler.TransferSupport(dep,new StringSelection("price"));check(dep.getTransferHandler().importData(d)&&"price".equals(dep.getSelectedItem()),"dependent-variable DnD failed");
                TransferHandler.TransferSupport x1=new TransferHandler.TransferSupport(indep,new StringSelection("mpg"));TransferHandler.TransferSupport x2=new TransferHandler.TransferSupport(indep,new StringSelection("weight"));check(indep.getTransferHandler().importData(x1)&&indep.getTransferHandler().importData(x2),"X DnD failed");check(indep.getSelectedValuesList().contains("mpg")&&indep.getSelectedValuesList().contains("weight"),"multi-drop not preserved");
                @SuppressWarnings("unchecked") Map<String,JButton> buttons=(Map<String,JButton>)f(c,"sidebarButtons").get(frame);check(buttons.get("data").getText().contains("▤")&&buttons.get("data").getText().contains("数据"),"expanded sidebar lacks icon + label");
                render(frame,a[0]);
                m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());
                JPanel sidebar=(JPanel)f(c,"sidebarPanel").get(frame);check(sidebar.getPreferredSize().width<=60,"sidebar collapse failed");check(buttons.get("data").getText().contains("▤")&&!buttons.get("data").getText().contains("数据"),"collapsed sidebar not icon-only");
                check(form.getWidth()<=scroll.getViewport().getExtentSize().width+2,"overflow after collapse");render(frame,a[1]);frame.dispose();
              }catch(Throwable t){err[0]=t;}});
              if(err[0]!=null)throw new RuntimeException(err[0]);System.out.println("HX_UI_POLISH_AUDIT_OK");
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/UiPolishAudit.java
          xvfb-run -a java -cp /tmp/classes UiPolishAudit /tmp/xtreg-expanded-final.png /tmp/xtreg-collapsed-final.png

      - name: Source assertions
        run: |
          grep -q 'xtregCircleBadge' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'dep.setPreferredSize(new Dimension(100, 32))' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'String expanded = glyph.isBlank()' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'VERSION = "1.3.2"' src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Upload final audit previews
        uses: actions/upload-artifact@v4
        with:
          name: ui-polish-v132
          path: |
            /tmp/xtreg-expanded-final.png
            /tmp/xtreg-collapsed-final.png
          if-no-files-found: error

      - name: Commit clean final audited tree
        shell: bash
        run: |
          rm -f scripts/apply_ui_polish_v132.py .github/workflows/ui-polish-v132.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar scripts .github/workflows
          git commit -m 'Polish audited xtreg layout and sidebar [ui-audit]' || exit 0
          git push
