name: Temporary multivariate graphics rebuild

on:
  push:
    branches:
      - ui-consistency-audit-20260815
    paths:
      - .hx-multivariate-graphs-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch multivariate Graphics navigation
        run: python tools/tmp_patch_multivariate_graphs.py
      - name: Fix verifier source variable names
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_static_contracts.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('not in resolver:', 'not in resolve:')
          s = s.replace('not in java_source:', 'not in java:')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release and static contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxregistry.ado hxresolve.ado hxsemantics.ado src/main/java/com/hexie/stata/HxWorkbench.java tools/verify_static_contracts.py hxempirical-release.zip hxempirical-release.index release
          git diff --cached --quiet && exit 0
          git commit -m "Replace multivariate Graphics estimators with native graph commands"
          git push origin HEAD:ui-consistency-audit-20260815
