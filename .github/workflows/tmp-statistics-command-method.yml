name: Temporary Statistics command-method parity rebuild

on:
  push:
    branches:
      - ui-consistency-audit-20260815
    paths:
      - .hx-statistics-command-method-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Statistics command-method helper
        run: python tools/tmp_prepare_statistics_command_method_helper.py
      - name: Patch Statistics command-method parity
        run: python tools/tmp_patch_statistics_command_method.py
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release and static contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hexie/stata/HxWorkbench.java tools/verify_static_contracts.py hxempirical-release.zip hxempirical-release.index release
          git diff --cached --quiet && exit 0
          git commit -m "Align Statistics command path classification with native registry"
          git push origin HEAD:ui-consistency-audit-20260815
