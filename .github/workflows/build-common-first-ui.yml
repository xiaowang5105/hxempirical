name: Build common-first UI

on:
  push:
    branches:
      - ui-common-first

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[generated-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source, build JAR, and smoke-test UI
        shell: bash
        run: |
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            '' \
            | base64 -d | gunzip > /tmp/rebuild-common-first.sh
          chmod +x /tmp/rebuild-common-first.sh
          /tmp/rebuild-common-first.sh
