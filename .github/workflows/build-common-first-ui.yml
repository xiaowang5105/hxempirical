name: Build common-first UI

on:
  push:
    branches:
      - ui-common-first

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[generated-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Vineflower
        run: curl -L --fail --retry 3 -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar

      - name: Recover current Java source
        run: |
          rm -rf recovered
          mkdir -p recovered
          java -jar vineflower.jar hxworkbench.jar recovered
          test -f recovered/com/hexie/stata/HxWorkbench.java

      - name: Repair recovered source and apply common-first regress UI
        shell: bash
        run: |
          cat > /tmp/ui.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/ui.patch.gz.b64 | gunzip > /tmp/ui.patch
          cd recovered/com/hexie/stata
          patch -p0 < /tmp/ui.patch

      - name: Create compile-only Stata SFI stubs
        run: |
          mkdir -p build-stubs/com/stata/sfi
          cat > build-stubs/com/stata/sfi/Characteristic.java <<'EOF'
package com.stata.sfi;
public final class Characteristic { public static String getDtaChar(String s){return "";} }
EOF
          cat > build-stubs/com/stata/sfi/Data.java <<'EOF'
package com.stata.sfi;
public final class Data {
 public static String getFormattedValue(int v,long o,boolean b){return "";}
 public static double getNum(int v,long o){return 0;}
 public static long getObsTotal(){return 0;}
 public static String getStr(int v,long o){return "";}
 public static int getVarCount(){return 0;}
 public static String getVarFormat(int v){return "";}
 public static int getVarIndex(String s){return 0;}
 public static String getVarLabel(int v){return "";}
 public static String getVarName(int v){return "";}
 public static boolean isVarTypeString(int v){return false;}
}
EOF
          cat > build-stubs/com/stata/sfi/Frame.java <<'EOF'
package com.stata.sfi;
public class Frame {
 public static Frame connect(String s){return new Frame();}
 public static Frame create(String s){return new Frame();}
 public void drop(){}
 public String getFormattedValue(int v,long o,boolean b){return "";}
 public double getNum(int v,long o){return 0;}
 public long getObsTotal(){return 0;}
 public String getStr(int v,long o){return "";}
 public int getVarCount(){return 0;}
 public int getVarIndex(String s){return 0;}
 public String getVarName(int v){return "";}
 public boolean isVarTypeString(int v){return false;}
}
EOF
          cat > build-stubs/com/stata/sfi/Macro.java <<'EOF'
package com.stata.sfi;
public final class Macro { public static String getGlobal(String s){return "";} }
EOF
          cat > build-stubs/com/stata/sfi/Missing.java <<'EOF'
package com.stata.sfi;
public final class Missing { public static boolean isMissing(double d){return false;} }
EOF
          cat > build-stubs/com/stata/sfi/SFIToolkit.java <<'EOF'
package com.stata.sfi;
public final class SFIToolkit {
 public static void displayln(String s){}
 public static void errorln(String s){}
 public static int executeCommand(String s,boolean b){return 0;}
 public static String stackTraceToString(Throwable t){return t.toString();}
}
EOF
          cat > build-stubs/com/stata/sfi/Scalar.java <<'EOF'
package com.stata.sfi;
public final class Scalar { public static double getValue(String s){return 0;} }
EOF

      - name: Compile Java 11 compatible workbench
        run: |
          rm -rf build/classes
          mkdir -p build/classes
          javac --release 11 -encoding UTF-8 -d build/classes \
            $(find build-stubs -name '*.java') \
            recovered/com/hexie/stata/HxWorkbench.java
          javap -classpath build/classes -verbose com.hexie.stata.HxWorkbench | grep 'major version: 55'

      - name: Build workbench JAR
        run: |
          printf 'Manifest-Version: 1.0\nCreated-By: HX Empirical Workbench\n\n' > build/MANIFEST.MF
          (cd build/classes && jar cfm "$GITHUB_WORKSPACE/hxworkbench.jar" "$GITHUB_WORKSPACE/build/MANIFEST.MF" com/hexie/stata)
          test "$(jar tf hxworkbench.jar | grep '^com/hexie/stata/.*\\.class$' | wc -l)" -eq 44

      - name: Offline UI smoke tests
        run: |
          for mode in render-home-preview render-method-preview render-workflow-preview render-regress-preview; do
            xvfb-run -a java -cp build/classes com.hexie.stata.HxWorkbench --$mode /tmp/$mode.png | grep HX_UI_PREVIEW_OK
          done

      - name: Save recovered source
        run: |
          mkdir -p src/main/java/com/hexie/stata
          cp recovered/com/hexie/stata/HxWorkbench.java src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Commit generated source and JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxworkbench.jar src/main/java/com/hexie/stata/HxWorkbench.java
          git commit -m "[generated-ui] Recover current Java source and simplify regress page"
          git push
