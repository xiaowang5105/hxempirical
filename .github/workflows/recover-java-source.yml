name: Recover Java source

on:
  push:
    branches:
      - recover-java-source

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Vineflower
        run: curl -L --fail --retry 3 -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
      - name: Decompile current workbench JAR
        run: |
          mkdir -p recovered
          java -jar vineflower.jar hxworkbench.jar recovered
          find recovered -type f -maxdepth 8 -print
      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: recovered-java-source-vineflower
          path: recovered/
          if-no-files-found: error
