name: Recover Java source

on:
  push:
    branches:
      - recover-java-source

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CFR
        run: curl -L --fail --retry 3 -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
      - name: Decompile current workbench JAR
        run: |
          mkdir -p recovered
          java -jar cfr.jar hxworkbench.jar --outputdir recovered
          find recovered -type f -maxdepth 8 -print
      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: recovered-java-source
          path: recovered/
          if-no-files-found: error
