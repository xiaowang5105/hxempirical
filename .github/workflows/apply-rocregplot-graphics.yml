name: Apply rocregplot Graphics patch

on:
  push:
    branches: [ui-consistency-audit-20260815]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align patcher anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/prepare_rocregplot_graphics.py')
          s = p.read_text(encoding='utf-8')

          old = '''    'Arrays.asList("event_plot", "marginsplot", "coefplot").contains(command)',
              'Arrays.asList("rocregplot", "event_plot", "marginsplot", "coefplot").contains(command)',
              label="result graph task hint",
          )'''
          new = '''    'Arrays.asList("event_plot", "marginsplot", "coefplot").contains(command)',
              'Arrays.asList("rocregplot", "event_plot", "marginsplot", "coefplot").contains(command)',
              expected=2,
              label="result graph task hint",
          )'''
          if s.count(old) != 1:
              raise SystemExit('patcher task-hint anchor mismatch')
          s = s.replace(old, new)

          old = '''    expected=1,
              label="static special_open",
          )'''
          new = '''    expected=2,
              label="static special_open",
          )'''
          if s.count(old) != 1:
              raise SystemExit('patcher static special_open anchor mismatch')
          s = s.replace(old, new)

          redundant = '''static = replace_exact(
              static,
              '\"sts_graph\", \"roctab\", \"roccomp\", \"rocgold\", \"screeplot\"',
              '\"sts_graph\", \"roctab\", \"roccomp\", \"rocgold\", \"rocregplot\", \"screeplot\"',
              expected=1,
              label="structured route loop",
          )

          '''
          if s.count(redundant) != 1:
              raise SystemExit('patcher redundant static block mismatch')
          s = s.replace(redundant, '')

          start = s.index('# Strong catalog coverage gate:')
          end_line = 'static = replace_exact(static, coverage_anchor, coverage_block, label="catalog coverage gate")'
          end = s.index(end_line, start) + len(end_line)
          stable = '''# Strong catalog coverage gate: only setting/estimation commands are intentionally non-special in Graphics.
          coverage_anchor = ''' + '"""' + '''    if graph_cmd not in special_open:
              fail(f"structured Graphics route contract missing: {graph_cmd}")
          ''' + '"""' + '''
          coverage_block = coverage_anchor + ''' + '"""' + '''intentional_non_special_graphics = {"set", "rocfit", "rocreg"}
          for graph_cmd in set(local_words(registry, "graph_cmds")) - intentional_non_special_graphics:
              if f'"{graph_cmd}"' not in special_open:
                  fail(f"Graphics catalog command unexpectedly falls back to generic page: {graph_cmd}")
          ''' + '"""' + '''
          static = replace_exact(static, coverage_anchor, coverage_block, label="catalog coverage gate")'''
          s = s[:start] + stable + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply rocregplot source patch
        run: python tools/prepare_rocregplot_graphics.py

      - name: Create Stata SFI compile stubs
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/hxclasses
          cat >/tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit {
            public static int executeCommand(String s, boolean b){return 0;}
            public static void displayln(String s){}
            public static void errorln(String s){}
            public static String stackTraceToString(Throwable t){return t==null?"":t.toString();}
          }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi;
          public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi;
          public class Macro { public static String getGlobal(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi;
          public class Missing { public static boolean isMissing(double v){return Double.isNaN(v);} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi;
          public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            public static long getObsTotal(){return 0L;}
            public static int getVarCount(){return 0;}
            public static int getVarIndex(String s){return 0;}
            public static String getVarName(int i){return "";}
            public static String getVarLabel(int i){return "";}
            public static String getVarFormat(int i){return "";}
            public static boolean isVarTypeString(int i){return false;}
            public static double getNum(int i,long j){return Double.NaN;}
            public static String getStr(int i,long j){return "";}
            public static String getFormattedValue(int i,long j,boolean b){return "";}
          }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi;
          public class Frame {
            public static Frame connect(String s){return new Frame();}
            public static Frame create(String s){return new Frame();}
            public void drop(){}
            public long getObsTotal(){return 0L;}
            public int getVarCount(){return 0;}
            public int getVarIndex(String s){return 0;}
            public String getVarName(int i){return "";}
            public boolean isVarTypeString(int i){return false;}
            public double getNum(int i,long j){return Double.NaN;}
            public String getStr(int i,long j){return "";}
            public String getFormattedValue(int i,long j,boolean b){return "";}
          }
          EOF

      - name: Compile Java 11
        run: javac --release 11 -Xmaxerrs 200 -d /tmp/hxclasses /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Verify static and managed release contracts
        run: |
          python tools/verify_static_contracts.py
          python tools/verify_release.py

      - name: Remove one-shot files
        run: rm tools/prepare_rocregplot_graphics.py .github/workflows/apply-rocregplot-graphics.yml

      - name: Commit rocregplot source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Structure rocregplot as result-based Graphics page"
          git push
