name: Patch README Codex install guidance

on:
  push:
    branches: [readme-codex-install-20260814]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply README Codex install guidance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readme-codex-install-20260814
          fetch-depth: 0
      - name: Patch README
        run: python .github/scripts/patch_readme_codex.py
      - name: Verify README guidance
        run: |
          grep -F '### 推荐：让 Codex 帮你安装' README.md
          grep -F '请帮我在这台电脑上安装 `hxempirical`' README.md
          grep -F '### 2026-08-14 17:06（UTC+8）' README.md
          git diff --check
      - name: Commit README
        run: |
          git config user.name 'xiaowang5105'
          git config user.email '2692127923@qq.com'
          git add README.md
          git commit -m 'Apply README Codex install guidance'
          git push origin HEAD:readme-codex-install-20260814
