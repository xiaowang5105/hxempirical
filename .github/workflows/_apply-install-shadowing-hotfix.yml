name: Apply install shadowing hotfix

on:
  push:
    branches: [hotfix/install-shadowing-v1513]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/install-shadowing-v1513
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source hotfix
        run: python tools/_apply_install_shadowing_hotfix.py

      - name: Verify installer contracts
        run: python tools/verify_installer_contracts.py

      - name: Verify static contracts
        run: python tools/verify_static_contracts.py

      - name: Verify Statistics catalog
        run: python tools/verify_statistics_catalog.py

      - name: Commit permanent hotfix only
        shell: bash
        run: |
          rm -f tools/_apply_install_shadowing_hotfix.py
          rm -f .github/workflows/_apply-install-shadowing-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md INSTALL.md hxempirical.ado hxempirical.pkg hxempirical.sthlp hxinstall.do hxinstaller.ado src/main/java/com/hexie/stata/HxWorkbench.java tools/verify_installer_contracts.py tests/installer_shadowing_smoke.do tools/_apply_install_shadowing_hotfix.py .github/workflows/_apply-install-shadowing-hotfix.yml
          git diff --cached --check
          git commit -m "fix: prevent ado-path version shadowing"
          git push origin HEAD:hotfix/install-shadowing-v1513
