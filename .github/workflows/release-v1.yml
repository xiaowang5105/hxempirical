name: Prepare v1.0.0 release metadata

on:
  push:
    branches:
      - release-v1.0.0

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply release migration
        run: python3 tools/release_v1.py
      - name: Validate release metadata
        run: |
          grep -Fq 'd Version 1.0.0' hxempirical.pkg
          grep -Fq 'd Distribution-Date: 20260812' hxempirical.pkg
          grep -Fq '*! hxempirical 1.0.0  12aug2026' hxempirical.ado
          grep -Fq 'return local version "1.0.0"' hxempirical.ado
          grep -Fq '{* *! version 1.0.0  12aug2026}{...}' hxempirical.sthlp
          grep -Fq '当前发布版本：**1.0.0**' README.md
          awk '$1=="f" {print $2}' hxempirical.pkg | while read -r file; do
            test -f "$file" || { echo "missing package file: $file"; exit 1; }
          done
          echo HX_RELEASE_1_0_0_VALIDATION_OK
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hxempirical.pkg hxempirical.ado hxempirical.sthlp
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit"
          else
            git commit -m "Release hxempirical 1.0.0"
            git push
          fi
