name: Selfcheck v1.4.0

on:
  push:
    branches: [selfcheck-v140-20260813]
    paths: ['.github/workflows/selfcheck-v140.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'public static final String VERSION = "1.4.0"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'HxWorkbench 1.4.0' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '^\*! hxempirical 1.4.0' hxempirical.ado
          grep -q '版本：.*1.4.0' hxempirical.ado
          grep -q 'return local version "1.4.0"' hxempirical.ado
          grep -q '^d Version 1.4.0$' hxempirical.pkg
          grep -q 'version 1.4.0' hxempirical.sthlp

      - name: Compile Java 11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sfi /tmp/classes
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class SFIToolkit { public static final List<String> commands=new ArrayList<>(); public static int executeCommand(String s, boolean b){commands.add(s);return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class Characteristic { private static final Map<String,String>M=new HashMap<>(); public static String getDtaChar(String s){return M.getOrDefault(s,"");} public static void setDtaChar(String s,String v){M.put(s,v);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            static final String[] N={"firm","year","y","x1","x2","Size","Lev","ROA"};
            public static long getObsTotal(){return 20L;} public static int getVarCount(){return N.length;}
            public static String getVarName(int i){return i>=1&&i<=N.length?N[i-1]:"";}
            public static String getVarLabel(int i){return i>=1&&i<=N.length?"label_"+N[i-1]:"";}
            public static String getVarFormat(int i){return "%9.0g";}
            public static int getVarIndex(String s){for(int i=0;i<N.length;i++)if(N[i].equals(s))return i+1;return -1;}
            public static boolean isVarTypeString(int i){return false;}
            public static double getNum(int i,long j){return i*100+j;}
            public static String getStr(int i,long j){return "";}
            public static String getFormattedValue(int i,long j){return String.valueOf(getNum(i,j));}
            public static String getFormattedValue(int i,long j,boolean b){return getFormattedValue(i,j);}
            public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public String getVarLabel(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf /tmp/hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s /tmp/hxworkbench.jar

      - name: UI linkage and layout audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/SelfcheckV140.java <<'EOF'
          import java.awt.*; import java.lang.reflect.*; import java.util.*; import javax.swing.*; import javax.swing.table.*;
          public class SelfcheckV140 {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void ck(boolean v,String s){if(!v)throw new AssertionError(s);}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static java.util.List<Component> all(Component c){java.util.List<Component> z=new ArrayList<>();z.add(c);if(c instanceof Container)for(Component x:((Container)c).getComponents())z.addAll(all(x));return z;}
            static int rowOf(JTable t,String name){for(int r=0;r<t.getRowCount();r++)if(name.equals(String.valueOf(t.getValueAt(r,0))))return r;return -1;}
            static String selectedName(JTable t){int r=t.getSelectedRow();return r>=0?String.valueOf(t.getValueAt(r,0)):"";}
            public static void main(String[] args)throws Exception{
              final Throwable[] err={null};
              SwingUtilities.invokeAndWait(()->{try{
                Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");
                Constructor<?> ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame fr=(JFrame)ct.newInstance(false);
                m(c,"showXtregWizardPageV130").invoke(fr);m(c,"refreshDataset",boolean.class).invoke(fr,false);m(c,"refreshInspectorVariables").invoke(fr);
                fr.setSize(1672,901);fr.addNotify();fr.validate();layout(fr.getContentPane());m(c,"applyDividerRatios").invoke(fr);layout(fr.getContentPane());
                JSplitPane outer=(JSplitPane)f(c,"dataSummarySplit").get(fr), lower=(JSplitPane)f(c,"inspectorLowerSplit").get(fr);
                ck(outer!=null&&lower!=null,"three-level split missing");
                int oh=outer.getHeight(), topH=outer.getTopComponent().getHeight();
                ck(oh>0,"outer split has no height");
                double topRatio=(double)topH/oh;
                ck(topRatio>=0.18&&topRatio<=0.42,"current-data ratio wrong after applyDividerRatios: "+topRatio);
                ck(lower.getTopComponent().getHeight()>80,"variable window collapsed");ck(lower.getBottomComponent().getHeight()>80,"property window collapsed");

                JTable vt=(JTable)f(c,"inspectorVariableTable").get(fr);JTextField q=(JTextField)f(c,"inspectorVariableFilter").get(fr);JLabel role=(JLabel)f(c,"inspectorRoleLabel").get(fr);JTable dt=(JTable)f(c,"dataTable").get(fr);
                ck(vt.getRowCount()==8,"variable window row count="+vt.getRowCount());ck(vt.getColumnCount()==2,"variable window columns");ck(vt.getTransferHandler()!=null,"variable window no drag source");
                q.setText("ROA");m(c,"refreshInspectorVariables").invoke(fr);ck(vt.getRowCount()==1&&"ROA".equals(String.valueOf(vt.getValueAt(0,0))),"filter mismatch");q.setText("");m(c,"refreshInspectorVariables").invoke(fr);

                JComboBox<?> dep=(JComboBox<?>)f(c,"xtregDepVar").get(fr);JList<?> xs=(JList<?>)f(c,"xtregIndepList").get(fr);
                dep.setSelectedItem("y");xs.setSelectedIndices(new int[]{3,4});
                int ry=rowOf(vt,"y");ck(ry>=0,"y missing in variable window");vt.setRowSelectionInterval(ry,ry);m(c,"syncInspectorSelectionFromVariableWindow").invoke(fr);ck(role.getText().contains("因变量 Y"),"Y role mismatch: "+role.getText());ck(dt.getSelectedColumn()>=0&&"y".equals(dt.getColumnName(dt.getSelectedColumn())),"variable-window -> data-table sync failed");
                int rx=rowOf(vt,"x1");vt.setRowSelectionInterval(rx,rx);m(c,"syncInspectorSelectionFromVariableWindow").invoke(fr);ck(role.getText().contains("解释变量 X"),"X role mismatch: "+role.getText());

                int targetCol=-1;for(int i=0;i<dt.getColumnCount();i++)if("ROA".equals(dt.getColumnName(i)))targetCol=i;ck(targetCol>=0,"ROA data column missing");dt.setColumnSelectionInterval(targetCol,targetCol);if(dt.getRowCount()>0)dt.setRowSelectionInterval(0,0);m(c,"updateSelectedColumnSummary").invoke(fr);ck("ROA".equals(selectedName(vt)),"data-table -> variable-window sync failed; selected="+selectedName(vt));

                int chips=0;JButton oneChip=null;for(Component x:all(fr)){if(x instanceof JButton&&((JButton)x).getText()!=null&&((JButton)x).getText().contains("×")){chips++;if(oneChip==null)oneChip=(JButton)x;}}ck(chips>=2,"X chip basket did not show selected variables");int before=xs.getSelectedIndices().length;oneChip.doClick();ck(xs.getSelectedIndices().length==before-1,"chip removal failed");

                fr.setSize(1280,720);fr.validate();layout(fr.getContentPane());m(c,"applyDividerRatios").invoke(fr);layout(fr.getContentPane());int radios=0;for(Component x:all(fr))if(x instanceof JRadioButton&&Arrays.asList("固定效应（FE）","随机效应（RE）","between","population-averaged").contains(((JRadioButton)x).getText())){radios++;ck(x.getWidth()>20&&x.getHeight()>15,"collapsed radio: "+((JRadioButton)x).getText());}ck(radios==4,"radio count="+radios);
                fr.dispose();
              }catch(Throwable t){err[0]=t;}});
              if(err[0]!=null)throw new RuntimeException(err[0]);
              System.out.println("SELFCHECK_V140_UI_OK");
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/SelfcheckV140.java
          xvfb-run -a java -cp /tmp/classes SelfcheckV140

      - name: Preview smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          for mode in home regress monitor-details oneclick graph did; do
            xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-${mode}-preview /tmp/${mode}.png
            test -s /tmp/${mode}.png
          done
