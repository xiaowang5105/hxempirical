name: UI redesign 1.2.0

on:
  push:
    branches:
      - ui-redesign-1.2.0

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Patch, compile and render previews
        run: bash tools/audit_ui_120.sh
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: hx-ui-1.2.0-previews
          path: build/previews/*.png
      - name: Commit production UI and JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          git commit -m "Redesign workbench interface for 1.2.0"
          git push
