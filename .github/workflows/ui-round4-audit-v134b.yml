name: Fourth-round UI audit v1.3.4 rerun
on:
  push:
    branches: [ui-selfcheck-v134-round4]
    paths: ['.github/workflows/ui-round4-audit-v134b.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with Stata stubs
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/round4
          printf '%s\n' 'package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }' > /tmp/sfi/com/stata/sfi/SFIToolkit.java
          printf '%s\n' 'package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }' > /tmp/sfi/com/stata/sfi/Characteristic.java
          printf '%s\n' 'package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }' > /tmp/sfi/com/stata/sfi/Macro.java
          printf '%s\n' 'package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }' > /tmp/sfi/com/stata/sfi/Missing.java
          printf '%s\n' 'package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }' > /tmp/sfi/com/stata/sfi/Scalar.java
          printf '%s\n' 'package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }' > /tmp/sfi/com/stata/sfi/Data.java
          printf '%s\n' 'package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }' > /tmp/sfi/com/stata/sfi/Frame.java
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf /tmp/rebuilt.jar -C /tmp/classes com/hexie/stata
          test -s /tmp/rebuilt.jar
          unzip -p hxworkbench.jar com/hexie/stata/HxWorkbench.class | strings | grep -q '1.3.4'
      - name: Runtime grouped-navigation audit
        shell: bash
        run: |
          cat > /tmp/Round4Audit.java <<'EOF'
          import java.awt.*; import java.lang.reflect.*; import java.util.*; import javax.swing.*;
          public class Round4Audit{
            static Field f(Class<?>c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;} static Method m(Class<?>c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;} static void ck(boolean v,String s){if(!v)throw new AssertionError(s);} static void lay(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)lay((Container)x);} static void settle(JFrame f,int w,int h){f.setSize(w,h);f.setVisible(true);f.validate();lay(f.getContentPane());Toolkit.getDefaultToolkit().sync();} static String key(Class<?>c,Object o)throws Exception{return Objects.toString(f(c,"activeSidebarKey").get(o),"");} static int labels(Container c,String s){int n=0;for(Component x:c.getComponents()){if(x instanceof JLabel&&s.equals(((JLabel)x).getText()))n++;if(x instanceof Container)n+=labels((Container)x,s);}return n;} static void need(JFrame fr,String...ss){for(String s:ss)ck(labels(fr.getContentPane(),s)>0,"missing label: "+s);} 
            public static void main(String[]a)throws Exception{final Throwable[]e={null};SwingUtilities.invokeAndWait(()->{try{Class<?>c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?>ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame fr=(JFrame)ct.newInstance(true);fr.addNotify();int[][] zs={{1920,1080},{1600,900},{1366,768},{1280,720}};
              m(c,"showHomePage").invoke(fr);settle(fr,1366,768);ck("home".equals(key(c,fr)),"home active");
              m(c,"browseCategoryOverview",String.class).invoke(fr,"data");for(int[]z:zs)settle(fr,z[0],z[1]);ck("data".equals(key(c,fr)),"data active");need(fr,"导入与检查","变量与样本","合并与结构");
              m(c,"browseCategoryOverview",String.class).invoke(fr,"stats");for(int[]z:zs)settle(fr,z[0],z[1]);ck("stats".equals(key(c,fr)),"stats active");need(fr,"描述与比较","回归与模型","时间与面板数据","进阶与结构","因果与结构模型","扩展方法");
              m(c,"browseCategoryOverview",String.class).invoke(fr,"graph");for(int[]z:zs)settle(fr,z[0],z[1]);ck("graph".equals(key(c,fr)),"graph active");need(fr,"基础图形","分布与平滑","模型与诊断","多元与统计图","组合与管理");
              m(c,"browseMethod",String.class,String.class).invoke(fr,"stats","线性模型及相关");settle(fr,1366,768);need(fr,"常用命令","全部命令");
              m(c,"showXtregWizardPageV130").invoke(fr);settle(fr,1280,720);JScrollPane fs=(JScrollPane)f(c,"formScroll").get(fr);JPanel fp=(JPanel)f(c,"formPanel").get(fr);ck(fp.getWidth()<=fs.getViewport().getExtentSize().width+2,"xtreg horizontal overflow");
              m(c,"openBaselineRegressionWorkspace").invoke(fr);settle(fr,1280,720);ck("stats".equals(key(c,fr)),"baseline active");
              for(String cmd:new String[]{"histogram","kdensity","scatter","lfit","graph_box","twoway"}){m(c,"showSpecialGraphPage",String.class).invoke(fr,cmd);settle(fr,1280,720);ck("graph".equals(key(c,fr)),"graph special active "+cmd);ck(cmd.equals(Objects.toString(f(c,"currentCommand").get(fr),"")),"graph cmd "+cmd);}
              m(c,"populateOneClickPreviewState").invoke(fr);settle(fr,1280,720);ck("oneclick".equals(key(c,fr)),"oneclick active");JComponent r=(JComponent)f(c,"exactOneClickRoot").get(fr);ck(r!=null&&r.getWidth()>300,"oneclick root");JTable t=(JTable)f(c,"dataTable").get(fr);ck(t.getTableHeader().getTransferHandler()!=null&&!t.getTableHeader().getReorderingAllowed(),"header DnD config");fr.dispose();}catch(Throwable t){e[0]=t;}});if(e[0]!=null){e[0].printStackTrace();System.exit(2);}System.out.println("ROUND4_RUNTIME_AUDIT_OK");System.exit(0);}}
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/Round4Audit.java
          xvfb-run -a java -cp /tmp/classes Round4Audit
      - name: Official preview smoke tests
        shell: bash
        run: |
          for mode in home method graph oneclick regress; do xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-${mode}-preview /tmp/round4/${mode}.png; test -s /tmp/round4/${mode}.png; done
      - name: Package stale-version and file audit
        shell: bash
        run: |
          grep -q 'public static final String VERSION = "1.3.4"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '^\*! hxempirical 1.3.4 ' hxempirical.ado
          grep -q 'd Version 1.3.4' hxempirical.pkg
          grep -q '当前发布版本：1.3.4' README.md
          grep -q 'version 1.3.4' hxempirical.sthlp
          ! grep -R --exclude-dir=.git --exclude='ui-round4-audit-v134.yml' --exclude='ui-round4-audit-v134b.yml' -nE '当前发布版本：1\.2\.7|version 1\.2\.7|HxWorkbench 1\.3\.3|d Version 1\.3\.3' .
          awk '/^f /{print $2}' hxempirical.pkg | while read f; do test -f "$f" || { echo "missing package file: $f"; exit 1; }; done
          ! grep -q 'safe DID/event study' stata.toc
          echo ROUND4_PACKAGE_AUDIT_OK
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-round4-v134b
          path: /tmp/round4/*.png
