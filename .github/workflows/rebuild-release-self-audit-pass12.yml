name: Rebuild managed release after self-audit pass 12

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - .github/workflows/rebuild-release-self-audit-pass12.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - name: Rebuild managed release bundle
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release
        run: python tools/verify_release.py
      - name: Verify Stata static contracts
        run: python tools/verify_static_contracts.py
      - name: Commit release bundle updates
        run: |
          if git diff --quiet -- hxempirical-release.zip hxempirical-release.index release/hxempirical-release.b64.*; then
            echo "No release changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxempirical-release.zip hxempirical-release.index release/hxempirical-release.b64.*
          git commit -m "Rebuild managed release after self-audit fixes"
          git push origin HEAD:ui-consistency-audit-20260815
