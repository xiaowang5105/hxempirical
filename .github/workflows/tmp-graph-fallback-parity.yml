name: Temporary Graphics and Data fallback parity rebuild

on:
  push:
    branches:
      - ui-consistency-audit-20260815
    paths:
      - .hx-graph-fallback-parity-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact fallback patch helper
        run: python tools/tmp_prepare_graph_fallback_helper.py
      - name: Patch Graphics and Data fallback parity
        run: python tools/tmp_patch_graph_fallback_parity.py
      - name: Harden preview static-contract quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_static_contracts.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if 'cluster_dendrogram' in line and 'not in preview:' in line:
                  line = 'if \'cluster_dendrogram" local preview "cluster dendrogram"\' not in preview:'
              elif 'sts_graph' in line and 'not in preview:' in line:
                  line = 'if \'sts_graph" local preview "sts graph"\' not in preview:'
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release and static contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxregistry.ado hxresolve.ado hxpreview.ado hxsemantics.ado src/main/java/com/hexie/stata/HxWorkbench.java tools/verify_static_contracts.py hxempirical-release.zip hxempirical-release.index release
          git diff --cached --quiet && exit 0
          git commit -m "Align Graphics and Data fallbacks with native registry routes"
          git push origin HEAD:ui-consistency-audit-20260815
