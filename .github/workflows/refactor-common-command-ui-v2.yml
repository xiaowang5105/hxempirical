name: Refactor common command UI v2

on:
  push:
    branches:
      - ui-generic-common-first

permissions:
  contents: write

jobs:
  refactor-build-test:
    if: "${{ !contains(github.event.head_commit.message, '[generated-ui]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui-generic-common-first
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Refactor generic command pages
        run: python3 tools/refactor_common_command_ui.py
      - name: Compile and render UI smoke tests
        run: bash tools/build_ui_ci.sh
      - name: Commit generated source and JAR
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m '[generated-ui] Move low-frequency fields under more settings'
            git push origin HEAD:ui-generic-common-first
          fi
