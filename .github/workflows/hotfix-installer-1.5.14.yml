name: HX 1.5.14 installer hotfix builder

on:
  push:
    branches:
      - hotfix/installer-effective-path-1.5.14

permissions:
  contents: write

jobs:
  build-hotfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch installer path validation and version surfaces
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib
          import zipfile
          import tempfile
          import shutil

          root = Path.cwd()
          old = "1.5.13"
          new = "1.5.14"

          def read(rel):
              return (root / rel).read_text(encoding="utf-8")

          def write(rel, text):
              (root / rel).write_text(text.replace("\r\n", "\n").replace("\r", "\n"), encoding="utf-8", newline="\n")

          def replace_once(rel, before, after):
              text = read(rel)
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {rel}: {before!r}; found {count}")
              write(rel, text.replace(before, after, 1))

          # Fix the regression: string asis preserves the caller's quotes in target(),
          # while findfile returns an ordinary path.  The effective-path comparison
          # therefore sees two different strings even when they name the same file.
          replace_once("hxinstaller.ado", "*! hxinstaller 1.5.13  20aug2026", "*! hxinstaller 1.5.14  20aug2026")
          replace_once("hxinstaller.ado", "    syntax , TARGET(string asis) PACKAGEVERSION(string)", "    syntax , TARGET(string) PACKAGEVERSION(string)")

          installer = read("hxinstaller.ado")
          if "TARGET(string asis)" in installer:
              raise SystemExit("stale TARGET(string asis) remains in hxinstaller.ado")
          if "syntax , TARGET(string) PACKAGEVERSION(string)" not in installer:
              raise SystemExit("fixed effective-path syntax is missing")

          # Public package/version surfaces.
          text = read("hxempirical.ado")
          if text.count(old) < 3:
              raise SystemExit("unexpected hxempirical.ado version surface count")
          write("hxempirical.ado", text.replace(old, new))

          replace_once("hxinstall.do", "*! hxinstall 1.5.13  20aug2026", "*! hxinstall 1.5.14  20aug2026")

          offline = read("hxinstall_offline.do")
          if "1.5.13" in offline:
              write("hxinstall_offline.do", offline.replace("1.5.13", "1.5.14"))

          replace_once("hxempirical.pkg", "d Version 1.5.13", "d Version 1.5.14")
          replace_once("README.md", "当前发布版本：1.5.13", "当前发布版本：1.5.14")
          replace_once("INSTALL.md", "当前版本：1.5.13", "当前版本：1.5.14")
          replace_once("INSTALL.md", "最新版本：1.5.13", "最新版本：1.5.14")
          replace_once("hxempirical.sthlp", "{* *! version 1.5.13  20aug2026}{...}", "{* *! version 1.5.14  20aug2026}{...}")
          replace_once("hxempirical.sthlp", "HX empirical workbench, package version 1.5.13.", "HX empirical workbench, package version 1.5.14.")

          java_path = root / "src/main/java/com/hexie/stata/HxWorkbench.java"
          java = java_path.read_text(encoding="utf-8")
          marker = 'VERSION = "1.5.13"'
          if java.count(marker) != 1:
              raise SystemExit(f"unexpected Java VERSION marker count: {java.count(marker)}")
          java = java.replace(marker, 'VERSION = "1.5.14"', 1)
          java_path.write_text(java.replace("\r\n", "\n").replace("\r", "\n"), encoding="utf-8", newline="\n")

          # The hotfix changes only the same-length public VERSION constant in Java.
          # Patch that constant in the already production-built Java 11 classes,
          # preserving every other class byte.  This avoids recompiling against a
          # fake SFI API and keeps the shipped implementation identical otherwise.
          jar_path = root / "hxworkbench.jar"
          old_bytes = old.encode("utf-8")
          new_bytes = new.encode("utf-8")
          patched = 0
          with tempfile.TemporaryDirectory() as tmp:
              new_jar = Path(tmp) / "hxworkbench.jar"
              with zipfile.ZipFile(jar_path, "r") as src, zipfile.ZipFile(new_jar, "w") as dst:
                  for info in src.infolist():
                      data = src.read(info.filename)
                      if info.filename.endswith(".class"):
                          hits = data.count(old_bytes)
                          if hits:
                              data = data.replace(old_bytes, new_bytes)
                              patched += hits
                      dst.writestr(info, data)
              shutil.copyfile(new_jar, jar_path)
          if patched < 1:
              raise SystemExit("JAR did not contain the old public version constant")

          # Update the provenance marker to the canonical Git blob SHA-1 of the
          # modified Java source, matching tools/verify_hxworkbench_jar_sync.py.
          source = java_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          blob_sha = hashlib.sha1(f"blob {len(source)}\0".encode("ascii") + source).hexdigest()
          marker_path = root / "src/main/java/com/hexie/stata/HxWorkbench.jar-source"
          marker_text = (
              "# Git blob SHA-1 of src/main/java/com/hexie/stata/HxWorkbench.java used to build the shipped hxworkbench.jar.\n"
              "# This file is updated only by tools/build_hxworkbench_jar.ps1 after a successful build against Stata's real sfi-api.jar.\n"
              f"{blob_sha}\n"
          )
          marker_path.write_text(marker_text, encoding="utf-8", newline="\n")

          # Add a permanent static regression guard.
          contracts = read("tools/verify_installer_contracts.py")
          anchor = '''for needle in (\n    "_hxinstaller_effective",\n    "检测到当前生效路径与受管安装位置不一致",\n    "安装后的有效路径校验失败",\n):\n    if needle not in installer:\n        fail(f"installer effective-path gate missing: {needle}")\n'''
          guard = anchor + '''if "TARGET(string asis)" in installer:\n    fail("installer effective-path target must not preserve call-site quotes")\nif "syntax , TARGET(string) PACKAGEVERSION(string)" not in installer:\n    fail("installer effective-path target must use syntax string normalization")\n'''
          if anchor not in contracts:
              raise SystemExit("installer-contract insertion anchor not found")
          contracts = contracts.replace(anchor, guard, 1)
          write("tools/verify_installer_contracts.py", contracts)
          '@ | python -

      - name: Rebuild managed release bundle
        shell: pwsh
        run: ./tools/build_release_bundle.ps1

      - name: Verify hotfix release
        shell: pwsh
        run: |
          python tools/verify_release.py
          python tools/verify_hxworkbench_jar_sync.py
          python tools/verify_installer_contracts.py
          python tools/verify_static_contracts.py
          python tools/verify_statistics_catalog.py

      - name: Commit 1.5.14 release and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".github/workflows/hotfix-installer-1.5.14.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release hxempirical 1.5.14" -m "Fix false effective-path mismatch caused by quoted TARGET(string asis), add a regression guard, and rebuild the managed release artifacts."
          git push origin HEAD:hotfix/installer-effective-path-1.5.14
