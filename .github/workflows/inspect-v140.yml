name: Inspect v1.4.0 UI hooks
on:
  push:
    branches: [ui-inspector-v140]
    paths: ['.github/workflows/inspect-v140.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant source hooks
        shell: bash
        run: |
          set -e
          FILE=src/main/java/com/hexie/stata/HxWorkbench.java
          echo '=== fields ==='
          grep -n -E 'dataTable|DataTableModel|dataLabel|rightPaneTitle|xtregIndepList|xtregDepVar|xtregPanelVar|xtregTimeVar' "$FILE" | head -140
          echo '=== buildDataContainer ==='
          grep -n -A120 -B20 'private JComponent buildDataContainer' "$FILE" || true
          echo '=== updateSelectedColumnSummary ==='
          grep -n -A180 -B20 'private void updateSelectedColumnSummary' "$FILE" || true
          echo '=== installDataHeaderDragSupport ==='
          grep -n -A140 -B20 'installDataHeaderDragSupport' "$FILE" || true
          echo '=== refreshDataset ==='
          grep -n -A220 -B30 'private void refreshDataset' "$FILE" || true
          echo '=== xtreg ==='
          grep -n -A320 -B40 'this.xtregPanelVar = new JComboBox' "$FILE" || true
