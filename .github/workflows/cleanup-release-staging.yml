name: Cleanup release staging

on:
  push:
    paths:
      - '.cleanup-release-staging'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove staging payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_b64 .release_bin .release_u15 .cleanup-release-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Clean release staging files'
          git push
