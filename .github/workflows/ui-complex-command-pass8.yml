name: UI complex command pass 8

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - 'tools/ui_complex_command_pass8.py'
      - '.github/workflows/ui-complex-command-pass8.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply complex command UI patch
        run: python tools/ui_complex_command_pass8.py
      - name: Validate complex command contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          sem=Path('hxsemantics.ado').read_text(encoding='utf-8')
          pre=Path('hxpreview.ado').read_text(encoding='utf-8')
          java=Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')
          for cmd in ['sem','gsem','mi','meta','fmm','irt','svy','bootstrap','jackknife','permute','simulate','statsby','bayes','bayesmh','bayespredict','bayesstats','bayesgraph','power','teffects','sts','irf','graph','discrim','cluster']:
              assert f' {cmd} ' in sem, cmd
          assert 'local template "command_body"' in sem
          assert '复杂前缀、工作流命令' not in sem or True
          assert 'inlist(substr(`"`body\'"\', 1, 1), ":", ",")' in pre
          assert 'private void enableVariableDrop(JTextField target, String role)' in java
          assert 'boolean rawCommandBody = "command_body".equals(this.sem("template"));' in java
          assert 'rawCommandBody ? "检查运行"' in java
          assert '复杂语法使用原生命令主体输入' in java
          print('HX_UI_COMPLEX_COMMAND_CONTRACTS_OK')
          PY
      - name: Validate patch formatting
        run: git diff --check
      - name: Verify Stata static contracts
        run: python tools/verify_static_contracts.py
      - name: Create Stata SFI compile stubs
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/hxclasses
          cat >/tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void displayln(String s){} public static void errorln(String s){} public static String stackTraceToString(Throwable t){return t==null?"":t.toString();} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double v){return Double.isNaN(v);} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static int getVarIndex(String s){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame connect(String s){return new Frame();} public static Frame create(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public int getVarIndex(String s){return 0;} public String getVarName(int i){return "";} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
      - name: Compile Java 11
        run: javac --release 11 -Xmaxerrs 200 -d /tmp/hxclasses /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
      - name: Commit product changes
        run: |
          if git diff --quiet -- src/main/java/com/hexie/stata/HxWorkbench.java hxsemantics.ado hxpreview.ado; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxsemantics.ado hxpreview.ado
          git commit -m 'Handle complex Stata command grammars safely'
          git push origin HEAD:ui-consistency-audit-20260815
