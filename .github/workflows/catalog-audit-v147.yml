name: Catalog audit v1.4.7

on:
  push:
    branches: [ui-audit-v147]

permissions:
  contents: write

jobs:
  patch-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-audit-v147
          fetch-depth: 0

      - name: Patch catalog navigation and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor {label}: {text.count(old)}')
              return text.replace(old, new, 1)

          p = Path('hxregistry.ado')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '*! hxregistry 3.0.0  13aug2026',
              '*! hxregistry 3.1.0  14aug2026',
              'registry version')
          s = replace_once(s,
              'local stats_cmds "summarize tabstat tabulate table ttest prtest sdtest oneway anova ranksum median signrank signtest regress areg cnsreg rreg qreg iqreg bsqreg vwls eivreg sureg mvreg correlate pwcorr logit logistic probit hetprobit scobit cloglog ologit oprobit mlogit mprobit asclogit asmprobit poisson nbreg zip zinb tpoisson tnbreg fracreg betareg glm heckman heckprobit heckoprobit heckpoisson arima newey prais arch ucm dfuller pperron corrgram pergram var svar vec varsoc vargranger varstable irf spregress spivregress spxtregress xtreg xtlogit xtprobit xtpoisson xtnbreg xtgee xttobit xtcloglog xtintreg xtoprobit xtmlogit xtfrontier xtabond xtdpdsys mixed melogit meprobit mepoisson menbreg meologit meoprobit mestreg metobit meglm stset sts stcox streg stcrreg cc cs ir eregress eprobit eoprobit epoisson eintreg teffects etregress etpoisson didregress xtdidregress sem gsem fmm irt factor pca canon cca manova discrim cluster svy lasso elasticnet sqrtlasso dsregress poivregress xporegress xpoivregress meta mi npregress kdensity lowess lpoly bitesti tabi bootstrap jackknife permute simulate statsby power bayes bayesmh bayespredict bayesstats bayesgraph bma"',
              'local stats_cmds "summarize tabstat tabulate table ttest prtest sdtest oneway anova ranksum median signrank signtest test lincom regress areg reghdfe cnsreg rreg qreg iqreg bsqreg vwls eivreg sureg mvreg correlate pwcorr logit logistic probit hetprobit scobit cloglog ologit oprobit mlogit mprobit asclogit asmprobit poisson nbreg zip zinb tpoisson tnbreg ppmlhdfe fracreg betareg glm heckman heckprobit heckoprobit heckpoisson arima newey prais arch ucm dfuller pperron corrgram pergram var svar vec varsoc vargranger varstable irf spregress spivregress spxtregress xtreg xtlogit xtprobit xtpoisson xtnbreg xtgee xttobit xtcloglog xtintreg xtoprobit xtmlogit xtfrontier xtabond xtdpdsys mixed melogit meprobit mepoisson menbreg meologit meoprobit mestreg metobit meglm stset sts stcox streg stcrreg cc cs ir eregress eprobit eoprobit epoisson eintreg ivregress ivreghdfe teffects etregress etpoisson didregress xtdidregress sem gsem fmm irt factor pca canon cca manova discrim cluster svy lasso elasticnet sqrtlasso dsregress poivregress xporegress xpoivregress meta mi npregress kdensity lowess lpoly bitesti tabi bootstrap jackknife permute simulate statsby power bayes bayesmh bayespredict bayesstats bayesgraph bma predict margins"',
              'stats searchable catalog')
          s = replace_once(s,
              'local graph_cmds "twoway scatter line connected lfit qfit histogram kdensity dotplot graph_box lowess lpoly rvfplot rvpplot avplot avplots lvr2plot cprplot acprplot tsline xtline roctab rocfit roccomp rocgold rocreg marginsplot coefplot"',
              'local graph_cmds "twoway scatter line connected lfit qfit histogram kdensity dotplot graph_box lowess lpoly rvfplot rvpplot avplot avplots lvr2plot cprplot acprplot tsline xtline roctab rocfit roccomp rocgold rocreg marginsplot coefplot event_plot"',
              'graph searchable catalog')
          s = replace_once(s,
              "foreach cmd in `data_cmds' `stats_cmds' `reg_cmds' `post_cmds' `graph_cmds' `did_cmds' `oneclick_cmds' {",
              "foreach cmd in `data_cmds' `stats_cmds' `graph_cmds' `oneclick_cmds' {",
              'global search visible-catalog source')
          s = replace_once(s,
              '/* Exact top-level order shown by Stata 18 Statistics menu. */',
              '/* Stata 18 Statistics menu order, followed by explicit HX navigation entries for searchable extensions. */',
              'stats methods comment')
          s = replace_once(s,
              '贝叶斯分析 贝叶斯模型平均"',
              '贝叶斯分析 贝叶斯模型平均 工具变量与内生性 估计后分析"',
              'stats extension methods')
          s = replace_once(s,
              'else if inlist(`"`method\'"\', "线性模型及相关", "linear_related") local view "regress areg cnsreg rreg qreg iqreg bsqreg vwls eivreg sureg mvreg correlate pwcorr"',
              'else if inlist(`"`method\'"\', "线性模型及相关", "linear_related") local view "regress areg reghdfe cnsreg rreg qreg iqreg bsqreg vwls eivreg sureg mvreg correlate pwcorr"',
              'linear route')
          s = replace_once(s,
              'else if inlist(`"`method\'"\', "计数结果", "count_outcomes") local view "poisson nbreg zip zinb tpoisson tnbreg"',
              'else if inlist(`"`method\'"\', "计数结果", "count_outcomes") local view "poisson nbreg ppmlhdfe zip zinb tpoisson tnbreg"',
              'ppmlhdfe count route')
          s = replace_once(s,
              'else if inlist(`"`method\'"\', "贝叶斯模型平均", "bma") local view "bma"',
              'else if inlist(`"`method\'"\', "贝叶斯模型平均", "bma") local view "bma"\n    else if inlist(`"`method\'"\', "工具变量与内生性", "iv_extensions") local view "ivregress ivreghdfe"\n    else if inlist(`"`method\'"\', "估计后分析", "postestimation") local view "test lincom predict margins"',
              'stats extension routes')
          s = replace_once(s,
              'else if inlist(`"`method\'"\', "更多统计图形", "more_stat_graph") local view "marginsplot coefplot"',
              'else if inlist(`"`method\'"\', "更多统计图形", "more_stat_graph") local view "marginsplot coefplot event_plot"',
              'event plot visible route')
          p.write_text(s, encoding='utf-8')

          p = Path('src/main/java/com/hexie/stata/HxWorkbench.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('public static final String VERSION = "1.4.6";', 'public static final String VERSION = "1.4.7";')
          s = s.replace('SFIToolkit.displayln("HxWorkbench 1.4.6");', 'SFIToolkit.displayln("HxWorkbench 1.4.7");')
          s = replace_once(s,
              'case "线性模型及相关": return "regress · areg · qreg · correlate";',
              'case "线性模型及相关": return "regress · areg · reghdfe · qreg";',
              'linear preview')
          s = replace_once(s,
              'case "计数结果": return "poisson · nbreg · zinb";',
              'case "计数结果": return "poisson · nbreg · ppmlhdfe · zinb";',
              'count preview')
          s = replace_once(s,
              'case "贝叶斯模型平均": return "bma";',
              'case "贝叶斯模型平均": return "bma";\n            case "工具变量与内生性": return "ivregress · ivreghdfe";\n            case "估计后分析": return "test · lincom · predict · margins";',
              'extension previews')
          s = replace_once(s,
              'wanted = Arrays.asList("regress", "areg", "qreg", "correlate");',
              'wanted = Arrays.asList("regress", "areg", "reghdfe", "qreg", "correlate");',
              'linear preferred')
          s = replace_once(s,
              'wanted = Arrays.asList("poisson", "nbreg", "zip", "zinb");',
              'wanted = Arrays.asList("poisson", "nbreg", "ppmlhdfe", "zip", "zinb");',
              'count preferred')
          s = replace_once(s,
              '} else if ("分数结果".equals(method)) {\n            wanted = Arrays.asList("fracreg", "betareg");',
              '} else if ("工具变量与内生性".equals(method)) {\n            wanted = Arrays.asList("ivregress", "ivreghdfe");\n         } else if ("估计后分析".equals(method)) {\n            wanted = Arrays.asList("test", "lincom", "predict", "margins");\n         } else if ("分数结果".equals(method)) {\n            wanted = Arrays.asList("fracreg", "betareg");',
              'extension preferred')
          s = replace_once(s,
              '{"扩展方法", "正则化、插补、重抽样、效能与贝叶斯", new Color(57, 145, 183), new String[]{"Lasso回归", "Meta分析", "多重插补", "非参数分析", "精确统计", "重抽样", "效能，精度和样品含量", "贝叶斯分析", "贝叶斯模型平均"}}',
              '{"扩展方法", "正则化、插补、重抽样、效能与贝叶斯", new Color(57, 145, 183), new String[]{"Lasso回归", "Meta分析", "多重插补", "非参数分析", "精确统计", "重抽样", "效能，精度和样品含量", "贝叶斯分析", "贝叶斯模型平均"}},\n            {"扩展与第三方", "工具变量、内生性与估计后分析", new Color(71, 126, 188), new String[]{"工具变量与内生性", "估计后分析"}}',
              'stats extension band')
          s = replace_once(s,
              '"Lasso回归", "Meta分析", "多重插补", "非参数分析", "精确统计", "重抽样", "效能，精度和样品含量", "贝叶斯分析", "贝叶斯模型平均"\n            );',
              '"Lasso回归", "Meta分析", "多重插补", "非参数分析", "精确统计", "重抽样", "效能，精度和样品含量", "贝叶斯分析", "贝叶斯模型平均", "工具变量与内生性", "估计后分析"\n            );',
              'preview stats methods')
          s = replace_once(s,
              '} else if ("计数模型".equals(var0)) {\n            return Arrays.asList("poisson", "nbreg", "ppmlhdfe");',
              '} else if ("线性模型及相关".equals(var0)) {\n            return Arrays.asList("regress", "areg", "reghdfe", "qreg", "correlate");\n         } else if ("计数结果".equals(var0)) {\n            return Arrays.asList("poisson", "nbreg", "ppmlhdfe", "zip", "zinb");\n         } else if ("工具变量与内生性".equals(var0)) {\n            return Arrays.asList("ivregress", "ivreghdfe");\n         } else if ("估计后分析".equals(var0)) {\n            return Arrays.asList("test", "lincom", "predict", "margins");\n         } else if ("计数模型".equals(var0)) {\n            return Arrays.asList("poisson", "nbreg", "ppmlhdfe");',
              'preview exact stats routes')
          p.write_text(s, encoding='utf-8')

          for name in ['hxempirical.ado', 'hxempirical.sthlp']:
              p = Path(name)
              s = p.read_text(encoding='utf-8').replace('1.4.6', '1.4.7')
              p.write_text(s, encoding='utf-8')
          p = Path('hxempirical.pkg')
          s = p.read_text(encoding='utf-8').replace('d Version 1.4.6', 'd Version 1.4.7')
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**当前发布版本：1.4.6**', '**当前发布版本：1.4.7**', 1)
          import re
          s = re.sub(r'\*\*上次修改时间：[^\n]+\*\*', '**上次修改时间：2026-08-14 14:56（UTC+8）**', s, count=1)
          marker = '## 修改记录\n'
          note = '''## 修改记录\n\n### 2026-08-14 14:56（UTC+8）\n\n- 统一搜索与可视目录的数据源：全局搜索只从可见的“数据 / 统计 / 图形 / OneClick”目录聚合，旧 `reg/post/did` 兼容别名不再单独制造“只能搜索、无法点击到达”的条目。\n- `ppmlhdfe` 正式进入“统计 → 计数结果”；`reghdfe` 进入“统计 → 线性模型及相关”。\n- 新增“扩展与第三方”导航组，其中“工具变量与内生性”提供 `ivregress / ivreghdfe`，“估计后分析”提供 `test / lincom / predict / margins`。\n- `event_plot` 纳入“图形 → 更多统计图形”，保留可搜索能力同时提供可点击路径。\n- 增加目录一致性审查：搜索目录中的扩展命令必须能从可视目录进入。\n'''
          if marker not in s:
              raise SystemExit('README modification marker missing')
          s = s.replace(marker, note, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Audit search and directory consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('hxregistry.ado').read_text(encoding='utf-8')
          j = Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')

          def local(name):
              m = re.search(r'^\s*local\s+' + re.escape(name) + r'\s+"([^"]*)"', s, re.M)
              if not m: raise SystemExit('missing local '+name)
              return m.group(1).split()

          visible = set(local('data_cmds') + local('stats_cmds') + local('graph_cmds') + local('oneclick_cmds'))
          required = {
              'reghdfe','ppmlhdfe','ivregress','ivreghdfe','test','lincom','predict','margins','event_plot'
          }
          missing = sorted(required - visible)
          if missing: raise SystemExit('required searchable commands missing: '+str(missing))

          loop = re.search(r"foreach cmd in ([^\{]+)\{", s).group(1)
          if '`reg_cmds\'' in loop or '`post_cmds\'' in loop or '`did_cmds\'' in loop:
              raise SystemExit('global search still includes hidden compatibility catalogs: '+loop)
          for token in ["`data_cmds'", "`stats_cmds'", "`graph_cmds'", "`oneclick_cmds'"]:
              if token not in loop: raise SystemExit('visible catalog missing from global search: '+token)

          checks = {
              'count route': 'local view "poisson nbreg ppmlhdfe zip zinb tpoisson tnbreg"',
              'linear route': 'local view "regress areg reghdfe cnsreg rreg qreg iqreg bsqreg vwls eivreg sureg mvreg correlate pwcorr"',
              'iv route': 'local view "ivregress ivreghdfe"',
              'post route': 'local view "test lincom predict margins"',
              'event route': 'local view "marginsplot coefplot event_plot"',
          }
          for label, needle in checks.items():
              if needle not in s: raise SystemExit(label+' missing')

          for needle in [
              'case "计数结果": return "poisson · nbreg · ppmlhdfe · zinb";',
              'new String[]{"工具变量与内生性", "估计后分析"}',
              'return Arrays.asList("poisson", "nbreg", "ppmlhdfe", "zip", "zinb");',
              'return Arrays.asList("ivregress", "ivreghdfe");',
              'return Arrays.asList("test", "lincom", "predict", "margins");',
          ]:
              if needle not in j: raise SystemExit('Java navigation audit missing: '+needle)

          print('CATALOG_AUDIT_OK searchable=', len(visible), 'required=', sorted(required))
          PY

      - name: Create Stata SFI compile stubs
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit {
            public static int executeCommand(String s, boolean b){return 0;}
            public static void displayln(String s){}
            public static void errorln(String s){}
            public static String stackTraceToString(Throwable t){return "";}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi;
          public class Characteristic {
            public static String getGlobal(String s){return "";}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi;
          public class Macro {
            public static String getGlobal(String s){return "";}
            public static void setGlobal(String a,String b){}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi;
          public class Missing { public static boolean isMissing(double d){return false;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi;
          public class Scalar { public static double getValue(String s){return 0;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            public static long getObsTotal(){return 0;} public static int getVarCount(){return 0;}
            public static String getVarName(int i){return "";} public static int getVarIndex(String s){return 1;}
            public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long n){return 0;}
            public static String getStr(int i,long n){return "";} public static String getVarLabel(int i){return "";}
            public static String getVarFormat(int i){return "";} public static String getValueLabel(int i){return "";}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi;
          public class Frame {
            public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();}
            public void drop(){} public int getVarIndex(String s){return 1;} public boolean isVarTypeString(int i){return true;}
            public String getStr(int i,long n){return "";} public long getObsTotal(){return 0;} public int getVarCount(){return 0;}
          }
          EOF

      - name: Compile Java 11 and rebuild jar
        shell: bash
        run: |
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar
          javap -verbose -classpath hxworkbench.jar com.hexie.stata.HxWorkbench | grep 'major version: 55'

      - name: Verify release metadata
        shell: bash
        run: |
          grep -q 'Version 1.4.7' hxempirical.pkg
          grep -q 'hxempirical 1.4.7' hxempirical.ado
          grep -q 'version 1.4.7' hxempirical.sthlp
          grep -q 'VERSION = "1.4.7"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '当前发布版本：1.4.7' README.md

      - name: Commit audited production changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md hxempirical.ado hxempirical.pkg hxempirical.sthlp hxregistry.ado hxworkbench.jar src/main/java/com/hexie/stata/HxWorkbench.java
          git commit -m 'Unify searchable and navigable catalogs v1.4.7 [ui-audit]'
          git push origin HEAD:ui-audit-v147
