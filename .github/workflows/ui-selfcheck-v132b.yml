name: Extended UI self-check v1.3.2

on:
  push:
    branches: [ui-selfcheck-v132b]
    paths:
      - '.github/workflows/ui-selfcheck-v132b.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Stata SFI compile stubs
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-audit
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi;
          public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF

      - name: Compile Java 11
        run: |
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf /tmp/hxworkbench-audit.jar -C /tmp/classes com/hexie/stata
          test -s /tmp/hxworkbench-audit.jar

      - name: Build extended UI audit harness
        shell: bash
        run: |
          cat > /tmp/ExtendedUiAudit.java <<'EOF'
          import java.awt.*;
          import java.awt.datatransfer.StringSelection;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.lang.reflect.*;
          import java.util.*;
          import javax.imageio.ImageIO;
          import javax.swing.*;

          public class ExtendedUiAudit {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
            static AbstractButton button(Container c,String text){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&text.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=button((Container)x,text);if(b!=null)return b;}}return null;}
            static boolean insideViewport(Component comp,JViewport vp){
              if(comp==null||vp==null||!comp.isVisible())return false;
              Rectangle r=SwingUtilities.convertRectangle(comp.getParent(),comp.getBounds(),vp.getView());
              Rectangle vis=vp.getViewRect();
              return r.width>0&&r.height>0&&vis.intersects(r)&&vis.contains(new Point(Math.min(r.x+r.width/2,vis.x+vis.width-1),Math.min(r.y+r.height/2,vis.y+vis.height-1)));
            }
            static void render(JFrame frame,String path)throws Exception{Container c=frame.getContentPane();layout(c);BufferedImage im=new BufferedImage(c.getWidth(),c.getHeight(),BufferedImage.TYPE_INT_RGB);Graphics2D g=im.createGraphics();c.printAll(g);g.dispose();ImageIO.write(im,"png",new File(path));}
            static String activeKey(Class<?> c,Object frame)throws Exception{return String.valueOf(f(c,"activeSidebarKey").get(frame));}
            static void setSize(JFrame frame,int w,int h){frame.setSize(w,h);frame.getContentPane().setSize(w,h);frame.validate();layout(frame.getContentPane());}

            public static void main(String[] args)throws Exception{
              final Throwable[] err={null};
              SwingUtilities.invokeAndWait(()->{try{
                Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");
                Constructor<?> ctor=c.getDeclaredConstructor(boolean.class);ctor.setAccessible(true);
                JFrame frame=(JFrame)ctor.newInstance(true);
                frame.addNotify();

                // Home page: basic structure and active sidebar state.
                m(c,"showHomePage").invoke(frame);
                setSize(frame,1366,768);
                check("home".equals(activeKey(c,frame)),"home sidebar state wrong");
                check(button(frame.getContentPane(),"打开 Stata")!=null,"home: 打开 Stata missing");
                check(button(frame.getContentPane(),"帮助")!=null,"home: 帮助 missing");
                render(frame,"/tmp/ui-audit/home-1366.png");

                // Category pages: graph must activate graph, stats must activate stats.
                m(c,"browseCategoryOverview",String.class).invoke(frame,"stats");
                check("stats".equals(activeKey(c,frame)),"stats page does not activate stats sidebar");
                render(frame,"/tmp/ui-audit/stats-1366.png");
                m(c,"browseCategoryOverview",String.class).invoke(frame,"graph");
                check("graph".equals(activeKey(c,frame)),"graph page does not activate graph sidebar");
                render(frame,"/tmp/ui-audit/graph-1366.png");

                // xtreg page: test multiple window sizes, divider positions and sidebar modes.
                m(c,"showXtregWizardPageV130").invoke(frame);
                JSplitPane split=(JSplitPane)f(c,"commandDataSplit").get(frame);
                JScrollPane formScroll=(JScrollPane)f(c,"formScroll").get(frame);
                JPanel form=(JPanel)f(c,"formPanel").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> panel=(JComboBox<String>)f(c,"xtregPanelVar").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> time=(JComboBox<String>)f(c,"xtregTimeVar").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(frame);
                @SuppressWarnings("unchecked") JList<String> indep=(JList<String>)f(c,"xtregIndepList").get(frame);
                check(panel.getItemCount()>1&&dep.getItemCount()>1&&indep.getModel().getSize()>1,"xtreg preview variables not populated");

                int[][] sizes={{1920,1080},{1600,900},{1366,768},{1280,720}};
                double[] ratios={0.45,0.55,0.65};
                int shot=0;
                for(int[] sz:sizes){
                  for(double ratio:ratios){
                    setSize(frame,sz[0],sz[1]);
                    split.setDividerLocation(ratio);layout(frame.getContentPane());
                    JViewport vp=formScroll.getViewport();
                    check(form.getWidth()<=vp.getExtentSize().width+2,"horizontal overflow at "+sz[0]+"x"+sz[1]+" ratio "+ratio+": form="+form.getWidth()+" viewport="+vp.getExtentSize().width);
                    check(formScroll.getHorizontalScrollBarPolicy()==JScrollPane.HORIZONTAL_SCROLLBAR_NEVER,"horizontal scrollbar policy wrong");
                    AbstractButton run=button(form,"运行 xtreg");
                    AbstractButton clear=button(form,"清空设置");
                    AbstractButton pa=button(form,"population-averaged");
                    check(run!=null&&run.getWidth()>20,"run button clipped/missing at "+sz[0]+" ratio "+ratio);
                    check(clear!=null&&clear.getWidth()>20,"clear button clipped/missing at "+sz[0]+" ratio "+ratio);
                    check(pa!=null&&pa.getWidth()>20,"PA option clipped/missing at "+sz[0]+" ratio "+ratio);
                    check(dep.getHeight()>=24&&dep.getHeight()<=40,"dep selector bad height "+dep.getHeight()+" at "+sz[0]+" ratio "+ratio);
                    check(panel.getHeight()>=24&&panel.getHeight()<=40,"panel selector bad height "+panel.getHeight());
                    check(time.getHeight()>=24&&time.getHeight()<=40,"time selector bad height "+time.getHeight());
                    if(sz[0]==1366&&Math.abs(ratio-.55)<.001)render(frame,"/tmp/ui-audit/xtreg-expanded-1366.png");
                  }
                }

                // Drag/drop target behavior and multi-X accumulation.
                TransferHandler.TransferSupport tp=new TransferHandler.TransferSupport(panel,new StringSelection("make"));
                TransferHandler.TransferSupport tt=new TransferHandler.TransferSupport(time,new StringSelection("rep78"));
                TransferHandler.TransferSupport ty=new TransferHandler.TransferSupport(dep,new StringSelection("price"));
                TransferHandler.TransferSupport tx1=new TransferHandler.TransferSupport(indep,new StringSelection("mpg"));
                TransferHandler.TransferSupport tx2=new TransferHandler.TransferSupport(indep,new StringSelection("weight"));
                check(panel.getTransferHandler().importData(tp),"panel DnD failed");
                check(time.getTransferHandler().importData(tt),"time DnD failed");
                check(dep.getTransferHandler().importData(ty),"Y DnD failed");
                check(indep.getTransferHandler().importData(tx1),"X1 DnD failed");
                check(indep.getTransferHandler().importData(tx2),"X2 DnD failed");
                check("make".equals(panel.getSelectedItem()),"panel DnD selected wrong value");
                check("rep78".equals(time.getSelectedItem()),"time DnD selected wrong value");
                check("price".equals(dep.getSelectedItem()),"Y DnD selected wrong value");
                check(indep.getSelectedValuesList().contains("mpg")&&indep.getSelectedValuesList().contains("weight"),"multiple X drag selections not preserved");

                // Sidebar toggle must preserve split ratio closely and keep all nav buttons available.
                setSize(frame,1366,768);split.setDividerLocation(.55);layout(frame.getContentPane());
                int before=split.getDividerLocation();
                m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());
                JPanel sidebar=(JPanel)f(c,"sidebarPanel").get(frame);
                check(sidebar.getPreferredSize().width<=60,"sidebar did not collapse");
                int after=split.getDividerLocation();
                check(Math.abs(after-before)<=40,"sidebar collapse unexpectedly reset split: before="+before+" after="+after);
                @SuppressWarnings("unchecked") Map<String,JButton> nav=(Map<String,JButton>)f(c,"sidebarButtons").get(frame);
                for(String key:new String[]{"home","data","stats","graph","oneclick","history","settings"})check(nav.containsKey(key)&&nav.get(key).isVisible(),"missing sidebar button: "+key);
                render(frame,"/tmp/ui-audit/xtreg-collapsed-1366.png");
                m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());

                // Header drag source must be installed and column reordering disabled.
                JTable table=(JTable)f(c,"dataTable").get(frame);
                check(table.getTableHeader().getTransferHandler()!=null,"data header has no drag source TransferHandler");
                check(!table.getTableHeader().getReorderingAllowed(),"data header still allows column reordering, conflicts with drag source");

                frame.dispose();
              }catch(Throwable t){err[0]=t;}});
              if(err[0]!=null){err[0].printStackTrace();throw new RuntimeException(err[0]);}
              System.out.println("HX_EXTENDED_UI_AUDIT_OK");
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/ExtendedUiAudit.java

      - name: Run extended UI audit
        shell: bash
        run: |
          xvfb-run -a java -cp /tmp/classes ExtendedUiAudit

      - name: Static consistency checks
        shell: bash
        run: |
          grep -q 'VERSION = "1.3.2"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'd Version 1.3.2' hxempirical.pkg
          grep -q 'hxempirical 1.3.2' hxempirical.ado
          grep -q 'private static final class WidthTrackingPanel extends JPanel implements Scrollable' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'setHorizontalScrollBarPolicy(JScrollPane.HORIZONTAL_SCROLLBAR_NEVER)' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'refreshXtregVariableControls' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'installDataHeaderDragSupport' src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Upload audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-selfcheck-v132b
          path: /tmp/ui-audit/*.png
          if-no-files-found: error
