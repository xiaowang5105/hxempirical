name: Final 1.1.0 README record

on:
  push:
    branches:
      - task-workspaces-1.1.0-prod

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update README record
        run: python3 tools/update_readme_110_record.py
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Record final 1.1.0 task workspace fixes"
          git push
