name: Apply v1.4.2 resize fix

on:
  push:
    branches: [selfcheck-v141-deep-20260813]
    paths: ['.github/workflows/apply-v142-resize.yml']

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix
        run: python3 scripts/fix_v142_resize.py

      - name: Build Java 11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sfi /tmp/classes
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class SFIToolkit { public static final List<String> commands=new ArrayList<>(); public static int executeCommand(String s, boolean b){commands.add(s);return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class Characteristic { private static final Map<String,String>M=new HashMap<>(); public static String getDtaChar(String s){return M.getOrDefault(s,"");} public static void setDtaChar(String s,String v){M.put(s,v);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            static final String[] N={"firm","year","y","x1","x2","Size","Lev","ROA"};
            public static long getObsTotal(){return 20L;} public static int getVarCount(){return N.length;}
            public static String getVarName(int i){return i>=1&&i<=N.length?N[i-1]:"";}
            public static String getVarLabel(int i){return i>=1&&i<=N.length?"label_"+N[i-1]:"";}
            public static String getVarFormat(int i){return "%9.0g";}
            public static int getVarIndex(String s){for(int i=0;i<N.length;i++)if(N[i].equals(s))return i+1;return -1;}
            public static boolean isVarTypeString(int i){return false;}
            public static double getNum(int i,long j){return i*100+j;}
            public static String getStr(int i,long j){return "";}
            public static String getFormattedValue(int i,long j){return String.valueOf(getNum(i,j));}
            public static String getFormattedValue(int i,long j,boolean b){return getFormattedValue(i,j);}
            public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public String getVarLabel(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar

      - name: Runtime resize and interaction audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/V142Audit.java <<'EOF'
          import java.awt.*; import java.awt.datatransfer.*; import java.lang.reflect.*; import java.util.*; import javax.swing.*;
          public class V142Audit {
            static Class<?> C; static JFrame F; static Throwable ERR;
            static Field f(String n)throws Exception{Field x=C.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(String n,Class<?>...a)throws Exception{Method x=C.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void ck(boolean v,String s){if(!v)throw new AssertionError(s);}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static void edt(Runnable r)throws Exception{SwingUtilities.invokeAndWait(()->{try{r.run();}catch(Throwable t){ERR=t;}});if(ERR!=null){Throwable t=ERR;ERR=null;throw new RuntimeException(t);}}
            static boolean drop(JComponent t,String v){return t.getTransferHandler()!=null&&t.getTransferHandler().importData(new TransferHandler.TransferSupport(t,new StringSelection(v)));}
            static boolean has(JList<?> l,String v){return l.getSelectedValuesList().stream().anyMatch(x->v.equals(String.valueOf(x)));}
            static double ratio(JSplitPane s){return (double)s.getTopComponent().getHeight()/Math.max(1,s.getHeight());}
            public static void main(String[] z){try{run();System.out.println("V142_AUDIT_OK");System.exit(0);}catch(Throwable t){t.printStackTrace();try{if(F!=null)edt(()->F.dispose());}catch(Throwable ignored){}System.exit(2);}}
            static void run()throws Exception{
              C=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?> ct=C.getDeclaredConstructor(boolean.class);ct.setAccessible(true);
              edt(()->{try{F=(JFrame)ct.newInstance(false);m("showXtregWizardPageV130").invoke(F);m("refreshDataset",boolean.class).invoke(F,false);F.setSize(1672,901);F.addNotify();F.validate();layout(F.getContentPane());m("applyDividerRatios").invoke(F);}catch(Exception e){throw new RuntimeException(e);}});
              edt(()->{F.validate();layout(F.getContentPane());});
              JComboBox<?> panel=(JComboBox<?>)f("xtregPanelVar").get(F), time=(JComboBox<?>)f("xtregTimeVar").get(F), dep=(JComboBox<?>)f("xtregDepVar").get(F);JList<?> xs=(JList<?>)f("xtregIndepList").get(F);JTextArea preview=(JTextArea)f("previewArea").get(F);JSplitPane outer=(JSplitPane)f("dataSummarySplit").get(F), lower=(JSplitPane)f("inspectorLowerSplit").get(F), cmd=(JSplitPane)f("commandDataSplit").get(F);JButton side=(JButton)f("sidebarToggleButton").get(F);
              edt(()->{ck(drop((JComponent)panel,"firm"),"panel DnD");ck(drop((JComponent)time,"year"),"time DnD");ck(drop((JComponent)dep,"y"),"Y DnD");ck(drop((JComponent)xs,"x1")&&drop((JComponent)xs,"x2"),"X DnD");ck(has(xs,"x1")&&has(xs,"x2"),"X not cumulative");ck(preview.getText().contains("xtreg y x1 x2")||preview.getText().contains("xtreg y x2 x1"),"preview wrong "+preview.getText());});
              String p0=preview.getText();edt(()->{try{m("refreshDataset",boolean.class).invoke(F,false);}catch(Exception e){throw new RuntimeException(e);}ck("firm".equals(String.valueOf(panel.getSelectedItem()))&&"year".equals(String.valueOf(time.getSelectedItem()))&&"y".equals(String.valueOf(dep.getSelectedItem())),"refresh lost combos");ck(has(xs,"x1")&&has(xs,"x2"),"refresh lost X");ck(p0.equals(preview.getText()),"refresh changed preview");});

              // User-chosen vertical ratios survive refresh.
              final double[] user={0,0};edt(()->{outer.setDividerLocation(0.36);lower.setDividerLocation(0.60);F.validate();layout(F.getContentPane());user[0]=ratio(outer);user[1]=ratio(lower);try{m("refreshDataset",boolean.class).invoke(F,false);}catch(Exception e){throw new RuntimeException(e);}F.validate();layout(F.getContentPane());ck(Math.abs(ratio(outer)-user[0])<.06,"refresh reset outer");ck(Math.abs(ratio(lower)-user[1])<.06,"refresh reset lower");});

              // Natural window resizing: component-resize clamp must keep all inspector panes usable.
              int[][] sizes={{1600,900},{1366,768},{1280,720}};
              for(int[] s:sizes){edt(()->{F.setSize(s[0],s[1]);F.validate();layout(F.getContentPane());});edt(()->{F.validate();layout(F.getContentPane());});edt(()->{F.validate();layout(F.getContentPane());System.out.println("RESIZE "+s[0]+" top="+outer.getTopComponent().getHeight()+" vars="+lower.getTopComponent().getHeight()+" props="+lower.getBottomComponent().getHeight()+" cmd="+cmd.getLeftComponent().getWidth());ck(outer.getTopComponent().getHeight()>=85,"top collapsed @"+s[0]);ck(lower.getTopComponent().getHeight()>=70,"vars collapsed @"+s[0]);ck(lower.getBottomComponent().getHeight()>=70,"props collapsed @"+s[0]);ck(cmd.getLeftComponent().getWidth()>=340,"command too narrow @"+s[0]);});}

              // Sidebar still releases width and resize fix does not erase model selections.
              edt(()->{int w0=cmd.getWidth();side.doClick();F.validate();layout(F.getContentPane());ck(cmd.getWidth()>w0,"sidebar did not free width");side.doClick();ck(has(xs,"x1")&&"y".equals(String.valueOf(dep.getSelectedItem())),"sidebar changed model");});
              edt(()->F.dispose());
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/V142Audit.java
          timeout 60s xvfb-run -a java -cp /tmp/classes V142Audit

      - name: Static and preview regression checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'public static final String VERSION = "1.4.2"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'clampInspectorDividers' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'variableWindow.setMinimumSize(new Dimension(0, 75))' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'propertyWindow.setMinimumSize(new Dimension(0, 75))' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '^\*! hxempirical 1.4.2' hxempirical.ado
          grep -q '^d Version 1.4.2$' hxempirical.pkg
          grep -q 'version 1.4.2' hxempirical.sthlp
          grep -q '当前发布版本：1.4.2' README.md
          for mode in preview home regress monitor-details oneclick graph did; do
            if [ "$mode" = preview ]; then arg=--render-preview; else arg=--render-${mode}-preview; fi
            xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench "$arg" /tmp/${mode}.png
            test -s /tmp/${mode}.png
          done

      - name: Commit clean product fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deep-selfcheck-v141.yml .github/workflows/apply-v142-resize.yml scripts/fix_v142_resize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prevent inspector collapse during window resize [v1.4.2]'
          git push origin HEAD:selfcheck-v141-deep-20260813
