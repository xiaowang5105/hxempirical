name: Sidebar v143 run
on:
  push:
    branches: [ui-sidebar-v143-20260813]
    paths: ['.github/workflows/sidebar-v143-run.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        run: bash scripts/sidebar_v143_audit.sh
      - name: Commit clean change
        run: |
          rm -f .github/workflows/sidebar-v143-audit.yml .github/workflows/sidebar-v143-run.yml scripts/sidebar_v143.py scripts/sidebar_v143_audit.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace collapsed sidebar rail with a single toggle [v1.4.3]'
          git push origin HEAD:ui-sidebar-v143-20260813
