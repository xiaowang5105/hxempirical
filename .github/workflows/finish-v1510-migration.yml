name: Finish v1.5.10 migration guard

on:
  push:
    branches: [agent/unify-net-install-v1510]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-net-install-v1510
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final migration guard
        run: python tools/finish_v1510_migration_guard.py
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify release and contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Remove one-shot files
        run: |
          rm -f tools/finish_v1510_migration_guard.py
          rm -f .github/workflows/finish-v1510-migration.yml
      - name: Commit final migration guard
        run: |
          git config user.name "xiaowang5105"
          git config user.email "2692127923@qq.com"
          git add -A
          git commit -m "Harden v1.5.10 legacy migration" || exit 0
          git push origin HEAD:agent/unify-net-install-v1510
