name: Finalize UI 1.2.5

on:
  push:
    branches: [ui-structural-1.2.5]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Final cleanup
        run: python tools/finalize_125.py
      - name: SFI stubs
        run: python tools/make_sfi_stubs.py
      - name: Compile
        run: |
          rm -rf build/classes && mkdir -p build/classes
          javac --release 11 -d build/classes $(find test-stubs src/main/java -name '*.java')
          javap -verbose -classpath build/classes com.hexie.stata.HxWorkbench | grep 'major version: 55'
      - name: Build jar
        run: jar cf hxworkbench.jar -C build/classes .
      - name: Static UI assertions
        run: |
          ! grep -q '展开更多命令类别' src/main/java/com/hexie/stata/HxWorkbench.java
          ! grep -q '更多设置  +' src/main/java/com/hexie/stata/HxWorkbench.java
          ! grep -q '版本：1.2.4' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'exactOneClickInspectorHost.setPreferredSize(new Dimension(410,0))' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '"reghdfe", "ppmlhdfe", "ivreghdfe"' src/main/java/com/hexie/stata/HxWorkbench.java
      - name: Render core pages
        run: |
          xvfb-run -a java -cp build/classes com.hexie.stata.HxWorkbench --render-home-preview /tmp/home.png
          xvfb-run -a java -cp build/classes com.hexie.stata.HxWorkbench --render-method-preview /tmp/linear.png
          xvfb-run -a java -cp build/classes com.hexie.stata.HxWorkbench --render-oneclick-preview /tmp/oneclick.png
          xvfb-run -a java -cp build/classes com.hexie.stata.HxWorkbench --render-preview /tmp/command.png
      - uses: actions/upload-artifact@v4
        with:
          name: ui-1.2.5-final-previews
          path: /tmp/*.png
      - name: Commit final production files
        run: |
          git config user.name 'xiaowang5105'
          git config user.email '2692127923@qq.com'
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize stable UI shell for 1.2.5'
            git push
          fi
