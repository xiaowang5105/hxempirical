name: UI navigation 1.0.1

on:
  push:
    branches:
      - ui-navigation-polish-1.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Apply patch and build
        run: bash tools/ui_navigation_101_ci.sh
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hxempirical.pkg hxempirical.ado hxempirical.sthlp src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Polish navigation and release 1.0.1"
            git push
          fi
