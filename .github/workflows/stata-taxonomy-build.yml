name: Apply Stata taxonomy UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stata-taxonomy-build.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and prepare SFI stubs
        run: python3 scripts/apply_stata_taxonomy.py
      - name: Compile Java 11 workbench
        run: |
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar
      - name: Validate taxonomy
        run: |
          grep -q '汇总，表格和假设检验' hxregistry.ado
          grep -q '贝叶斯模型平均' hxregistry.ado
          grep -q '二维图(散点图，折线图等)' hxregistry.ado
          grep -q '更改方案/大小' hxregistry.ado
          grep -q 'browseCategoryOverview("graph")' src/main/java/com/hexie/stata/HxWorkbench.java
      - name: Commit generated workbench
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar hxempirical.ado hxempirical.pkg hxempirical.sthlp hxtoolbox.sthlp README.md
          git commit -m 'Apply Stata-native Statistics and Graphics taxonomy [generated-taxonomy]' || exit 0
          git push
