# Build and release patch 1.0.2
name: Fix help viewer foreground 1.0.2

on:
  push:
    branches:
      - fix-help-viewer-foreground-1.0.2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Patch help foreground behavior and bump version
        id: patch
        shell: bash
        run: |
          if grep -Fq 'public static final String VERSION = "1.0.2";' src/main/java/com/hexie/stata/HxWorkbench.java; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "1.0.2 already patched"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing pattern: {label}")
              return text.replace(old, new, 1)

          java_path = Path('src/main/java/com/hexie/stata/HxWorkbench.java')
          java = java_path.read_text(encoding='utf-8')
          java = replace_once(java, 'public static final String VERSION = "1.0.1";', 'public static final String VERSION = "1.0.2";', 'java version')
          java = replace_once(java, 'SFIToolkit.displayln("HxWorkbench 1.0.1");', 'SFIToolkit.displayln("HxWorkbench 1.0.2");', 'java version output')
          java = replace_once(
              java,
              '            HxWorkbench.StataBridge.execute("help " + var1, true);',
              '            int var2 = HxWorkbench.StataBridge.execute("help " + var1, true);\n            if (var2 == 0) {\n               HxWorkbench.StataBridge.execute("capture window manage forward viewer", false);\n            }',
              'help viewer foreground',
          )
          java_path.write_text(java, encoding='utf-8')

          pkg = Path('hxempirical.pkg')
          text = pkg.read_text(encoding='utf-8')
          text = replace_once(text, 'd Version 1.0.1', 'd Version 1.0.2', 'pkg version')
          pkg.write_text(text, encoding='utf-8')

          ado = Path('hxempirical.ado')
          text = ado.read_text(encoding='utf-8')
          text = replace_once(text, '*! hxempirical 1.0.1  12aug2026', '*! hxempirical 1.0.2  12aug2026', 'ado header')
          text = replace_once(text, 'display as text "版本：" as result "1.0.1"', 'display as text "版本：" as result "1.0.2"', 'ado display version')
          text = replace_once(text, 'return local version "1.0.1"', 'return local version "1.0.2"', 'ado return version')
          ado.write_text(text, encoding='utf-8')

          help_path = Path('hxempirical.sthlp')
          text = help_path.read_text(encoding='utf-8')
          text = replace_once(text, '{* *! version 1.0.1  12aug2026}{...}', '{* *! version 1.0.2  12aug2026}{...}', 'help header')
          if 'package version 1.0.1.' in text:
              text = text.replace('package version 1.0.1.', 'package version 1.0.2.', 1)
          help_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_once(readme, '当前发布版本：**1.0.1**', '当前发布版本：**1.0.2**', 'readme current version')
          readme = replace_once(readme, '上次修改时间：**2026-08-12 16:07（UTC+8）**', '上次修改时间：**2026-08-12 16:31（UTC+8）**', 'readme modified time')
          old_heading = '### 1.0.1（当前版本）'
          new_section = '''### 1.0.2（当前版本）

**发布时间**：2026-08-12 16:31（UTC+8）

**修改内容**：

- 修复工作台点击“查看帮助”后 Stata Viewer 可能被工作台窗口遮挡的问题。帮助命令成功打开后，继续调用 Stata 官方 `window manage forward viewer` 将 Viewer 窗口置于最前；不再需要手动最小化或切换工作台才能看到帮助页。
- 该修复只调整窗口前后顺序，不改变帮助内容、命令解析、回归执行或数据处理逻辑。
- 同步更新 Java 工作台、Stata 入口、package manifest、help 与 README 版本为 **1.0.2**，并重新构建 `hxworkbench.jar`。

### 1.0.1'''
          readme = replace_once(readme, old_heading, new_section, 'readme release section')
          readme_path.write_text(readme, encoding='utf-8')

          print('HX_HELP_VIEWER_PATCH_OK')
          PY

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build Java 11 workbench jar
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'capture window manage forward viewer' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -Fq 'public static final String VERSION = "1.0.2";' src/main/java/com/hexie/stata/HxWorkbench.java

          rm -rf build .ci-sfi
          mkdir -p .ci-sfi/com/stata/sfi build/classes

          cat > .ci-sfi/com/stata/sfi/Characteristic.java <<'JAVA'
          package com.stata.sfi;
          public final class Characteristic {
             private Characteristic() {}
             public static String getDtaChar(String name) { return ""; }
          }
          JAVA

          cat > .ci-sfi/com/stata/sfi/Data.java <<'JAVA'
          package com.stata.sfi;
          public final class Data {
             private Data() {}
             public static long getObsTotal() { return 0L; }
             public static int getVarCount() { return 0; }
             public static String getVarName(int index) { return ""; }
             public static int getVarIndex(String name) { return -1; }
             public static boolean isVarTypeString(int index) { return false; }
             public static String getFormattedValue(int index, long obs, boolean formatted) { return ""; }
             public static double getNum(int index, long obs) { return Double.NaN; }
             public static String getStr(int index, long obs) { return ""; }
             public static String getVarLabel(int index) { return ""; }
             public static String getVarFormat(int index) { return ""; }
          }
          JAVA

          cat > .ci-sfi/com/stata/sfi/Frame.java <<'JAVA'
          package com.stata.sfi;
          public class Frame {
             public static Frame connect(String name) { return new Frame(); }
             public static Frame create(String name) { return new Frame(); }
             public void drop() {}
             public long getObsTotal() { return 0L; }
             public int getVarCount() { return 0; }
             public int getVarIndex(String name) { return -1; }
             public boolean isVarTypeString(int index) { return false; }
             public String getStr(int index, long obs) { return ""; }
             public double getNum(int index, long obs) { return Double.NaN; }
             public String getVarName(int index) { return ""; }
             public String getFormattedValue(int index, long obs, boolean formatted) { return ""; }
          }
          JAVA

          cat > .ci-sfi/com/stata/sfi/Macro.java <<'JAVA'
          package com.stata.sfi;
          public final class Macro {
             private Macro() {}
             public static String getGlobal(String name) { return ""; }
          }
          JAVA

          cat > .ci-sfi/com/stata/sfi/Missing.java <<'JAVA'
          package com.stata.sfi;
          public final class Missing {
             private Missing() {}
             public static boolean isMissing(double value) { return Double.isNaN(value); }
          }
          JAVA

          cat > .ci-sfi/com/stata/sfi/SFIToolkit.java <<'JAVA'
          package com.stata.sfi;
          public final class SFIToolkit {
             private SFIToolkit() {}
             public static int executeCommand(String command, boolean echo) { return 0; }
             public static void errorln(String text) { System.err.println(text); }
             public static void displayln(String text) { System.out.println(text); }
             public static String stackTraceToString(Throwable t) { return t == null ? "" : t.toString(); }
          }
          JAVA

          cat > .ci-sfi/com/stata/sfi/Scalar.java <<'JAVA'
          package com.stata.sfi;
          public final class Scalar {
             private Scalar() {}
             public static double getValue(String name) { return Double.NaN; }
          }
          JAVA

          javac --release 11 -d build/classes $(find .ci-sfi -name '*.java' -print) src/main/java/com/hexie/stata/HxWorkbench.java
          jar --create --file hxworkbench.jar -C build/classes com/hexie/stata
          javap -verbose -classpath hxworkbench.jar com.hexie.stata.HxWorkbench | grep -q 'major version: 55'
          class_count=$(find build/classes/com/hexie/stata -name '*.class' | wc -l | tr -d ' ')
          [ "$class_count" -ge 40 ]
          echo "HX_HELP_VIEWER_BUILD_OK classes=$class_count"
          rm -rf build .ci-sfi

      - name: Commit production changes
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hxempirical.pkg hxempirical.ado hxempirical.sthlp src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          git commit -m "Bring Stata help viewer to foreground and release 1.0.2"
          git push
