name: Task workspaces 1.1.0

on:
  push:
    branches:
      - task-workspaces-1.1.0-prod

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Patch, build, and audit
        run: bash tools/build_task_workspaces_110.sh
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hxempirical.pkg hxempirical.ado hxempirical.sthlp src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          git commit -m "Release task-first workspaces 1.1.0"
          git push
