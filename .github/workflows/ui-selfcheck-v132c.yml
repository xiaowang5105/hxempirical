name: Extended UI self-check v1.3.2 rerun

on:
  push:
    branches: [ui-selfcheck-v132b]
    paths:
      - '.github/workflows/ui-selfcheck-v132c.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Stata SFI compile stubs
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-audit
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF

      - name: Compile Java 11
        run: javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Build and run audit harness
        shell: bash
        run: |
          cat > /tmp/ExtendedUiAudit.java <<'EOF'
          import java.awt.*;
          import java.awt.datatransfer.StringSelection;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.lang.reflect.*;
          import java.util.*;
          import javax.imageio.ImageIO;
          import javax.swing.*;
          public class ExtendedUiAudit {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
            static AbstractButton button(Container c,String text){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&text.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=button((Container)x,text);if(b!=null)return b;}}return null;}
            static void render(JFrame frame,String path)throws Exception{Container c=frame.getContentPane();layout(c);BufferedImage im=new BufferedImage(c.getWidth(),c.getHeight(),BufferedImage.TYPE_INT_RGB);Graphics2D g=im.createGraphics();c.printAll(g);g.dispose();ImageIO.write(im,"png",new File(path));}
            static void setSize(JFrame frame,int w,int h){frame.setSize(w,h);frame.getContentPane().setSize(w,h);frame.validate();layout(frame.getContentPane());}
            static String activeKey(Class<?> c,Object frame)throws Exception{return String.valueOf(f(c,"activeSidebarKey").get(frame));}
            public static void main(String[] a)throws Exception{
              final Throwable[] err={null};
              SwingUtilities.invokeAndWait(()->{try{
                Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");
                Constructor<?> ctor=c.getDeclaredConstructor(boolean.class);ctor.setAccessible(true);
                JFrame frame=(JFrame)ctor.newInstance(true); frame.addNotify();
                m(c,"showHomePage").invoke(frame); setSize(frame,1366,768);
                check("home".equals(activeKey(c,frame)),"home sidebar state wrong");
                render(frame,"/tmp/ui-audit/home.png");
                m(c,"browseCategoryOverview",String.class).invoke(frame,"stats"); check("stats".equals(activeKey(c,frame)),"stats sidebar state wrong"); render(frame,"/tmp/ui-audit/stats.png");
                m(c,"browseCategoryOverview",String.class).invoke(frame,"graph"); check("graph".equals(activeKey(c,frame)),"graph sidebar state wrong"); render(frame,"/tmp/ui-audit/graph.png");
                m(c,"showXtregWizardPageV130").invoke(frame);
                JSplitPane split=(JSplitPane)f(c,"commandDataSplit").get(frame);
                JScrollPane scroll=(JScrollPane)f(c,"formScroll").get(frame); JPanel form=(JPanel)f(c,"formPanel").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> panel=(JComboBox<String>)f(c,"xtregPanelVar").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> time=(JComboBox<String>)f(c,"xtregTimeVar").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(frame);
                @SuppressWarnings("unchecked") JList<String> indep=(JList<String>)f(c,"xtregIndepList").get(frame);
                int[][] sizes={{1920,1080},{1600,900},{1366,768},{1280,720}}; double[] ratios={.45,.55,.65};
                for(int[] sz:sizes)for(double ratio:ratios){
                  setSize(frame,sz[0],sz[1]); split.setDividerLocation(ratio); layout(frame.getContentPane());
                  int vw=scroll.getViewport().getExtentSize().width;
                  check(form.getWidth()<=vw+2,"form overflow "+sz[0]+"x"+sz[1]+" r="+ratio+" form="+form.getWidth()+" vp="+vw);
                  for(String txt:new String[]{"运行 xtreg","清空设置","population-averaged","固定效应（FE）","随机效应（RE）"}){AbstractButton b=button(form,txt);check(b!=null&&b.getWidth()>20&&b.getHeight()>15,"button clipped: "+txt+" at "+sz[0]+" r="+ratio);}
                  check(dep.getHeight()>=24&&dep.getHeight()<=40,"Y selector height="+dep.getHeight());
                  check(panel.getHeight()>=24&&panel.getHeight()<=40,"panel selector height="+panel.getHeight());
                  check(time.getHeight()>=24&&time.getHeight()<=40,"time selector height="+time.getHeight());
                  if(sz[0]==1366&&ratio==.55)render(frame,"/tmp/ui-audit/xtreg-expanded.png");
                }
                TransferHandler.TransferSupport p=new TransferHandler.TransferSupport(panel,new StringSelection("make"));
                TransferHandler.TransferSupport t=new TransferHandler.TransferSupport(time,new StringSelection("rep78"));
                TransferHandler.TransferSupport y=new TransferHandler.TransferSupport(dep,new StringSelection("price"));
                TransferHandler.TransferSupport x1=new TransferHandler.TransferSupport(indep,new StringSelection("mpg"));
                TransferHandler.TransferSupport x2=new TransferHandler.TransferSupport(indep,new StringSelection("weight"));
                check(panel.getTransferHandler().importData(p),"panel DnD failed"); check(time.getTransferHandler().importData(t),"time DnD failed"); check(dep.getTransferHandler().importData(y),"Y DnD failed"); check(indep.getTransferHandler().importData(x1),"X1 DnD failed"); check(indep.getTransferHandler().importData(x2),"X2 DnD failed");
                check(indep.getSelectedValuesList().contains("mpg")&&indep.getSelectedValuesList().contains("weight"),"multi-X DnD lost selection");
                setSize(frame,1366,768);split.setDividerLocation(.55);layout(frame.getContentPane());int before=split.getDividerLocation();
                m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());int after=split.getDividerLocation();
                JPanel sidebar=(JPanel)f(c,"sidebarPanel").get(frame);check(sidebar.getPreferredSize().width<=60,"sidebar not collapsed");check(Math.abs(after-before)<=40,"split reset on sidebar collapse");
                @SuppressWarnings("unchecked") Map<String,JButton> nav=(Map<String,JButton>)f(c,"sidebarButtons").get(frame);for(String key:new String[]{"home","data","stats","graph","oneclick","history","settings"})check(nav.containsKey(key)&&nav.get(key).isVisible(),"missing nav "+key);
                render(frame,"/tmp/ui-audit/xtreg-collapsed.png");
                JTable table=(JTable)f(c,"dataTable").get(frame);check(table.getTableHeader().getTransferHandler()!=null,"table header DnD source missing");check(!table.getTableHeader().getReorderingAllowed(),"header reorder conflicts with DnD");
                frame.dispose();
              }catch(Throwable t){err[0]=t;}});
              if(err[0]!=null){err[0].printStackTrace();System.exit(2);} System.out.println("HX_EXTENDED_UI_AUDIT_OK"); System.exit(0);
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/ExtendedUiAudit.java
          xvfb-run -a java -cp /tmp/classes ExtendedUiAudit

      - name: Static consistency checks
        shell: bash
        run: |
          grep -q 'VERSION = "1.3.2"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'd Version 1.3.2' hxempirical.pkg
          grep -q 'hxempirical 1.3.2' hxempirical.ado
          grep -q 'WidthTrackingPanel extends JPanel implements Scrollable' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'HORIZONTAL_SCROLLBAR_NEVER' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'refreshXtregVariableControls' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'installDataHeaderDragSupport' src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Upload audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-selfcheck-v132c
          path: /tmp/ui-audit/*.png
          if-no-files-found: error
