name: v1.4.6 deep command sync audit
on:
  push:
    branches: [selfcheck-v146-command-sync-20260814]
    paths: ['.github/workflows/v146-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Repair Python replacement escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v146_patch.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('s, n = pat.subn(new_update, s, count=1)', 's, n = pat.subn(lambda m: new_update, s, count=1)')
          s=s.replace('s, n = run_pat.subn(run_new, s, count=1)', 's, n = run_pat.subn(lambda m: run_new, s, count=1)')
          s=s.replace('s, n = sync_pat.subn(sync_new, s, count=1)', 's, n = sync_pat.subn(lambda m: sync_new, s, count=1)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run deep functional audit
        shell: bash
        run: bash scripts/v146_audit.sh
      - name: Commit audited candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md hxempirical.ado hxempirical.pkg hxempirical.sthlp hxworkbench.jar src/main/java/com/hexie/stata/HxWorkbench.java audit-v146
          git commit -m 'Fix deep xtreg command synchronization [v1.4.6]'
          git push origin HEAD:selfcheck-v146-command-sync-20260814
