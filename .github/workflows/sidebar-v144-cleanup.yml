name: Sidebar v1.4.4 cleanup

on:
  push:
    branches: [ui-sidebar-selfcheck-v144-20260813]
    paths: ['.github/workflows/sidebar-v144-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary self-check files
        shell: bash
        run: |
          rm -rf audit
          rm -f scripts/sidebar_v144_selfcheck.py scripts/sidebar_v144_selfcheck.sh
          rm -f .github/workflows/sidebar-v144-selfcheck.yml .github/workflows/sidebar-v144-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean sidebar self-check files [v1.4.4]'
          git push origin HEAD:ui-sidebar-selfcheck-v144-20260813
