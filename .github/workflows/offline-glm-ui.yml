name: Offline GLM UI render

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - .github/workflows/offline-glm-ui.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Add temporary GLM render hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hexie/stata/HxWorkbench.java')
          s = p.read_text(encoding='utf-8')
          old = 'var19x.showRegressPage();'
          new = '''var19x.showCommand("glm");
                  int renderFamily = Integer.getInteger("hx.family", 0);
                  if (renderFamily >= 0 && var19x.model.getItemCount() > renderFamily) var19x.model.setSelectedIndex(renderFamily);
                  int renderLink = Integer.getInteger("hx.link", 0);
                  if (renderLink >= 0 && var19x.time.getItemCount() > renderLink) var19x.time.setSelectedIndex(renderLink);
                  String familyArg = System.getProperty("hx.familyArg", "");
                  String linkArg = System.getProperty("hx.linkArg", "");
                  var19x.expression.setText(familyArg);
                  var19x.newvar.setText(linkArg);
                  var19x.depvar.addItem("y");
                  var19x.depvar.setSelectedItem("y");
                  var19x.updatePreview();
                  System.out.println("HX_GLM_COMMAND " + var19x.previewArea.getText());'''
          if s.count(old) != 1:
              raise SystemExit(f'render hook anchor mismatch: {s.count(old)}')
          s = s.replace(old, new)
          old2 = 'System.out.println("HX_UI_PREVIEW_OK " + var19);'
          if s.count(old2) != 1:
              raise SystemExit(f'render exit anchor mismatch: {s.count(old2)}')
          p.write_text(s.replace(old2, old2 + '\n               System.exit(0);'), encoding='utf-8')
          PY
      - name: Create Stata SFI compile stubs
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/hxclasses
          cat >/tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void displayln(String s){} public static void errorln(String s){} public static String stackTraceToString(Throwable t){return t==null?"":t.toString();} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double v){return Double.isNaN(v);} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static int getVarIndex(String s){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame connect(String s){return new Frame();} public static Frame create(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public int getVarIndex(String s){return 0;} public String getVarName(int i){return "";} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
      - name: Compile Java 11
        run: javac --release 11 -d /tmp/hxclasses /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
      - name: Render and verify GLM states
        shell: bash
        run: |
          set -euo pipefail
          render() {
            local name="$1" family="$2" link="$3" familyarg="$4" linkarg="$5" expected="$6"
            local out="/tmp/glm-${name}.png"
            local log="/tmp/glm-${name}.log"
            xvfb-run -a java \
              -Dhx.family="$family" -Dhx.link="$link" \
              -Dhx.familyArg="$familyarg" -Dhx.linkArg="$linkarg" \
              -cp /tmp/hxclasses com.hexie.stata.HxWorkbench \
              --render-regress-command-preview "$out" | tee "$log"
            test -s "$out"
            file "$out" | grep -q 'PNG image data'
            grep -F 'HX_GLM_COMMAND ' "$log" >/dev/null
            grep -F "$expected" "$log" >/dev/null
            bytes=$(stat -c%s "$out")
            echo "HX_OFFLINE_GLM_PREVIEW_OK $name $bytes bytes :: $expected"
          }

          render gaussian-default 0 0 '' '' 'glm y, family(gaussian)'
          render gaussian-log 0 2 '' '' 'family(gaussian) link(log)'
          render igaussian-default 1 0 '' '' 'glm y, family(igaussian)'
          render igaussian-power 1 3 '' '-2' 'family(igaussian) link(power -2)'
          render binomial-default 2 0 '' '' 'glm y, family(binomial)'
          render binomial-denom 2 3 'trials' '' 'family(binomial trials) link(logit)'
          render binomial-probit 2 4 '' '' 'family(binomial) link(probit)'
          render binomial-cloglog 2 5 '' '' 'family(binomial) link(cloglog)'
          render binomial-opower 2 7 '' '0.5' 'family(binomial) link(opower 0.5)'
          render binomial-loglog 2 8 '' '' 'family(binomial) link(loglog)'
          render binomial-logc 2 9 '' '' 'family(binomial) link(logc)'
          render poisson-default 3 0 '' '' 'glm y, family(poisson)'
          render poisson-power 3 3 '' '0.5' 'family(poisson) link(power 0.5)'
          render nbinomial-default 4 0 '' '' 'glm y, family(nbinomial)'
          render nbinomial-ml 4 2 'ml' '' 'family(nbinomial ml) link(log)'
          render nbinomial-canonical 4 4 '1.5' '' 'family(nbinomial 1.5) link(nbinomial)'
          render gamma-default 5 0 '' '' 'glm y, family(gamma)'
          render gamma-log 5 2 '' '' 'family(gamma) link(log)'
          render custom 6 10 'myfamily' 'mylink' 'family(myfamily) link(mylink)'
