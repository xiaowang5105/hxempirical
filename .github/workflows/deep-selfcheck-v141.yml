name: Deep selfcheck v1.4.1

on:
  push:
    branches: [selfcheck-v141-deep-20260813]
    paths: ['.github/workflows/deep-selfcheck-v141.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Java 11
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'public static final String VERSION = "1.4.1"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '^\*! hxempirical 1.4.1' hxempirical.ado
          grep -q '^d Version 1.4.1$' hxempirical.pkg
          rm -rf /tmp/sfi /tmp/classes
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class SFIToolkit { public static final List<String> commands=new ArrayList<>(); public static int executeCommand(String s, boolean b){commands.add(s);return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class Characteristic { private static final Map<String,String>M=new HashMap<>(); public static String getDtaChar(String s){return M.getOrDefault(s,"");} public static void setDtaChar(String s,String v){M.put(s,v);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            static final String[] N={"firm","year","y","x1","x2","Size","Lev","ROA"};
            public static long getObsTotal(){return 20L;} public static int getVarCount(){return N.length;}
            public static String getVarName(int i){return i>=1&&i<=N.length?N[i-1]:"";}
            public static String getVarLabel(int i){return i>=1&&i<=N.length?"label_"+N[i-1]:"";}
            public static String getVarFormat(int i){return "%9.0g";}
            public static int getVarIndex(String s){for(int i=0;i<N.length;i++)if(N[i].equals(s))return i+1;return -1;}
            public static boolean isVarTypeString(int i){return false;}
            public static double getNum(int i,long j){return i*100+j;}
            public static String getStr(int i,long j){return "";}
            public static String getFormattedValue(int i,long j){return String.valueOf(getNum(i,j));}
            public static String getFormattedValue(int i,long j,boolean b){return getFormattedValue(i,j);}
            public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){}
          }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public String getVarLabel(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf /tmp/hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s /tmp/hxworkbench.jar

      - name: Deep runtime interaction audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/DeepAudit141.java <<'EOF'
          import java.awt.*; import java.awt.datatransfer.*; import java.lang.reflect.*; import java.util.*; import javax.swing.*;
          public class DeepAudit141 {
            static Class<?> C; static JFrame F; static Throwable ERR;
            static Field f(String n)throws Exception{Field x=C.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(String n,Class<?>...a)throws Exception{Method x=C.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void ck(boolean v,String s){if(!v)throw new AssertionError(s);}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static void edt(Runnable r)throws Exception{SwingUtilities.invokeAndWait(()->{try{r.run();}catch(Throwable t){ERR=t;}});if(ERR!=null){Throwable t=ERR;ERR=null;throw new RuntimeException(t);}}
            static boolean drop(JComponent target,String value){TransferHandler.TransferSupport ts=new TransferHandler.TransferSupport(target,new StringSelection(value));return target.getTransferHandler()!=null&&target.getTransferHandler().importData(ts);}
            static String sel(JComboBox<?> c){return String.valueOf(c.getSelectedItem());}
            static boolean listHas(JList<?> l,String s){return l.getSelectedValuesList().stream().anyMatch(x->s.equals(String.valueOf(x)));}
            static double ratio(JSplitPane s){return (double)s.getTopComponent().getHeight()/Math.max(1,s.getHeight());}
            static int rowOf(JTable t,String n){for(int r=0;r<t.getRowCount();r++)if(n.equals(String.valueOf(t.getValueAt(r,0))))return r;return -1;}
            public static void main(String[] z){try{run();System.out.println("DEEP_AUDIT_141_OK");System.exit(0);}catch(Throwable t){t.printStackTrace();try{if(F!=null)edt(()->F.dispose());}catch(Throwable ignored){}System.exit(2);}}
            static void run()throws Exception{
              C=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?> ct=C.getDeclaredConstructor(boolean.class);ct.setAccessible(true);
              edt(()->{try{F=(JFrame)ct.newInstance(false);m("showXtregWizardPageV130").invoke(F);m("refreshDataset",boolean.class).invoke(F,false);F.setSize(1672,901);F.addNotify();F.validate();layout(F.getContentPane());m("applyDividerRatios").invoke(F);}catch(Exception e){throw new RuntimeException(e);}});
              edt(()->{F.validate();layout(F.getContentPane());});
              final JComboBox<?> panel=(JComboBox<?>)f("xtregPanelVar").get(F), time=(JComboBox<?>)f("xtregTimeVar").get(F), dep=(JComboBox<?>)f("xtregDepVar").get(F);
              final JList<?> xs=(JList<?>)f("xtregIndepList").get(F);final JTextArea preview=(JTextArea)f("previewArea").get(F);
              final JTable vt=(JTable)f("inspectorVariableTable").get(F);final JTextField filter=(JTextField)f("inspectorVariableFilter").get(F);final JLabel role=(JLabel)f("inspectorRoleLabel").get(F);
              final JSplitPane outer=(JSplitPane)f("dataSummarySplit").get(F), lower=(JSplitPane)f("inspectorLowerSplit").get(F), cmd=(JSplitPane)f("commandDataSplit").get(F);
              final JTabbedPane tabs=(JTabbedPane)f("dataTabs").get(F);final JButton sideToggle=(JButton)f("sidebarToggleButton").get(F);final JToggleButton inspToggle=(JToggleButton)f("inspectorToggle").get(F);

              edt(()->{ck(!inspToggle.isVisible(),"legacy inspector toggle visible");ck(drop((JComponent)panel,"firm"),"drop panel failed");ck(drop((JComponent)time,"year"),"drop time failed");ck(drop((JComponent)dep,"y"),"drop dep failed");ck(drop((JComponent)xs,"x1"),"drop x1 failed");ck(drop((JComponent)xs,"x2"),"drop x2 failed");ck("firm".equals(sel(panel))&&"year".equals(sel(time))&&"y".equals(sel(dep)),"DnD combos wrong");ck(listHas(xs,"x1")&&listHas(xs,"x2"),"X drops not cumulative");ck(preview.getText().contains("xtreg y x1 x2")||preview.getText().contains("xtreg y x2 x1"),"preview wrong: "+preview.getText());});
              final String before=preview.getText();edt(()->{try{m("refreshDataset",boolean.class).invoke(F,false);}catch(Exception e){throw new RuntimeException(e);}ck("firm".equals(sel(panel))&&"year".equals(sel(time))&&"y".equals(sel(dep)),"refresh lost combo state");ck(listHas(xs,"x1")&&listHas(xs,"x2"),"refresh lost X");ck(before.equals(preview.getText()),"refresh changed preview");});
              edt(()->{try{int roa=rowOf(vt,"ROA");ck(roa>=0,"ROA missing");vt.setRowSelectionInterval(roa,roa);m("syncInspectorSelectionFromVariableWindow").invoke(F);ck(role.getText().contains("未使用"),"ROA role "+role.getText());int x1=rowOf(vt,"x1");vt.setRowSelectionInterval(x1,x1);m("syncInspectorSelectionFromVariableWindow").invoke(F);ck(role.getText().contains("解释变量 X"),"x1 role "+role.getText());filter.setText("label_roa");m("refreshInspectorVariables").invoke(F);ck(vt.getRowCount()==1,"label filter");filter.setText("");m("refreshInspectorVariables").invoke(F);}catch(Exception e){throw new RuntimeException(e);}});
              final double[] manual=new double[2];edt(()->{outer.setDividerLocation(0.36);lower.setDividerLocation(0.60);F.validate();layout(F.getContentPane());manual[0]=ratio(outer);manual[1]=ratio(lower);try{m("refreshDataset",boolean.class).invoke(F,false);}catch(Exception e){throw new RuntimeException(e);}F.validate();layout(F.getContentPane());ck(Math.abs(ratio(outer)-manual[0])<0.06,"refresh reset top split");ck(Math.abs(ratio(lower)-manual[1])<0.06,"refresh reset lower split");});
              edt(()->{for(int i=0;i<tabs.getTabCount();i++){tabs.setSelectedIndex(i);F.validate();layout(F.getContentPane());}tabs.setSelectedIndex(0);ck("firm".equals(sel(panel))&&listHas(xs,"x1"),"tab switch lost state");int w0=cmd.getWidth();sideToggle.doClick();F.validate();layout(F.getContentPane());int w1=cmd.getWidth();ck(w1>w0,"sidebar collapse did not free width "+w0+"->"+w1);sideToggle.doClick();});

              int[][] sizes={{1600,900},{1366,768},{1280,720}};
              for(int[] s:sizes){edt(()->{F.setSize(s[0],s[1]);F.validate();layout(F.getContentPane());System.out.println("NATURAL "+s[0]+" top="+outer.getTopComponent().getHeight()+" vars="+lower.getTopComponent().getHeight()+" props="+lower.getBottomComponent().getHeight()+" cmd="+cmd.getLeftComponent().getWidth());ck(outer.getTopComponent().getHeight()>=85,"natural top collapsed @"+s[0]);ck(lower.getTopComponent().getHeight()>=65,"natural vars collapsed @"+s[0]);ck(lower.getBottomComponent().getHeight()>=65,"natural props collapsed @"+s[0]);ck(cmd.getLeftComponent().getWidth()>=340,"natural command too narrow @"+s[0]);});}
              for(int[] s:sizes){edt(()->{F.setSize(s[0],s[1]);F.validate();layout(F.getContentPane());try{m("applyDividerRatios").invoke(F);}catch(Exception e){throw new RuntimeException(e);}});edt(()->{F.validate();layout(F.getContentPane());System.out.println("RESET "+s[0]+" top="+outer.getTopComponent().getHeight()+" vars="+lower.getTopComponent().getHeight()+" props="+lower.getBottomComponent().getHeight()+" cmd="+cmd.getLeftComponent().getWidth());ck(outer.getTopComponent().getHeight()>=85,"reset top collapsed @"+s[0]);ck(lower.getTopComponent().getHeight()>=65,"reset vars collapsed @"+s[0]);ck(lower.getBottomComponent().getHeight()>=65,"reset props collapsed @"+s[0]);ck(cmd.getLeftComponent().getWidth()>=340,"reset command too narrow @"+s[0]);});}
              edt(()->F.dispose());
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/DeepAudit141.java
          timeout 75s xvfb-run -a java -cp /tmp/classes DeepAudit141

      - name: Static and render regression matrix
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n '方案 A\|方案 B\|方案 C\|方案 D' src/main/java README.md hxempirical.sthlp
          if find . -maxdepth 2 -type f \( -name '*selfcheck*' -o -name '*temporary*' \) | grep -v '.github/workflows/deep-selfcheck-v141.yml' | grep -q .; then exit 1; fi
          for mode in preview home regress monitor-details oneclick graph did; do
            if [ "$mode" = preview ]; then arg=--render-preview; else arg=--render-${mode}-preview; fi
            xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench "$arg" /tmp/${mode}.png
            test -s /tmp/${mode}.png
          done
          echo DEEP_RENDER_MATRIX_OK
