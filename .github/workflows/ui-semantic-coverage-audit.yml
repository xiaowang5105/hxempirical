name: UI semantic coverage audit

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - '.github/workflows/ui-semantic-coverage-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
      - name: Compare registry commands with semantic coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          reg=Path('hxregistry.ado').read_text(encoding='utf-8')
          sem=Path('hxsemantics.ado').read_text(encoding='utf-8')
          def local_list(name):
              m=re.search(rf'local {re.escape(name)} "([^"]*)"',reg)
              if not m: raise SystemExit(name)
              return m.group(1).split()
          cats={k:local_list(k) for k in ['data_cmds','stats_cmds','graph_cmds']}
          # Count a command as semantically covered when hxsemantics explicitly names it in a quoted command condition/list.
          literals=set(re.findall(r'"([A-Za-z_][A-Za-z0-9_]*)"',sem))
          print('HX_SEMANTIC_COVERAGE_BEGIN')
          for cat,cmds in cats.items():
              missing=[c for c in cmds if c not in literals]
              covered=[c for c in cmds if c in literals]
              print(f'{cat}: total={len(cmds)} covered={len(covered)} missing={len(missing)}')
              print('MISSING '+cat+' '+' '.join(missing))
          print('HX_SEMANTIC_COVERAGE_END')
          PY
