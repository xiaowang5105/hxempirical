name: Update README for v1.5.10

on:
  push:
    branches: [docs/readme-v1510-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-v1510-update
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README
        run: python tools/update_readme_v1510_docs.py
      - name: Verify release/docs contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Remove one-shot files
        run: |
          rm -f tools/update_readme_v1510_docs.py
          rm -f .github/workflows/readme-v1510-update.yml
      - name: Commit README update
        run: |
          git config user.name "xiaowang5105"
          git config user.email "2692127923@qq.com"
          git add -A
          git commit -m "Update README for v1.5.10 install workflow" || exit 0
          git push origin HEAD:docs/readme-v1510-update
