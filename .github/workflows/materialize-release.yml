name: Materialize Stata release

on:
  push:
    paths:
      - '.release_b64/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild release ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f .release_b64/READY
          cat .release_b64/chunk_*.txt > /tmp/hx_release.b64
          base64 --decode /tmp/hx_release.b64 > /tmp/hx_release.zip
          echo '8bf0d78dea88b1a98f91106e929054008ccf9bdeb129e91f0acf2f3a63ed03be  /tmp/hx_release.zip' | sha256sum -c -
          unzip -t /tmp/hx_release.zip
          unzip -o /tmp/hx_release.zip -d .
          test -f stata.toc
          test -f hxempirical.pkg
          test -f hxworkbench.jar
          rm -rf .release_b64 .release_bin
      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish hxempirical 0.9.7 release files'
          git push
