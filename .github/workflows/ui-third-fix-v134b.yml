name: Third-round final fixes audit v1.3.4

on:
  push:
    branches: [ui-selfcheck-v133-round3]
    paths:
      - '.github/workflows/ui-third-fix-v134b.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified round-three fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java=Path('src/main/java/com/hexie/stata/HxWorkbench.java')
          s=java.read_text(encoding='utf-8')
          old='''            this.statusLabel.setText(rc == 0 ? "xtreg 已运行。右侧可查看结果与日志。" : "xtreg 运行失败，返回码：" + rc);\n            this.refreshDataset(false);'''
          new='''            this.refreshDataset(false);\n            this.statusLabel.setText(rc == 0 ? "xtreg 已运行。右侧可查看结果与日志。" : "xtreg 运行失败，返回码：" + rc);'''
          assert old in s, 'xtreg status-refresh marker missing'
          s=s.replace(old,new,1)
          s=s.replace('public static final String VERSION = "1.3.3";', 'public static final String VERSION = "1.3.4";', 1)
          s=s.replace('SFIToolkit.displayln("HxWorkbench 1.3.3");', 'SFIToolkit.displayln("HxWorkbench 1.3.4");', 1)
          java.write_text(s,encoding='utf-8')

          ado=Path('hxempirical.ado'); a=ado.read_text(encoding='utf-8')
          a=a.replace('*! hxempirical 1.3.3  13aug2026','*! hxempirical 1.3.4  13aug2026',1)
          a=a.replace('"1.3.3"','"1.3.4"')
          ado.write_text(a,encoding='utf-8')

          pkg=Path('hxempirical.pkg'); pkg.write_text(pkg.read_text(encoding='utf-8').replace('d Version 1.3.3','d Version 1.3.4',1),encoding='utf-8')

          readme=Path('README.md'); r=readme.read_text(encoding='utf-8')
          r=r.replace('**当前发布版本：1.2.7**','**当前发布版本：1.3.4**',1)
          r=r.replace('**上次修改时间：2026-08-13 09:15（UTC+8）**','**上次修改时间：2026-08-13 13:35（UTC+8）**',1)
          readme.write_text(r,encoding='utf-8')

          helpf=Path('hxempirical.sthlp'); h=helpf.read_text(encoding='utf-8')
          h=h.replace('{* *! version 1.2.7  13aug2026}{...}','{* *! version 1.3.4  13aug2026}{...}',1)
          h=h.replace('The 1.2.7 interface uses a stable desktop-workbench layout:', 'The 1.3.4 interface uses a stable desktop-workbench layout:',1)
          helpf.write_text(h,encoding='utf-8')

          toc=Path('stata.toc'); t=toc.read_text(encoding='utf-8')
          t=t.replace('d Launcher-style workbench with task search, parameter restore, visual regress builder, safe DID/event study, external OneClick, and History integration',
                      'd Launcher-style workbench with task search, parameter restore, visual regression tools, official DID commands, external OneClick, and History integration',1)
          toc.write_text(t,encoding='utf-8')
          print('PATCH_OK')
          PY

      - name: Create Stata SFI stubs compile and rebuild jar
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-audit
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar

      - name: Expanded functional UI audit
        shell: bash
        run: |
          cat > /tmp/FinalRound3Audit.java <<'EOF'
          import java.awt.*;import java.awt.datatransfer.StringSelection;import java.lang.reflect.*;import java.util.Objects;import javax.swing.*;
          public class FinalRound3Audit{
            static Field f(Class<?>c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;} static Method m(Class<?>c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;} static void ck(boolean v,String s){if(!v)throw new AssertionError(s);} static void lay(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)lay((Container)x);} static void settle(JFrame f,int w,int h){f.setSize(w,h);f.setVisible(true);f.validate();lay(f.getContentPane());Toolkit.getDefaultToolkit().sync();} static AbstractButton btn(Container c,String s){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&s.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=btn((Container)x,s);if(b!=null)return b;}}return null;} static JComboBox<?> combo(Container c,String s){for(Component x:c.getComponents()){if(x instanceof JComboBox){JComboBox<?>q=(JComboBox<?>)x;for(int i=0;i<q.getItemCount();i++)if(s.equals(Objects.toString(q.getItemAt(i),"")))return q;}if(x instanceof Container){JComboBox<?>q=combo((Container)x,s);if(q!=null)return q;}}return null;} static void sel(JComboBox<?>q,String s){for(int i=0;i<q.getItemCount();i++)if(s.equals(Objects.toString(q.getItemAt(i),""))){q.setSelectedIndex(i);return;}throw new AssertionError("missing combo "+s);} static int idx(JList<?>l,String s){for(int i=0;i<l.getModel().getSize();i++)if(s.equals(Objects.toString(l.getModel().getElementAt(i),"")))return i;return-1;}
            public static void main(String[]a)throws Exception{final Throwable[]e={null};SwingUtilities.invokeAndWait(()->{try{Class<?>c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?>ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame fr=(JFrame)ct.newInstance(true);fr.addNotify();m(c,"showXtregWizardPageV130").invoke(fr);JSplitPane sp=(JSplitPane)f(c,"commandDataSplit").get(fr);JScrollPane sc=(JScrollPane)f(c,"formScroll").get(fr);JPanel form=(JPanel)f(c,"formPanel").get(fr);@SuppressWarnings("unchecked")JComboBox<String> panel=(JComboBox<String>)f(c,"xtregPanelVar").get(fr);@SuppressWarnings("unchecked")JComboBox<String> time=(JComboBox<String>)f(c,"xtregTimeVar").get(fr);@SuppressWarnings("unchecked")JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(fr);@SuppressWarnings("unchecked")JList<String> xs=(JList<String>)f(c,"xtregIndepList").get(fr);
              int[][] sizes={{1920,1080},{1600,900},{1366,768},{1280,720}};double[] ratios={.33,.40,.55,.70};for(int[]z:sizes)for(double r:ratios){settle(fr,z[0],z[1]);sp.setDividerLocation(r);fr.validate();lay(fr.getContentPane());ck(form.getWidth()<=sc.getViewport().getExtentSize().width+2,"horizontal overflow "+z[0]+" "+r);int pc=0;for(Component x:form.getComponents())if(x instanceof JPanel){pc++;ck(x.getWidth()>0&&x.getHeight()>0,"collapsed card "+z[0]+" "+r);}ck(pc>=5,"missing cards");for(String s:new String[]{"固定效应（FE）","随机效应（RE）","between","population-averaged","上一步","清空设置","运行 xtreg"}){AbstractButton b=btn(form,s);ck(b!=null&&b.getWidth()>20&&b.getHeight()>15,"bad button "+s+" "+z[0]+" "+r);}ck(dep.getHeight()>=24&&dep.getHeight()<=40,"Y height");}
              sel(panel,"foreign");sel(time,"rep78");sel(dep,"price");int i1=idx(xs,"mpg"),i2=idx(xs,"weight");ck(i1>=0&&i2>=0,"vars missing");xs.setSelectedIndices(new int[]{i1,i2});AbstractButton fe=btn(form,"固定效应（FE）"),re=btn(form,"随机效应（RE）"),be=btn(form,"between"),pa=btn(form,"population-averaged");JComboBox<?> se=combo(form,"稳健标准误");JTextArea pv=(JTextArea)f(c,"previewArea").get(fr);fe.doClick();sel(se,"稳健标准误");ck("xtreg price mpg weight, fe vce(robust)".equals(pv.getText().trim()),"FE preview");re.doClick();sel(se,"默认标准误");ck("xtreg price mpg weight, re".equals(pv.getText().trim()),"RE preview");be.doClick();sel(se,"按面板聚类");ck("xtreg price mpg weight, be vce(cluster foreign)".equals(pv.getText().trim()),"BE preview");pa.doClick();sel(se,"稳健标准误");ck("xtreg price mpg weight, pa vce(robust)".equals(pv.getText().trim()),"PA preview");
              xs.clearSelection();ck(panel.getTransferHandler().importData(new TransferHandler.TransferSupport(panel,new StringSelection("foreign"))),"panel DnD");ck(time.getTransferHandler().importData(new TransferHandler.TransferSupport(time,new StringSelection("rep78"))),"time DnD");ck(dep.getTransferHandler().importData(new TransferHandler.TransferSupport(dep,new StringSelection("price"))),"Y DnD");ck(xs.getTransferHandler().importData(new TransferHandler.TransferSupport(xs,new StringSelection("mpg"))),"X1 DnD");ck(xs.getTransferHandler().importData(new TransferHandler.TransferSupport(xs,new StringSelection("weight"))),"X2 DnD");ck(xs.getSelectedValuesList().contains("mpg")&&xs.getSelectedValuesList().contains("weight"),"multi X DnD");btn(form,"运行 xtreg").doClick();JLabel st=(JLabel)f(c,"statusLabel").get(fr);ck(st.getText().startsWith("xtreg 已运行"),"run confirmation lost: "+st.getText());btn(form,"清空设置").doClick();ck(Objects.toString(dep.getSelectedItem(),"").isBlank()&&xs.getSelectedIndices().length==0&&fe.isSelected()&&se.getSelectedIndex()==0,"clear state");
              m(c,"browseCategoryOverview",String.class).invoke(fr,"graph");for(String cmd:new String[]{"histogram","kdensity","scatter","lfit","graph_box","did_trends","twoway"}){m(c,"showSpecialGraphPage",String.class).invoke(fr,cmd);settle(fr,1366,768);ck(cmd.equals(Objects.toString(f(c,"currentCommand").get(fr),"")),"graph command "+cmd);JButton rb=(JButton)f(c,"runButton").get(fr);ck("绘制图形".equals(rb.getText())&&rb.isEnabled(),"graph run "+cmd);}
              // Mirror the product's official --render-oneclick-preview path: seed OneClick preview data first.
              m(c,"populateOneClickPreviewState").invoke(fr);settle(fr,1366,768);JComponent one=(JComponent)f(c,"exactOneClickRoot").get(fr);JComboBox<?>oy=(JComboBox<?>)f(c,"oneClickY").get(fr),ox=(JComboBox<?>)f(c,"oneClickX").get(fr);ck(one!=null&&one.getWidth()>0&&one.getHeight()>0,"oneclick root");ck(oy.getItemCount()>1&&ox.getItemCount()>1,"oneclick vars");JTable table=(JTable)f(c,"dataTable").get(fr);ck(table.getTableHeader().getTransferHandler()!=null&&!table.getTableHeader().getReorderingAllowed(),"header DnD config");fr.dispose();}catch(Throwable t){e[0]=t;}});if(e[0]!=null){e[0].printStackTrace();System.exit(2);}System.out.println("FINAL_ROUND3_UI_AUDIT_OK");System.exit(0);}}
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/FinalRound3Audit.java
          xvfb-run -a java -cp /tmp/classes FinalRound3Audit

      - name: Official preview-path smoke tests
        shell: bash
        run: |
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-home-preview /tmp/ui-audit/home.png
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-graph-preview /tmp/ui-audit/graph.png
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-oneclick-preview /tmp/ui-audit/oneclick.png
          xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-regress-preview /tmp/ui-audit/regress.png
          test -s /tmp/ui-audit/home.png
          test -s /tmp/ui-audit/graph.png
          test -s /tmp/ui-audit/oneclick.png
          test -s /tmp/ui-audit/regress.png

      - name: Package documentation and version audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path('hxempirical.pkg').read_text(encoding='utf-8'); files=[x[2:].strip() for x in pkg.splitlines() if x.startswith('f ')]
          missing=[x for x in files if not Path(x).exists()]; assert not missing, missing
          required={'hxempirical.ado','hxempirical.sthlp','hxworkbench.ado','hxworkbench.jar','hxregistry.ado','hxsemantics.ado','hxtestdata.ado'}; assert required.issubset(files)
          assert 'd Version 1.3.4' in pkg
          assert '1.3.4' in Path('hxempirical.ado').read_text(encoding='utf-8')
          assert 'VERSION = "1.3.4"' in Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8'); assert '**当前发布版本：1.3.4**' in readme; assert 'net install hxempirical, from("https://xiaowang5105.github.io/hxempirical/") replace force' in readme
          helptext=Path('hxempirical.sthlp').read_text(encoding='utf-8').lower(); assert 'version 1.3.4' in helptext; assert 'the 1.3.4 interface' in helptext
          assert 'official DID commands' in Path('stata.toc').read_text(encoding='utf-8')
          print('FINAL_ROUND3_PACKAGE_DOC_AUDIT_OK')
          PY
          unzip -p hxworkbench.jar com/hexie/stata/HxWorkbench.class | strings | grep -q '1.3.4'

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-third-final-v134
          path: /tmp/ui-audit/*.png
          if-no-files-found: error

      - name: Commit clean audited product tree
        shell: bash
        run: |
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix status persistence and documentation consistency after third self-check [ui-audit]'
          git push origin HEAD:ui-selfcheck-v133-round3
