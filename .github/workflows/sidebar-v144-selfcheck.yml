name: Sidebar v1.4.4 self-check

on:
  push:
    branches: [ui-sidebar-selfcheck-v144-20260813]
    paths: ['.github/workflows/sidebar-v144-selfcheck.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run functional sidebar self-check
        shell: bash
        run: bash scripts/sidebar_v144_selfcheck.sh
      - name: Commit audited candidate and render evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md hxempirical.ado hxempirical.pkg hxempirical.sthlp hxworkbench.jar src/main/java/com/hexie/stata/HxWorkbench.java audit
          git commit -m 'Self-check sidebar placement and collapse behavior [v1.4.4]'
          git push origin HEAD:ui-sidebar-selfcheck-v144-20260813
