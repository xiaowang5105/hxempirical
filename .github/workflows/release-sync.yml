name: HX one-shot release sync

on:
  push:
    branches:
      - agent/fix-dependencies-catalog-ci

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dependencies-catalog-ci
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare v1.5.5 release
        run: python tools/prepare_v155_release.py
      - name: Commit rebuilt release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated release changes."
          else
            git commit -m "Prepare v1.5.5 release [release-sync]"
            git push origin HEAD:agent/fix-dependencies-catalog-ci
          fi
