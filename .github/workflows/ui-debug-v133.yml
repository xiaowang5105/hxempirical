name: UI debug v1.3.3
on:
  push:
    branches: [ui-selfcheck-v132b]
    paths: ['.github/workflows/ui-debug-v133.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_ui_selfcheck_fix_v133.py
      - name: Compile and render debug state
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-debug
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          cat > /tmp/DebugUi.java <<'EOF'
          import java.awt.*;import java.awt.image.BufferedImage;import java.io.*;import java.lang.reflect.*;import javax.imageio.ImageIO;import javax.swing.*;
          public class DebugUi{static Field f(Class<?>c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}static Method m(Class<?>c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}static AbstractButton button(Container c,String text){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&text.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=button((Container)x,text);if(b!=null)return b;}}return null;}static void render(JFrame frame,String p)throws Exception{Container c=frame.getContentPane();BufferedImage im=new BufferedImage(c.getWidth(),c.getHeight(),BufferedImage.TYPE_INT_RGB);Graphics2D g=im.createGraphics();c.printAll(g);g.dispose();ImageIO.write(im,"png",new File(p));}static void hierarchy(Component x){int i=0;for(Component c=x;c!=null;c=c.getParent()){System.out.println("ANCESTOR "+(i++)+" "+c.getClass().getName()+" bounds="+c.getBounds()+" pref="+c.getPreferredSize()+" min="+c.getMinimumSize());}}
          public static void main(String[]a)throws Exception{final Throwable[]e={null};SwingUtilities.invokeAndWait(()->{try{Class<?>c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?>ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame frame=(JFrame)ct.newInstance(true);frame.addNotify();m(c,"showXtregWizardPageV130").invoke(frame);frame.setSize(1600,900);frame.getContentPane().setSize(1600,900);frame.validate();layout(frame.getContentPane());JSplitPane split=(JSplitPane)f(c,"commandDataSplit").get(frame);split.setDividerLocation(.40);frame.validate();layout(frame.getContentPane());JScrollPane scroll=(JScrollPane)f(c,"formScroll").get(frame);JPanel form=(JPanel)f(c,"formPanel").get(frame);AbstractButton run=button(form,"运行 xtreg");System.out.println("SPLIT="+split.getBounds()+" divider="+split.getDividerLocation()+" left="+split.getLeftComponent().getBounds()+" right="+split.getRightComponent().getBounds());System.out.println("SCROLL="+scroll.getBounds()+" viewport="+scroll.getViewport().getExtentSize()+" FORM="+form.getBounds()+" pref="+form.getPreferredSize()+" min="+form.getMinimumSize());System.out.println("RUN="+(run==null?"null":run.getBounds()));if(run!=null)hierarchy(run);render(frame,"/tmp/ui-debug/1600-40.png");frame.dispose();}catch(Throwable t){e[0]=t;}});if(e[0]!=null){e[0].printStackTrace();System.exit(2);}System.exit(0);}}
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/DebugUi.java
          xvfb-run -a java -cp /tmp/classes DebugUi
      - uses: actions/upload-artifact@v4
        with:
          name: ui-debug-v133
          path: /tmp/ui-debug/*.png
          if-no-files-found: error
