name: UI page inventory audit

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - '.github/workflows/ui-page-audit.yml'

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
      - name: Inspect remaining legacy page builders
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')
          def body(name):
              marker=f'      private void {name}('
              p=s.index(marker)
              start=s.index('{',p)
              depth=0
              for i in range(start,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          return s[p:i+1]
              raise RuntimeError(name)
          for name in ['showRegressPage','showSpecialGraphPage']:
              print(f'HX_METHOD_BEGIN {name}')
              print(body(name))
              print(f'HX_METHOD_END {name}')
          PY
