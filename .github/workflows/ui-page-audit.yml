name: UI page inventory audit

on:
  push:
    branches: [ui-consistency-audit-20260815]
    paths:
      - '.github/workflows/ui-page-audit.yml'

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
      - name: Inventory page-building methods
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')
          pat = re.compile(r'\n\s+private\s+(?:void|int|JComponent|JPanel)\s+([A-Za-z0-9_]+)\s*\([^)]*\)\s*\{')
          rows=[]
          for m in pat.finditer(s):
              name=m.group(1)
              if not (name.startswith(('show','open','populate','build','browse'))):
                  continue
              start=s.find('{',m.start())
              depth=0
              end=None
              for i in range(start,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
              if end is None: continue
              body=s[start:end]
              if 'formPanel' not in body and 'commandTitle' not in body and 'workspace' not in body.lower():
                  continue
              rows.append((name, body.count('addField('), body.count('xtregWizardCardV130('), body.count('StepStrip'), body.count('GridLayout('), len(body.splitlines())))
          print('HX_UI_PAGE_INVENTORY_BEGIN')
          for r in rows:
              print(f'{r[0]}|addField={r[1]}|cards={r[2]}|steps={r[3]}|grids={r[4]}|lines={r[5]}')
          print('HX_UI_PAGE_INVENTORY_END')
          PY
