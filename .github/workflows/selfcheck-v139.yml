name: Deeper result-pane selfcheck v1.3.9

on:
  push:
    branches: [selfcheck-v139]
    paths: ['.github/workflows/selfcheck-v139.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audited patch and interaction tests
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/audit.sh
          bash /tmp/audit.sh
