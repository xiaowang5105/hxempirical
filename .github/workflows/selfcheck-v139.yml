name: Deeper result-pane selfcheck v1.3.9

on:
  push:
    branches: [selfcheck-v139]
    paths: ['.github/workflows/selfcheck-v139.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_method(src, signature, replacement):
              start = src.index(signature)
              brace = src.index('{', start)
              depth = 0
              i = brace
              in_str = False
              esc = False
              quote = ''
              while i < len(src):
                  ch = src[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          in_str = False
                  else:
                      if ch in ('"', "'"):
                          in_str = True
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return src[:start] + replacement + src[i+1:]
                  i += 1
              raise RuntimeError('unbalanced method: ' + signature)

          p=Path('src/main/java/com/hexie/stata/HxWorkbench.java')
          s=p.read_text(encoding='utf-8')
          assert 'public static final String VERSION = "1.3.8";' in s
          s=s.replace('public static final String VERSION = "1.3.8";', 'public static final String VERSION = "1.3.9";', 1)
          s=s.replace('SFIToolkit.displayln("HxWorkbench 1.3.8");', 'SFIToolkit.displayln("HxWorkbench 1.3.9");', 1)

          s=replace_method(s, '      static String lastNativeOutput()', '''      static String lastNativeOutput() {
         String path = characteristic("hxtoolbox_last_results_file");
         if (path == null || path.isBlank()) {
            return "";
         }

         try {
            Path resultPath = Paths.get(path);
            if (!Files.isRegularFile(resultPath)) {
               return "";
            }

            final int maxBytes = 2 * 1024 * 1024;
            long fileSize = Files.size(resultPath);
            byte[] bytes;
            try (InputStream in = Files.newInputStream(resultPath)) {
               bytes = in.readNBytes(maxBytes);
            }

            Charset charset = StandardCharsets.UTF_8;
            int offset = 0;
            if (bytes.length >= 3 && (bytes[0] & 255) == 0xEF && (bytes[1] & 255) == 0xBB && (bytes[2] & 255) == 0xBF) {
               offset = 3;
            } else if (bytes.length >= 2 && (bytes[0] & 255) == 0xFF && (bytes[1] & 255) == 0xFE) {
               charset = StandardCharsets.UTF_16LE;
               offset = 2;
            } else if (bytes.length >= 2 && (bytes[0] & 255) == 0xFE && (bytes[1] & 255) == 0xFF) {
               charset = StandardCharsets.UTF_16BE;
               offset = 2;
            }

            String text = new String(bytes, offset, Math.max(0, bytes.length - offset), charset).replace("\\u0000", "").stripTrailing();
            if (fileSize > bytes.length) {
               text += "\\n\\n[输出过长：工具箱仅显示前 2 MB；完整内容仍保留在 Stata Results。]";
            }
            return text;
         } catch (Throwable var2) {
            return "";
         }
      }''')

          s=replace_method(s, '      private void syncRightPaneTitle()', '''      private void syncRightPaneTitle() {
         int index = this.dataTabs.getSelectedIndex();
         if (index == 1) {
            this.rightPaneTitle.setText("结果");
            this.refreshButton.setVisible(false);
            String command = this.lastExecutedCommand == null ? "" : this.lastExecutedCommand.trim();
            this.dataLabel.setText(command.isBlank() ? "运行命令后显示 Stata 原始输出与执行摘要" : "最近命令：" + shortenCommand(command));
         } else if (index == 2) {
            this.rightPaneTitle.setText("运行日志");
            this.refreshButton.setVisible(false);
            this.dataLabel.setText(this.runInProgress ? "命令执行中 · 查看实时计时与状态" : "执行状态、耗时、Return code 与 History");
         } else {
            this.rightPaneTitle.setText("当前数据");
            this.refreshButton.setVisible(true);
            long n = Data.getObsTotal();
            int k = Data.getVarCount();
            String dataHint = "xtreg".equals(this.currentCommand) ? " | 拖动表头变量可直接填入左侧变量框" : " | 表格只读，可横向和纵向滚动";
            this.dataLabel.setText(n != 0L && k != 0 ? n + " 行 × " + k + " 列" + dataHint : "尚未载入数据");
         }
      }''')

          refresh_marker='''         this.refreshHomeContext();\n      }\n\n      private void compareSnapshots'''
          assert refresh_marker in s
          s=s.replace(refresh_marker, '''         this.syncRightPaneTitle();\n         this.refreshHomeContext();\n      }\n\n      private void compareSnapshots''', 1)
          p.write_text(s,encoding='utf-8')

          p=Path('hxempirical.ado'); a=p.read_text(encoding='utf-8'); assert '1.3.8' in a; p.write_text(a.replace('1.3.8','1.3.9'),encoding='utf-8')
          p=Path('hxempirical.pkg'); a=p.read_text(encoding='utf-8'); assert 'd Version 1.3.8' in a; p.write_text(a.replace('d Version 1.3.8','d Version 1.3.9',1),encoding='utf-8')
          p=Path('hxempirical.sthlp'); a=p.read_text(encoding='utf-8'); p.write_text(a.replace('1.3.8','1.3.9'),encoding='utf-8')
          p=Path('README.md'); a=p.read_text(encoding='utf-8');
          a=a.replace('**当前发布版本：1.3.8**','**当前发布版本：1.3.9**',1).replace('**上次修改时间：2026-08-13 14:31（UTC+8）**','**上次修改时间：2026-08-13 14:42（UTC+8）**',1)
          a=a.replace('5. 常用参数优先显示，低频参数放入“更多设置”。','5. 常用参数优先显示，低频参数按顺序放在后面，不通过隐藏式“更多设置”改变页面结构。',1)
          p.write_text(a,encoding='utf-8')
          print('PATCH_OK')
          PY

      - name: Compile Java 11 and rebuild jar
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class SFIToolkit { public static final List<String> commands=new ArrayList<>(); public static int executeCommand(String s, boolean b){commands.add(s);return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; import java.util.*; public class Characteristic { private static final Map<String,String>M=new HashMap<>(); public static String getDtaChar(String s){return M.getOrDefault(s,"");} public static void setDtaChar(String s,String v){M.put(s,v);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar

      - name: Run interaction and bounded-output audit
        shell: bash
        run: |
          cat > /tmp/InspectorAudit.java <<'EOF'
          import java.lang.reflect.*; import java.nio.file.*; import javax.swing.*; import com.stata.sfi.*;
          public class InspectorAudit {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void ck(boolean v,String s){if(!v)throw new AssertionError(s);}
            public static void main(String[] args)throws Exception{
              final Throwable[] err={null};
              SwingUtilities.invokeAndWait(()->{try{
                Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame"); Constructor<?> ct=c.getDeclaredConstructor(boolean.class); ct.setAccessible(true); JFrame fr=(JFrame)ct.newInstance(true); fr.addNotify();
                JTabbedPane tabs=(JTabbedPane)f(c,"dataTabs").get(fr); JLabel title=(JLabel)f(c,"rightPaneTitle").get(fr); JLabel sub=(JLabel)f(c,"dataLabel").get(fr); JButton refresh=(JButton)f(c,"refreshButton").get(fr);
                Field last=f(c,"lastExecutedCommand"); last.set(fr,"xtreg price mpg weight, fe vce(robust)");
                Method sync=m(c,"syncRightPaneTitle");
                tabs.setSelectedIndex(1); sync.invoke(fr); ck("结果".equals(title.getText()),"result title"); ck(!refresh.isVisible(),"refresh visible in Results"); ck(sub.getText().contains("最近命令")&&sub.getText().contains("xtreg"),"result subtitle="+sub.getText());
                Method refreshData=m(c,"refreshDataset",boolean.class); refreshData.invoke(fr,false); ck(sub.getText().contains("最近命令"),"dataset refresh overwrote Results subtitle: "+sub.getText());
                tabs.setSelectedIndex(2); sync.invoke(fr); ck("运行日志".equals(title.getText()),"log title"); ck(!refresh.isVisible(),"refresh visible in Logs"); ck(sub.getText().contains("Return code")&&sub.getText().contains("History"),"log subtitle="+sub.getText());
                tabs.setSelectedIndex(0); sync.invoke(fr); ck("当前数据".equals(title.getText()),"data title"); ck(refresh.isVisible(),"refresh hidden in Data"); ck("尚未载入数据".equals(sub.getText()),"data subtitle="+sub.getText());
                JTextArea result=(JTextArea)f(c,"resultSummaryArea").get(fr); ck(!result.getLineWrap(),"Results mirror wraps");
                fr.dispose();
              }catch(Throwable t){err[0]=t;}}); if(err[0]!=null)throw new RuntimeException(err[0]);

              Path huge=Paths.get("/tmp/hx_huge_result.txt"); String chunk="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\n"; StringBuilder b=new StringBuilder(); while(b.length()<3*1024*1024)b.append(chunk); Files.writeString(huge,b.toString()); Characteristic.setDtaChar("hxtoolbox_last_results_file",huge.toString());
              Class<?> bridge=Class.forName("com.hexie.stata.HxWorkbench$StataBridge"); Method read=m(bridge,"lastNativeOutput"); String out=(String)read.invoke(null); ck(out.length()<2200000,"huge output not bounded: "+out.length()); ck(out.contains("仅显示前 2 MB"),"truncation marker missing");
              Path small=Paths.get("/tmp/hx_small_result.txt"); Files.writeString(small,"Fixed-effects regression\nprice | Coefficient Std. err. t P>|t|\nmpg | -49.5 86.1 -0.57 0.567\n"); Characteristic.setDtaChar("hxtoolbox_last_results_file",small.toString()); String raw=(String)read.invoke(null); ck(raw.contains("Coefficient")&&!raw.contains("仅显示前 2 MB"),"small output altered");
              System.out.println("INSPECTOR_AUDIT_OK");
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/InspectorAudit.java
          xvfb-run -a java -cp /tmp/classes InspectorAudit
          grep -q 'public static final String VERSION = "1.3.9"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'd Version 1.3.9' hxempirical.pkg
          grep -q '低频参数按顺序放在后面' README.md

      - name: Smoke-render shared inspector pages
        shell: bash
        run: |
          for mode in home regress monitor-details oneclick; do
            xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-${mode}-preview /tmp/${mode}.png
            test -s /tmp/${mode}.png
          done

      - name: Commit audited product changes
        shell: bash
        run: |
          rm -f .github/workflows/selfcheck-v139.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten shared inspector state and bound Stata result mirroring [v1.3.9]'
          git push origin HEAD:selfcheck-v139
