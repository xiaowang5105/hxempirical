name: Apply v1.5.4 spreadsheet and external commands

on:
  push:
    branches: [spreadsheet-external-v154-20260815]

permissions:
  contents: write

jobs:
  patch-audit-build:
    if: github.event.head_commit.message != 'Add spreadsheet data operations and installed external commands [v1.5.4]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spreadsheet-external-v154-20260815
          fetch-depth: 0

      - name: Apply product patches
        run: |
          sed -i 's/marker = "### 1.5.3 目录显示修复\\n"/marker = "### 1.5.4 目录显示修复\\n"/' .github/scripts/apply_v154_spreadsheet_external.py
          python .github/scripts/apply_v154_spreadsheet_external.py
          python .github/scripts/apply_v154_spreadsheet_followup.py

      - name: Create Stata SFI test stubs
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/hxclasses /tmp/hxtestsrc/com/hexie/stata /tmp/hxtestclasses
          cat >/tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit {
            public static String lastCommand="";
            public static boolean lastHistory=false;
            public static int executeCommand(String s, boolean b){
              lastCommand=s; lastHistory=b;
              if (s != null && s.startsWith("quietly which ") && s.endsWith("oneclick_robustness")) return 111;
              return 0;
            }
            public static void reset(){lastCommand="";lastHistory=false;}
            public static void displayln(String s){System.out.println(s);}
            public static void errorln(String s){System.err.println(s);}
            public static String stackTraceToString(Throwable t){return t==null?"":t.toString();}
          }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi;
          public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi;
          public class Macro { public static String getGlobal(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi;
          public class Missing { public static boolean isMissing(double v){return Double.isNaN(v);} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi;
          public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            private static final String[] N={"make","price","mpg"};
            private static final String[][] V={{"AMC Concord","4099","22"},{"AMC Pacer","4749","17"},{"AMC Spirit","3799","22"}};
            public static long getObsTotal(){return V.length;}
            public static int getVarCount(){return N.length;}
            public static int getVarIndex(String s){for(int i=0;i<N.length;i++) if(N[i].equals(s)) return i+1; return 0;}
            public static String getVarName(int i){return N[i-1];}
            public static String getVarLabel(int i){return i==1?"Make and model":i==2?"Price":"Mileage";}
            public static String getVarFormat(int i){return i==1?"%18s":"%9.0g";}
            public static boolean isVarTypeString(int i){return i==1;}
            public static double getNum(int i,long j){try{return Double.parseDouble(V[(int)j-1][i-1]);}catch(Exception e){return Double.NaN;}}
            public static String getStr(int i,long j){return V[(int)j-1][i-1];}
            public static String getFormattedValue(int i,long j,boolean b){return V[(int)j-1][i-1];}
          }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi;
          public class Frame {
            public static Frame connect(String s){return new Frame();}
            public static Frame create(String s){return new Frame();}
            public void drop(){}
            public long getObsTotal(){return 0L;}
            public int getVarCount(){return 0;}
            public int getVarIndex(String s){return 0;}
            public String getVarName(int i){return "";}
            public boolean isVarTypeString(int i){return false;}
            public double getNum(int i,long j){return Double.NaN;}
            public String getStr(int i,long j){return "";}
            public String getFormattedValue(int i,long j,boolean b){return "";}
          }
          EOF

      - name: Compile Java 11
        run: javac --release 11 -Xmaxerrs 200 -d /tmp/hxclasses /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Build live Swing spreadsheet/external harness
        run: |
          cat >/tmp/hxtestsrc/com/hexie/stata/V154Smoke.java <<'EOF'
          package com.hexie.stata;
          import com.stata.sfi.SFIToolkit;
          import java.lang.reflect.*;
          import java.util.*;
          import javax.swing.*;
          import javax.swing.table.AbstractTableModel;
          public class V154Smoke {
            static Field field(Class<?> c,String n)throws Exception{Field f=c.getDeclaredField(n);f.setAccessible(true);return f;}
            static Method method(Class<?> c,String n,Class<?>...p)throws Exception{Method m=c.getDeclaredMethod(n,p);m.setAccessible(true);return m;}
            static void require(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
            static void runLive() throws Exception {
              Class<?> cls=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");
              Constructor<?> ctor=cls.getDeclaredConstructor(boolean.class); ctor.setAccessible(true);
              Object frame=ctor.newInstance(false);
              method(cls,"refreshDataset",boolean.class).invoke(frame,false);
              AbstractTableModel model=(AbstractTableModel)field(cls,"dataModel").get(frame);
              JTable table=(JTable)field(cls,"dataTable").get(frame);
              require(model.getRowCount()==3 && model.getColumnCount()==3,"live data shape wrong");
              require(model.isCellEditable(0,1),"live data cell must be editable");

              SFIToolkit.reset();
              model.setValueAt("4,500",0,1);
              require("replace price = 4500 in 1".equals(SFIToolkit.lastCommand),"literal cell edit command="+SFIToolkit.lastCommand);
              require(SFIToolkit.lastHistory,"literal cell edit did not request History");

              table.setRowSelectionInterval(0,0); table.setColumnSelectionInterval(1,1);
              JTextField formula=(JTextField)field(cls,"dataFormulaField").get(frame);
              formula.setText("=price/mpg");
              SFIToolkit.reset();
              method(cls,"applySpreadsheetToSelectedCell").invoke(frame);
              require("replace price = price/mpg in 1".equals(SFIToolkit.lastCommand),"formula command="+SFIToolkit.lastCommand);
              require(SFIToolkit.lastHistory,"formula did not request History");
              JLabel ref=(JLabel)field(cls,"dataCellRefLabel").get(frame);
              require("price[1]".equals(ref.getText()),"cell reference wrong: "+ref.getText());

              SFIToolkit.reset();
              model.setValueAt("New model",0,0);
              require(SFIToolkit.lastCommand.startsWith("replace make = `\"New model\"' in 1"),"string cell edit wrong: "+SFIToolkit.lastCommand);
              require(SFIToolkit.lastHistory,"string edit did not request History");

              method(cls,"browseInstalledExternalCommands").invoke(frame);
              @SuppressWarnings("unchecked") List<String> cmds=(List<String>)field(cls,"chooserAvailableCommands").get(frame);
              require(cmds.contains("reghdfe") && cmds.contains("ppmlhdfe") && cmds.contains("oneclick"),"installed external commands missing: "+cmds);
              require(!cmds.contains("oneclick_robustness"),"missing external command incorrectly shown: "+cmds);
              require("external".equals(field(cls,"activeSidebarKey").get(frame)),"external sidebar not active");
              @SuppressWarnings("unchecked") Map<String,JButton> sidebar=(Map<String,JButton>)field(cls,"sidebarButtons").get(frame);
              require(sidebar.containsKey("external"),"external sidebar button missing");
              require(sidebar.get("external").getText().contains("已下载外部命令"),"external sidebar label wrong");
              require(!sidebar.containsKey("history"),"old history sidebar shortcut still present");
              System.out.println("HX_V154_LIVE_OK commands="+cmds.size()+" ref="+ref.getText());
              ((JFrame)frame).dispose();
            }
            static void runPreview() throws Exception {
              Class<?> cls=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");
              Constructor<?> ctor=cls.getDeclaredConstructor(boolean.class); ctor.setAccessible(true);
              Object frame=ctor.newInstance(true);
              AbstractTableModel model=(AbstractTableModel)field(cls,"dataModel").get(frame);
              method(cls,"populateRegressPreviewState").invoke(frame);
              require(!model.isCellEditable(0,0),"preview data must stay read-only");
              method(cls,"browseInstalledExternalCommands").invoke(frame);
              @SuppressWarnings("unchecked") List<String> cmds=(List<String>)field(cls,"chooserAvailableCommands").get(frame);
              require(cmds.contains("reghdfe") && cmds.contains("oneclick"),"preview external list empty");
              System.out.println("HX_V154_PREVIEW_OK commands="+cmds.size());
              ((JFrame)frame).dispose();
            }
            public static void main(String[] args) throws Exception {
              SwingUtilities.invokeAndWait(() -> {try{runLive();runPreview();}catch(Exception e){throw new RuntimeException(e);}});
            }
          }
          EOF
          javac --release 11 -cp /tmp/hxclasses -d /tmp/hxtestclasses /tmp/hxtestsrc/com/hexie/stata/V154Smoke.java

      - name: Run real Swing interaction smoke under Xvfb
        run: timeout 45s xvfb-run -a java -cp /tmp/hxclasses:/tmp/hxtestclasses com.hexie.stata.V154Smoke

      - name: Render spreadsheet workspace smoke
        run: |
          timeout 45s xvfb-run -a java -cp /tmp/hxclasses com.hexie.stata.HxWorkbench --render-regress-preview /tmp/v154-workspace.png
          test -s /tmp/v154-workspace.png
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v154-workspace.png')
          assert p.stat().st_size > 20000, p.stat().st_size
          print('HX_V154_RENDER_OK bytes=',p.stat().st_size)
          PY

      - name: Verify source interaction invariants
        run: |
          grep -F '"external", "外", "已下载外部命令"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -F 'this.previewValues == null && this.cellCommitter != null' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -F 'private JComponent buildSpreadsheetBar()' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -F 'replace " + variable + " = " + expression + " in " + observation' src/main/java/com/hexie/stata/HxWorkbench.java
          ! grep -F '表格只读，可横向和纵向滚动' src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Rebuild shipped JAR
        run: |
          rm -f hxworkbench.jar
          jar cf hxworkbench.jar -C /tmp/hxclasses com/hexie/stata
          test -s hxworkbench.jar
          javap -verbose -classpath hxworkbench.jar com.hexie.stata.HxWorkbench | grep 'major version: 55'
          ! jar tf hxworkbench.jar | grep -q 'V154Smoke'

      - name: Rebuild release bundle
        shell: pwsh
        run: ./tools/build_release_bundle.ps1

      - name: Verify release
        run: |
          python tools/verify_release.py
          grep -F 'd Version 1.5.4' hxempirical.pkg
          grep -F 'public static final String VERSION = "1.5.4";' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -F '当前发布版本：1.5.4' README.md
          git diff --check

      - name: Commit clean product changes
        run: |
          git config user.name 'xiaowang5105'
          git config user.email '2692127923@qq.com'
          git rm -f .github/scripts/apply_v154_spreadsheet_external.py .github/scripts/apply_v154_spreadsheet_followup.py .github/workflows/apply-v154-spreadsheet-external.yml
          git add -A
          git commit -m 'Add spreadsheet data operations and installed external commands [v1.5.4]'
          git push origin HEAD:spreadsheet-external-v154-20260815
