name: Apply v1.5.4 spreadsheet and external commands

on:
  push:
    branches: [spreadsheet-external-v154-20260815]

permissions:
  contents: write

jobs:
  patch-audit-build:
    if: github.event.head_commit.message != 'Add spreadsheet data operations and installed external commands [v1.5.4]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spreadsheet-external-v154-20260815
          fetch-depth: 0
      - name: Patch, audit, build and commit v1.5.4
        run: bash .github/scripts/run_v154_audit.sh
