name: Apply structured binary outcomes UI

on:
  push:
    branches: [ui-consistency-audit-20260815]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch binary-outcome pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          jp = Path('src/main/java/com/hexie/stata/HxWorkbench.java')
          sp = Path('tools/verify_static_contracts.py')
          java = jp.read_text(encoding='utf-8')
          static = sp.read_text(encoding='utf-8')

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  print(f'HX_BINARY_PATCH_FAIL {label}: {n}', file=sys.stderr)
                  raise SystemExit(1)
              return text.replace(old, new)

          # Classifier.
          old = '''      private static boolean isStructuredLinearRelatedCommand(String command) {
         return Arrays.asList("hetregress", "intreg", "tobit", "truncreg", "sqreg").contains(command);
      }

      private static boolean isStructuredPrSdTestCommand(String command) {'''
          new = '''      private static boolean isStructuredLinearRelatedCommand(String command) {
         return Arrays.asList("hetregress", "intreg", "tobit", "truncreg", "sqreg").contains(command);
      }

      private static boolean isStructuredBinaryOutcomeCommand(String command) {
         return Arrays.asList("binreg", "biprobit", "hetprobit").contains(command);
      }

      private static boolean isStructuredPrSdTestCommand(String command) {'''
          java = one(java, old, new, 'binary classifier')

          # Inspector roles: insert before first structured-linear role block.
          marker = '         if (isStructuredLinearRelatedCommand(this.currentCommand)) {\n'
          pos = java.find(marker)
          classifier_pos = java.find('      private static boolean isStructuredLinearRelatedCommand')
          if pos < 0 or pos > classifier_pos:
              print('HX_BINARY_PATCH_FAIL inspector anchor', file=sys.stderr)
              raise SystemExit(1)
          role = '''         if (isStructuredBinaryOutcomeCommand(this.currentCommand)) {
            if ("binreg".equals(this.currentCommand)) {
               if (variable.equals(selected(this.depvar))) return "二元 / 二项结果 Y";
               if (this.variables.getSelectedValuesList().contains(variable)) return "解释变量 X";
               if (variable.equals(this.expression.getText().trim())) return "试验次数 n()";
            } else if ("biprobit".equals(this.currentCommand)) {
               if (variable.equals(selected(this.depvar))) return "二元结果 Y1";
               if (variable.equals(selected(this.panel))) return "二元结果 Y2";
               if (this.variables.getSelectedValuesList().contains(variable)) return this.model.getSelectedIndex() == 0 ? "共享解释变量 X" : "方程 1 解释变量";
               if (this.absorb.getSelectedValuesList().contains(variable)) return "方程 2 解释变量";
            } else if ("hetprobit".equals(this.currentCommand)) {
               if (variable.equals(selected(this.depvar))) return "二元结果 Y";
               if (this.variables.getSelectedValuesList().contains(variable)) return "均值方程 X";
               if (this.absorb.getSelectedValuesList().contains(variable)) return "方差方程 het()";
               if (variable.equals(this.expression.getText().trim())) return "方差方程 offset()";
            }
         }
'''
          java = java[:pos] + role + java[pos:]

          # Rebuild route.
          old = '''         if (isStructuredLinearRelatedCommand(this.currentCommand)) {
            this.rebuildStructuredLinearRelatedForm();
            return;
         }

         if (isStructuredPrSdTestCommand(this.currentCommand)) {'''
          new = '''         if (isStructuredBinaryOutcomeCommand(this.currentCommand)) {
            this.rebuildStructuredBinaryOutcomeForm();
            return;
         }

         if (isStructuredLinearRelatedCommand(this.currentCommand)) {
            this.rebuildStructuredLinearRelatedForm();
            return;
         }

         if (isStructuredPrSdTestCommand(this.currentCommand)) {'''
          java = one(java, old, new, 'binary rebuild route')

          # Preview route.
          old = '''            } else if (isStructuredLinearRelatedCommand(this.currentCommand)) {
               this.updateStructuredLinearRelatedPreview();
            } else if (isStructuredPrSdTestCommand(this.currentCommand)) {'''
          new = '''            } else if (isStructuredBinaryOutcomeCommand(this.currentCommand)) {
               this.updateStructuredBinaryOutcomePreview();
            } else if (isStructuredLinearRelatedCommand(this.currentCommand)) {
               this.updateStructuredLinearRelatedPreview();
            } else if (isStructuredPrSdTestCommand(this.currentCommand)) {'''
          java = one(java, old, new, 'binary preview route')

          # Validation route.
          old = '''      private boolean validateOrdinaryCommandBeforeRun() {
         String command = this.currentCommand;
         if (isStructuredLinearRelatedCommand(command) && !this.validateStructuredLinearRelatedBeforeRun()) return false;'''
          new = '''      private boolean validateOrdinaryCommandBeforeRun() {
         String command = this.currentCommand;
         if (isStructuredBinaryOutcomeCommand(command) && !this.validateStructuredBinaryOutcomeBeforeRun()) return false;
         if (isStructuredLinearRelatedCommand(command) && !this.validateStructuredLinearRelatedBeforeRun()) return false;'''
          java = one(java, old, new, 'binary validation route')

          # Binary models only support f/i/p weights in official syntax; no aweights.
          old = '''         if (Arrays.asList("didregress", "xtdidregress").contains(this.currentCommand)) {
            var2 = Arrays.asList("无", "fweight", "aweight", "pweight");'''
          new = '''         if (Arrays.asList("logit", "logistic", "binreg", "probit", "biprobit", "hetprobit", "scobit", "cloglog").contains(this.currentCommand)) {
            var2 = Arrays.asList("无", "fweight", "iweight", "pweight");
         } else if (Arrays.asList("didregress", "xtdidregress").contains(this.currentCommand)) {
            var2 = Arrays.asList("无", "fweight", "aweight", "pweight");'''
          java = one(java, old, new, 'binary weight types')

          # Structured implementation goes immediately before linear-related implementation.
          anchor = '      private void rebuildStructuredLinearRelatedForm() {\n'
          if java.count(anchor) != 1:
              print(f'HX_BINARY_PATCH_FAIL implementation anchor: {java.count(anchor)}', file=sys.stderr)
              raise SystemExit(1)
          impl = r'''      private void rebuildStructuredBinaryOutcomeForm() {
         String command = this.currentCommand;
         boolean binreg = "binreg".equals(command);
         boolean biprobit = "biprobit".equals(command);
         boolean hetprobit = "hetprobit".equals(command);

         this.model.removeAllItems();
