name: Temporary summary and power rebuild

on:
  push:
    branches:
      - ui-consistency-audit-20260815
    paths:
      - .hx-summary-power-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden family-level insertion target
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp_patch_summary_power.py')
          text = p.read_text(encoding='utf-8')
          old = "family_marker = '    /* Family-level copy for catalog commands that rely on the generic syntax parser.\\n'"
          new = "family_marker = '    /* Family-level copy for catalog commands that rely on the generic syntax parser.\\n       Keep the parsed Stata syntax/flags unchanged; only improve beginner-facing semantics. */\\n'"
          if old not in text:
              raise SystemExit('family insertion marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Patch summary, power, Meta, and resampling semantics
        run: python tools/tmp_patch_summary_power.py
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release and static contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxregistry.ado hxsemantics.ado tools/verify_static_contracts.py hxempirical-release.zip hxempirical-release.index release
          git diff --cached --quiet && exit 0
          git commit -m "Complete summary and power command workflows"
          git push origin HEAD:ui-consistency-audit-20260815
