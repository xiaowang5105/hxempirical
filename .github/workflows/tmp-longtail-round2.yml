name: Temporary long-tail round 2 rebuild

on:
  push:
    branches:
      - ui-consistency-audit-20260815
    paths:
      - .hx-longtail-round2-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove stale epoisson catalog token everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          old = "eregress eprobit eoprobit epoisson eintreg"
          new = "eregress eprobit eoprobit eintreg"
          for name in ("hxregistry.ado", "hxsemantics.ado"):
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected stale sequence not found in {name}")
              text = text.replace(old, new)
              p.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Patch long-tail command semantics
        run: python tools/tmp_patch_longtail_round2.py
      - name: Fix exact-token catalog regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_static_contracts.py')
          text = p.read_text(encoding='utf-8')
          old = 'if "epoisson" in stats_cmds or "epoisson" in registry or "epoisson" in semantics:\n'
          new = '''if (\n    "epoisson" in stats_cmds\n    or re.search(r"(?<![A-Za-z0-9_])epoisson(?![A-Za-z0-9_])", registry)\n    or re.search(r"(?<![A-Za-z0-9_])epoisson(?![A-Za-z0-9_])", semantics)\n):\n'''
          if old not in text:
              raise SystemExit('broad epoisson guard not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release and static contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxregistry.ado hxsemantics.ado tools/verify_static_contracts.py hxempirical-release.zip hxempirical-release.index release
          git diff --cached --quiet && exit 0
          git commit -m "Improve panel and complex Statistics semantics"
          git push origin HEAD:ui-consistency-audit-20260815
