name: Third UI and package audit v1.3.3 rerun

on:
  push:
    branches: [ui-selfcheck-v133-round3]
    paths:
      - '.github/workflows/ui-third-audit-v133b.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Stata SFI compile stubs and compile
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-audit
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf /tmp/rebuilt-hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s /tmp/rebuilt-hxworkbench.jar
          jar tf hxworkbench.jar | grep -q 'com/hexie/stata/HxWorkbench.class'
          unzip -p hxworkbench.jar com/hexie/stata/HxWorkbench.class | strings | grep -q '1.3.3'

      - name: Run third functional UI audit
        shell: bash
        run: |
          cat > /tmp/ThirdUiAudit.java <<'EOF'
          import java.awt.*;
          import java.awt.datatransfer.StringSelection;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.lang.reflect.*;
          import java.util.Objects;
          import javax.imageio.ImageIO;
          import javax.swing.*;
          public class ThirdUiAudit {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static void settle(JFrame frame,int w,int h){frame.setSize(w,h);frame.setVisible(true);frame.validate();layout(frame.getContentPane());Toolkit.getDefaultToolkit().sync();}
            static AbstractButton button(Container c,String text){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&text.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=button((Container)x,text);if(b!=null)return b;}}return null;}
            static JComboBox<?> comboContaining(Container c,String value){for(Component x:c.getComponents()){if(x instanceof JComboBox){JComboBox<?> q=(JComboBox<?>)x;for(int i=0;i<q.getItemCount();i++)if(value.equals(Objects.toString(q.getItemAt(i),"")))return q;}if(x instanceof Container){JComboBox<?> q=comboContaining((Container)x,value);if(q!=null)return q;}}return null;}
            static void render(JFrame frame,String path)throws Exception{Container c=frame.getContentPane();BufferedImage im=new BufferedImage(Math.max(1,c.getWidth()),Math.max(1,c.getHeight()),BufferedImage.TYPE_INT_RGB);Graphics2D g=im.createGraphics();c.printAll(g);g.dispose();ImageIO.write(im,"png",new File(path));}
            static String activeKey(Class<?> c,Object frame)throws Exception{return Objects.toString(f(c,"activeSidebarKey").get(frame),"");}
            static void selectCombo(JComboBox<?> q,String value){for(int i=0;i<q.getItemCount();i++){if(value.equals(Objects.toString(q.getItemAt(i),""))){q.setSelectedIndex(i);return;}}throw new AssertionError("combo value missing: "+value);}
            static int selectedIndex(JList<?> list,String value){for(int i=0;i<list.getModel().getSize();i++)if(value.equals(Objects.toString(list.getModel().getElementAt(i),"")))return i;return -1;}
            static void checkFormCards(JPanel form,String ctx){int panels=0;for(Component x:form.getComponents()){if(x instanceof JPanel){panels++;check(x.getWidth()>0&&x.getHeight()>0,ctx+" top-level card collapsed: "+x.getBounds());}}check(panels>=5,ctx+" expected wizard panels, got "+panels);}
            static void checkButtonInForm(AbstractButton b,JPanel form,String ctx){check(b!=null,ctx+" missing");Rectangle r=SwingUtilities.convertRectangle(b.getParent(),b.getBounds(),form);check(r.width>20&&r.height>15&&r.x>=-1&&r.x+r.width<=form.getWidth()+2,ctx+" clipped: "+r+" formW="+form.getWidth());}
            public static void main(String[] args)throws Exception{final Throwable[] err={null};SwingUtilities.invokeAndWait(()->{try{
              Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?> ctor=c.getDeclaredConstructor(boolean.class);ctor.setAccessible(true);JFrame frame=(JFrame)ctor.newInstance(true);frame.addNotify();
              m(c,"showHomePage").invoke(frame);settle(frame,1366,768);check("home".equals(activeKey(c,frame)),"home active state");
              for(String key:new String[]{"data","stats","graph","oneclick"}){m(c,"browseCategoryOverview",String.class).invoke(frame,key);settle(frame,1366,768);check(key.equals(activeKey(c,frame)),"category active state: "+key);}
              m(c,"showXtregWizardPageV130").invoke(frame);JSplitPane split=(JSplitPane)f(c,"commandDataSplit").get(frame);JScrollPane scroll=(JScrollPane)f(c,"formScroll").get(frame);JPanel form=(JPanel)f(c,"formPanel").get(frame);@SuppressWarnings("unchecked") JComboBox<String> panel=(JComboBox<String>)f(c,"xtregPanelVar").get(frame);@SuppressWarnings("unchecked") JComboBox<String> time=(JComboBox<String>)f(c,"xtregTimeVar").get(frame);@SuppressWarnings("unchecked") JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(frame);@SuppressWarnings("unchecked") JList<String> indep=(JList<String>)f(c,"xtregIndepList").get(frame);
              int[][] sizes={{1920,1080},{1600,900},{1366,768},{1280,720}};double[] ratios={.33,.40,.55,.70};for(int[] sz:sizes)for(double ratio:ratios){settle(frame,sz[0],sz[1]);split.setDividerLocation(ratio);frame.validate();layout(frame.getContentPane());check(form.getWidth()<=scroll.getViewport().getExtentSize().width+2,"horizontal form overflow "+sz[0]+" r="+ratio);checkFormCards(form,"xtreg "+sz[0]+" r="+ratio);for(String txt:new String[]{"固定效应（FE）","随机效应（RE）","between","population-averaged","上一步","清空设置","运行 xtreg"})checkButtonInForm(button(form,txt),form,txt+" "+sz[0]+" r="+ratio);check(dep.getHeight()>=24&&dep.getHeight()<=40,"Y selector height "+dep.getHeight());check(panel.getHeight()>=24&&panel.getHeight()<=40,"panel selector height "+panel.getHeight());check(time.getHeight()>=24&&time.getHeight()<=40,"time selector height "+time.getHeight());}
              settle(frame,1366,768);split.setDividerLocation(.40);frame.validate();layout(frame.getContentPane());render(frame,"/tmp/ui-audit/xtreg-1366-40.png");
              selectCombo(panel,"foreign");selectCombo(time,"rep78");selectCombo(dep,"price");int mpg=selectedIndex(indep,"mpg"), weight=selectedIndex(indep,"weight");check(mpg>=0&&weight>=0,"preview vars missing");indep.setSelectedIndices(new int[]{mpg,weight});AbstractButton fe=button(form,"固定效应（FE）"), re=button(form,"随机效应（RE）"), be=button(form,"between"), pa=button(form,"population-averaged");JComboBox<?> se=comboContaining(form,"稳健标准误");check(se!=null,"SE selector missing");JTextArea preview=(JTextArea)f(c,"previewArea").get(frame);
              fe.doClick();selectCombo(se,"稳健标准误");check("xtreg price mpg weight, fe vce(robust)".equals(preview.getText().trim()),"FE robust preview wrong: "+preview.getText());re.doClick();selectCombo(se,"默认标准误");check("xtreg price mpg weight, re".equals(preview.getText().trim()),"RE default preview wrong: "+preview.getText());be.doClick();selectCombo(se,"按面板聚类");check("xtreg price mpg weight, be vce(cluster foreign)".equals(preview.getText().trim()),"BE cluster preview wrong: "+preview.getText());pa.doClick();selectCombo(se,"稳健标准误");check("xtreg price mpg weight, pa vce(robust)".equals(preview.getText().trim()),"PA robust preview wrong: "+preview.getText());
              indep.clearSelection();check(panel.getTransferHandler().importData(new TransferHandler.TransferSupport(panel,new StringSelection("foreign"))),"panel DnD failed");check(time.getTransferHandler().importData(new TransferHandler.TransferSupport(time,new StringSelection("rep78"))),"time DnD failed");check(dep.getTransferHandler().importData(new TransferHandler.TransferSupport(dep,new StringSelection("price"))),"Y DnD failed");check(indep.getTransferHandler().importData(new TransferHandler.TransferSupport(indep,new StringSelection("mpg"))),"X1 DnD failed");check(indep.getTransferHandler().importData(new TransferHandler.TransferSupport(indep,new StringSelection("weight"))),"X2 DnD failed");check(indep.getSelectedValuesList().contains("mpg")&&indep.getSelectedValuesList().contains("weight"),"multi-X DnD lost selection");
              button(form,"运行 xtreg").doClick();JLabel status=(JLabel)f(c,"statusLabel").get(frame);check(status.getText().startsWith("xtreg 已运行"),"run status wrong: "+status.getText());check(panel.getItemCount()>1&&dep.getItemCount()>1&&indep.getModel().getSize()>1,"variable controls lost after run/refresh");button(form,"清空设置").doClick();check(Objects.toString(panel.getSelectedItem(),"").isBlank(),"clear panel");check(Objects.toString(time.getSelectedItem(),"").isBlank(),"clear time");check(Objects.toString(dep.getSelectedItem(),"").isBlank(),"clear Y");check(indep.getSelectedIndices().length==0,"clear X");check(fe.isSelected(),"clear FE");check(se.getSelectedIndex()==0,"clear SE");
              settle(frame,1366,768);split.setDividerLocation(.55);frame.validate();layout(frame.getContentPane());double before=(double)split.getDividerLocation()/Math.max(1,split.getWidth());m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());JPanel sidebar=(JPanel)f(c,"sidebarPanel").get(frame);check(sidebar.getPreferredSize().width<=60,"sidebar collapse width");double after=(double)split.getDividerLocation()/Math.max(1,split.getWidth());check(Math.abs(after-before)<.12,"split ratio changed too much on collapse: "+before+" -> "+after);m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());check(sidebar.getPreferredSize().width>=180,"sidebar expand width");
              m(c,"browseCategoryOverview",String.class).invoke(frame,"graph");for(String cmd:new String[]{"histogram","kdensity","scatter","lfit","graph_box","did_trends","twoway"}){m(c,"showSpecialGraphPage",String.class).invoke(frame,cmd);settle(frame,1366,768);check(cmd.equals(Objects.toString(f(c,"currentCommand").get(frame),"")),"graph currentCommand "+cmd);JButton rb=(JButton)f(c,"runButton").get(frame);check("绘制图形".equals(rb.getText())&&rb.isEnabled(),"graph run state "+cmd);JPanel fp=(JPanel)f(c,"formPanel").get(frame);check(fp.getWidth()>0&&fp.getHeight()>0,"graph form size "+cmd);}render(frame,"/tmp/ui-audit/graph-twoway.png");
              m(c,"openCommandPage",String.class).invoke(frame,"oneclick");settle(frame,1366,768);JComponent one=(JComponent)f(c,"exactOneClickRoot").get(frame);check(one!=null&&one.getWidth()>0&&one.getHeight()>0,"OneClick root not laid out");JComboBox<?> oy=(JComboBox<?>)f(c,"oneClickY").get(frame), ox=(JComboBox<?>)f(c,"oneClickX").get(frame);check(oy.getItemCount()>1&&ox.getItemCount()>1,"OneClick preview variables missing");render(frame,"/tmp/ui-audit/oneclick.png");JTable table=(JTable)f(c,"dataTable").get(frame);check(table.getTableHeader().getTransferHandler()!=null,"header DnD source missing");check(!table.getTableHeader().getReorderingAllowed(),"header reorder conflicts with DnD");frame.dispose();
            }catch(Throwable t){err[0]=t;}});if(err[0]!=null){err[0].printStackTrace();System.exit(2);}System.out.println("HX_THIRD_UI_AUDIT_OK");System.exit(0);}
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/ThirdUiAudit.java
          xvfb-run -a java -cp /tmp/classes ThirdUiAudit

      - name: Package and documentation consistency audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path('hxempirical.pkg').read_text(encoding='utf-8')
          files=[line[2:].strip() for line in pkg.splitlines() if line.startswith('f ')]
          missing=[p for p in files if not Path(p).exists()]
          assert not missing, f'package lists missing files: {missing}'
          required={'hxempirical.ado','hxempirical.sthlp','hxworkbench.ado','hxworkbench.jar','hxregistry.ado','hxsemantics.ado','hxtestdata.ado'}
          assert required.issubset(files), f'package missing required runtime files: {sorted(required-set(files))}'
          ado=Path('hxempirical.ado').read_text(encoding='utf-8')
          java=Path('src/main/java/com/hexie/stata/HxWorkbench.java').read_text(encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          helptext=Path('hxempirical.sthlp').read_text(encoding='utf-8')
          assert 'Version 1.3.3' in pkg
          assert '1.3.3' in ado
          assert 'VERSION = "1.3.3"' in java
          assert '**当前发布版本：1.3.3**' in readme, 'README version is stale'
          assert 'version 1.3.3' in helptext.lower(), 'help-file version is stale'
          assert 'net install hxempirical, from("https://xiaowang5105.github.io/hxempirical/") replace force' in readme
          print('PACKAGE_DOC_AUDIT_OK')
          PY

      - name: Upload third-round screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-third-audit-v133b
          path: /tmp/ui-audit/*.png
          if-no-files-found: warn
