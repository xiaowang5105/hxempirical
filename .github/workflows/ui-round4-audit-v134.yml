name: Fourth-round UI audit v1.3.4

on:
  push:
    branches: [ui-selfcheck-v134-round4]
    paths: ['.github/workflows/ui-round4-audit-v134.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Stata SFI stubs and compile
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/round4
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf /tmp/rebuilt.jar -C /tmp/classes com/hexie/stata
          test -s /tmp/rebuilt.jar
          jar tf hxworkbench.jar | grep -q 'com/hexie/stata/HxWorkbench.class'
          unzip -p hxworkbench.jar com/hexie/stata/HxWorkbench.class | strings | grep -q '1.3.4'

      - name: Runtime navigation layout and command audit
        shell: bash
        run: |
          cat > /tmp/Round4Audit.java <<'EOF'
          import java.awt.*; import java.lang.reflect.*; import java.util.*; import javax.swing.*;
          public class Round4Audit {
            static Field f(Class<?>c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?>c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void ck(boolean v,String s){if(!v)throw new AssertionError(s);}
            static void lay(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)lay((Container)x);}
            static void settle(JFrame f,int w,int h){f.setSize(w,h);f.setVisible(true);f.validate();lay(f.getContentPane());Toolkit.getDefaultToolkit().sync();}
            static String key(Class<?>c,Object o)throws Exception{return Objects.toString(f(c,"activeSidebarKey").get(o),"");}
            static int buttons(Container c){int n=0;for(Component x:c.getComponents()){if(x instanceof AbstractButton)n++;if(x instanceof Container)n+=buttons((Container)x);}return n;}
            static int labels(Container c,String text){int n=0;for(Component x:c.getComponents()){if(x instanceof JLabel&&text.equals(((JLabel)x).getText()))n++;if(x instanceof Container)n+=labels((Container)x,text);}return n;}
            public static void main(String[]a)throws Exception{final Throwable[]e={null};SwingUtilities.invokeAndWait(()->{try{
              Class<?>c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame");Constructor<?>ct=c.getDeclaredConstructor(boolean.class);ct.setAccessible(true);JFrame fr=(JFrame)ct.newInstance(true);fr.addNotify();
              int[][] sizes={{1920,1080},{1600,900},{1366,768},{1280,720}};
              m(c,"showHomePage").invoke(fr);settle(fr,1366,768);ck("home".equals(key(c,fr)),"home active");
              for(String cat:new String[]{"data","stats","graph","oneclick"}){m(c,"browseCategoryOverview",String.class).invoke(fr,cat);for(int[]z:sizes){settle(fr,z[0],z[1]);ck(cat.equals(key(c,fr)),"sidebar active "+cat);JPanel cp=(JPanel)f(c,"contentPanel").get(fr);ck(cp.getWidth()>300&&cp.getHeight()>250,"content collapsed "+cat+" "+z[0]);ck(buttons(cp)>=2,"too few interactive controls "+cat);}}
              m(c,"browseMethod",String.class,String.class).invoke(fr,"stats","线性模型及相关");settle(fr,1366,768);JPanel cp=(JPanel)f(c,"contentPanel").get(fr);ck(buttons(cp)>=5,"method command list too sparse");
              m(c,"showXtregWizardPageV130").invoke(fr);settle(fr,1280,720);JScrollPane fs=(JScrollPane)f(c,"formScroll").get(fr);JPanel fp=(JPanel)f(c,"formPanel").get(fr);ck(fp.getWidth()<=fs.getViewport().getExtentSize().width+2,"xtreg horizontal overflow");
              m(c,"openBaselineRegressionWorkspace").invoke(fr);settle(fr,1280,720);ck("stats".equals(key(c,fr)),"baseline sidebar state");
              for(String cmd:new String[]{"histogram","kdensity","scatter","lfit","graph_box","twoway"}){m(c,"showSpecialGraphPage",String.class).invoke(fr,cmd);settle(fr,1280,720);ck("graph".equals(key(c,fr)),"graph special sidebar "+cmd);ck(cmd.equals(Objects.toString(f(c,"currentCommand").get(fr),"")),"graph command "+cmd);}
              m(c,"populateOneClickPreviewState").invoke(fr);settle(fr,1280,720);ck("oneclick".equals(key(c,fr)),"oneclick sidebar");JComponent root=(JComponent)f(c,"exactOneClickRoot").get(fr);ck(root!=null&&root.getWidth()>300,"oneclick root");
              JTable dt=(JTable)f(c,"dataTable").get(fr);ck(dt.getTableHeader().getTransferHandler()!=null,"data header DnD missing");ck(!dt.getTableHeader().getReorderingAllowed(),"header reorder conflict");
              fr.dispose();
            }catch(Throwable t){e[0]=t;}});if(e[0]!=null){e[0].printStackTrace();System.exit(2);}System.out.println("ROUND4_RUNTIME_AUDIT_OK");System.exit(0);}}
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/Round4Audit.java
          xvfb-run -a java -cp /tmp/classes Round4Audit

      - name: Official preview screenshots
        shell: bash
        run: |
          for mode in home method graph oneclick regress; do
            xvfb-run -a java -cp /tmp/classes com.hexie.stata.HxWorkbench --render-${mode}-preview /tmp/round4/${mode}.png
            test -s /tmp/round4/${mode}.png
          done

      - name: Package and stale-version audit
        shell: bash
        run: |
          grep -q 'public static final String VERSION = "1.3.4"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'HxWorkbench 1.3.4' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q '^\*! hxempirical 1.3.4 ' hxempirical.ado
          grep -q 'd Version 1.3.4' hxempirical.pkg
          grep -q '当前发布版本：1.3.4' README.md
          grep -q 'version 1.3.4' hxempirical.sthlp
          ! grep -R --exclude-dir=.git --exclude='ui-round4-audit-v134.yml' -nE '当前发布版本：1\.2\.7|version 1\.2\.7|HxWorkbench 1\.3\.3|d Version 1\.3\.3' .
          awk '/^f /{print $2}' hxempirical.pkg | while read f; do test -f "$f" || { echo "missing package file: $f"; exit 1; }; done
          ! grep -q 'safe DID/event study' stata.toc
          echo ROUND4_PACKAGE_AUDIT_OK

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-round4-v134
          path: /tmp/round4/*.png
