name: Apply twoway and diagnostic Graphics patch

on:
  push:
    branches: [ui-consistency-audit-20260815]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align temporary static assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/prepare_graph_diagnostics.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "'rvfplot · 残差 vs 拟合值',": "'diagnosticName = \"残差 vs 拟合值\"',",
              "'rvpplot · 残差 vs predictor',": "'diagnosticName = \"残差 vs predictor\"',",
              "'avplot · Added-variable plot',": "'diagnosticName = \"Added-variable plot\"',",
              "'avplots · 全部 Added-variable plots',": "'diagnosticName = \"全部 Added-variable plots\"',",
              "'lvr2plot · Leverage vs residual-squared',": "'diagnosticName = \"Leverage vs residual-squared\"',",
              "'cprplot · Component-plus-residual plot',": "'diagnosticName = \"Component-plus-residual plot\"',",
              "'acprplot · Augmented component-plus-residual plot',": "'diagnosticName = \"Augmented component-plus-residual plot\"',",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'temporary assertion anchor mismatch: {old}')
              s = s.replace(old, new)
          old_route_check = '''for graph_cmd in ("line", "connected", "qfit", "lowess", "lpoly", "rvfplot", "rvpplot", "avplot", "avplots", "lvr2plot", "cprplot", "acprplot"):
              if graph_cmd not in roc_route_scope:
                  fail(f"twoway/regression-diagnostic graph must route to graph result view: {graph_cmd}")'''
          new_route_check = '''diagnostic_route_lists = re.findall(
              r'Arrays\\.asList\\((.*?)\\)\\.contains\\(this\\.currentCommand\\)\\)\\s*\\{\\s*this\\.selectResultView\\("graph", true\\);',
              java,
              re.DOTALL,
          )
          diagnostic_route_scope = max(diagnostic_route_lists, key=len, default="")
          for graph_cmd in ("line", "connected", "qfit", "lowess", "lpoly", "rvfplot", "rvpplot", "avplot", "avplots", "lvr2plot", "cprplot", "acprplot"):
              if f'"{graph_cmd}"' not in diagnostic_route_scope:
                  fail(f"twoway/regression-diagnostic graph must route to graph result view: {graph_cmd}")'''
          if s.count(old_route_check) != 1:
              raise SystemExit('temporary route-check anchor mismatch')
          s = s.replace(old_route_check, new_route_check)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Graphics source patch
        run: python tools/prepare_graph_diagnostics.py

      - name: Create Stata SFI compile stubs
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/hxclasses
          cat >/tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi;
          public class SFIToolkit {
            public static int executeCommand(String s, boolean b){return 0;}
            public static void displayln(String s){}
            public static void errorln(String s){}
            public static String stackTraceToString(Throwable t){return t==null?"":t.toString();}
          }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi;
          public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi;
          public class Macro { public static String getGlobal(String s){return "";} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi;
          public class Missing { public static boolean isMissing(double v){return Double.isNaN(v);} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi;
          public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi;
          public class Data {
            public static long getObsTotal(){return 0L;}
            public static int getVarCount(){return 0;}
            public static int getVarIndex(String s){return 0;}
            public static String getVarName(int i){return "";}
            public static String getVarLabel(int i){return "";}
            public static String getVarFormat(int i){return "";}
            public static boolean isVarTypeString(int i){return false;}
            public static double getNum(int i,long j){return Double.NaN;}
            public static String getStr(int i,long j){return "";}
            public static String getFormattedValue(int i,long j,boolean b){return "";}
          }
          EOF
          cat >/tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi;
          public class Frame {
            public static Frame connect(String s){return new Frame();}
            public static Frame create(String s){return new Frame();}
            public void drop(){}
            public long getObsTotal(){return 0L;}
            public int getVarCount(){return 0;}
            public int getVarIndex(String s){return 0;}
            public String getVarName(int i){return "";}
            public boolean isVarTypeString(int i){return false;}
            public double getNum(int i,long j){return Double.NaN;}
            public String getStr(int i,long j){return "";}
            public String getFormattedValue(int i,long j,boolean b){return "";}
          }
          EOF

      - name: Compile Java 11
        run: javac --release 11 -Xmaxerrs 200 -d /tmp/hxclasses /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Verify static and managed release contracts
        run: |
          python tools/verify_static_contracts.py
          python tools/verify_release.py

      - name: Remove one-shot files
        run: rm -f tools/prepare_graph_diagnostics.py .github/workflows/apply-graph-diagnostics.yml

      - name: Commit Graphics source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine twoway and regression diagnostic Graphics pages"
          git push origin HEAD:ui-consistency-audit-20260815
