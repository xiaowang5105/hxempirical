name: v1.4.5 audit cleanup
on:
  push:
    branches: [ui-middle-command-sync-v145]
    paths: ['.github/workflows/v145-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit files
        shell: bash
        run: |
          rm -rf audit-v145
          rm -f scripts/v145_patch.py scripts/v145_audit.sh
          rm -f .github/workflows/v145-audit.yml .github/workflows/v145-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean v1.4.5 audit files'
          git push origin HEAD:ui-middle-command-sync-v145
