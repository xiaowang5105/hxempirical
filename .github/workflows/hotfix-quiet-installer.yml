name: Hotfix quiet installer launcher

on:
  push:
    branches: [hotfix/quiet-installer-v1510]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/quiet-installer-v1510
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply launcher hotfix
        run: python tools/prepare_quiet_installer_hotfix.py
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify release and contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Remove one-shot files
        run: |
          rm -f tools/prepare_quiet_installer_hotfix.py
          rm -f .github/workflows/hotfix-quiet-installer.yml
      - name: Commit quiet launcher hotfix
        run: |
          git config user.name "xiaowang5105"
          git config user.email "2692127923@qq.com"
          git add -A
          git commit -m "Silence installer bootstrap output" || exit 0
          git push origin HEAD:hotfix/quiet-installer-v1510
