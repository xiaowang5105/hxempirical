name: Pixel match 1.2.1

on:
  push:
    branches:
      - pixel-match-1.2.1

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Patch, compile and render reference pages
        run: bash tools/audit_pixel_match_121.sh
      - name: Upload reference-page renders
        uses: actions/upload-artifact@v4
        with:
          name: hx-pixel-match-1.2.1
          path: build/previews/*.png
      - name: Commit pixel-match UI and JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar
          git commit -m "Match supplied UI references for 1.2.1"
          git push
