name: UI self-check fixes v1.3.3

on:
  push:
    branches: [ui-selfcheck-v132b]
    paths:
      - 'scripts/apply_ui_selfcheck_fix_v133.py'
      - '.github/workflows/ui-selfcheck-fix-v133.yml'

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes found by second audit
        run: python3 scripts/apply_ui_selfcheck_fix_v133.py

      - name: Create Stata SFI compile stubs
        shell: bash
        run: |
          mkdir -p /tmp/sfi/com/stata/sfi /tmp/classes /tmp/ui-audit
          cat > /tmp/sfi/com/stata/sfi/SFIToolkit.java <<'EOF'
          package com.stata.sfi; public class SFIToolkit { public static int executeCommand(String s, boolean b){return 0;} public static void errorln(String s){} public static void displayln(String s){} public static String stackTraceToString(Throwable t){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Characteristic.java <<'EOF'
          package com.stata.sfi; public class Characteristic { public static String getDtaChar(String s){return "";} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Macro.java <<'EOF'
          package com.stata.sfi; public class Macro { public static String getGlobal(String s){return "";} public static String getLocal(String s){return "";} public static void setGlobal(String s,String v){} public static void setLocal(String s,String v){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Missing.java <<'EOF'
          package com.stata.sfi; public class Missing { public static boolean isMissing(double d){return Double.isNaN(d);} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Scalar.java <<'EOF'
          package com.stata.sfi; public class Scalar { public static double getValue(String s){return Double.NaN;} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Data.java <<'EOF'
          package com.stata.sfi; public class Data { public static long getObsTotal(){return 0L;} public static int getVarCount(){return 0;} public static String getVarName(int i){return "";} public static String getVarLabel(int i){return "";} public static String getVarFormat(int i){return "";} public static int getVarIndex(String s){return -1;} public static boolean isVarTypeString(int i){return false;} public static double getNum(int i,long j){return Double.NaN;} public static String getStr(int i,long j){return "";} public static String getFormattedValue(int i,long j){return "";} public static String getFormattedValue(int i,long j,boolean b){return "";} public static void storeNum(int i,long j,double d){} public static void storeStr(int i,long j,String s){} }
          EOF
          cat > /tmp/sfi/com/stata/sfi/Frame.java <<'EOF'
          package com.stata.sfi; public class Frame { public static Frame create(String s){return new Frame();} public static Frame connect(String s){return new Frame();} public void drop(){} public long getObsTotal(){return 0L;} public int getVarCount(){return 0;} public String getVarName(int i){return "";} public int getVarIndex(String s){return -1;} public boolean isVarTypeString(int i){return false;} public double getNum(int i,long j){return Double.NaN;} public String getStr(int i,long j){return "";} public String getFormattedValue(int i,long j){return "";} public String getFormattedValue(int i,long j,boolean b){return "";} }
          EOF

      - name: Compile Java 11 and rebuild jar
        run: |
          javac --release 11 -d /tmp/classes /tmp/sfi/com/stata/sfi/*.java src/main/java/com/hexie/stata/HxWorkbench.java
          jar cf hxworkbench.jar -C /tmp/classes com/hexie/stata
          test -s hxworkbench.jar

      - name: Extended functional UI audit
        shell: bash
        run: |
          cat > /tmp/UiAuditV133.java <<'EOF'
          import java.awt.*;
          import java.awt.datatransfer.StringSelection;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.lang.reflect.*;
          import java.util.*;
          import javax.imageio.ImageIO;
          import javax.swing.*;
          public class UiAuditV133 {
            static Field f(Class<?> c,String n)throws Exception{Field x=c.getDeclaredField(n);x.setAccessible(true);return x;}
            static Method m(Class<?> c,String n,Class<?>...a)throws Exception{Method x=c.getDeclaredMethod(n,a);x.setAccessible(true);return x;}
            static void layout(Container c){c.doLayout();for(Component x:c.getComponents())if(x instanceof Container)layout((Container)x);}
            static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
            static AbstractButton button(Container c,String text){for(Component x:c.getComponents()){if(x instanceof AbstractButton&&text.equals(((AbstractButton)x).getText()))return(AbstractButton)x;if(x instanceof Container){AbstractButton b=button((Container)x,text);if(b!=null)return b;}}return null;}
            static void render(JFrame frame,String path)throws Exception{Container c=frame.getContentPane();layout(c);BufferedImage im=new BufferedImage(c.getWidth(),c.getHeight(),BufferedImage.TYPE_INT_RGB);Graphics2D g=im.createGraphics();c.printAll(g);g.dispose();ImageIO.write(im,"png",new File(path));}
            static void setSize(JFrame frame,int w,int h){frame.setSize(w,h);frame.getContentPane().setSize(w,h);frame.validate();layout(frame.getContentPane());}
            static Rectangle inForm(Component comp,JPanel form){return SwingUtilities.convertRectangle(comp.getParent(),comp.getBounds(),form);}
            static void checkInside(Component comp,JPanel form,String label){Rectangle r=inForm(comp,form);check(r.x>=-1&&r.width>20&&r.x+r.width<=form.getWidth()+2,label+" horizontally clipped: "+r+" formW="+form.getWidth());}
            public static void main(String[] args)throws Exception{
              final Throwable[] err={null};
              SwingUtilities.invokeAndWait(()->{try{
                Class<?> c=Class.forName("com.hexie.stata.HxWorkbench$WorkbenchFrame"); Constructor<?> ctor=c.getDeclaredConstructor(boolean.class);ctor.setAccessible(true); JFrame frame=(JFrame)ctor.newInstance(true);frame.addNotify();
                m(c,"showXtregWizardPageV130").invoke(frame);
                JSplitPane split=(JSplitPane)f(c,"commandDataSplit").get(frame); JScrollPane scroll=(JScrollPane)f(c,"formScroll").get(frame); JPanel form=(JPanel)f(c,"formPanel").get(frame);
                @SuppressWarnings("unchecked") JComboBox<String> panel=(JComboBox<String>)f(c,"xtregPanelVar").get(frame); @SuppressWarnings("unchecked") JComboBox<String> time=(JComboBox<String>)f(c,"xtregTimeVar").get(frame); @SuppressWarnings("unchecked") JComboBox<String> dep=(JComboBox<String>)f(c,"xtregDepVar").get(frame); @SuppressWarnings("unchecked") JList<String> indep=(JList<String>)f(c,"xtregIndepList").get(frame);
                int[][] sizes={{1920,1080},{1600,900},{1366,768},{1280,720},{1100,700}}; double[] ratios={.40,.45,.55,.65};
                for(int[] sz:sizes)for(double ratio:ratios){setSize(frame,sz[0],sz[1]);split.setDividerLocation(ratio);layout(frame.getContentPane());int vw=scroll.getViewport().getExtentSize().width;check(form.getWidth()<=vw+2,"form overflow "+sz[0]+" r="+ratio+" form="+form.getWidth()+" vp="+vw);for(String txt:new String[]{"运行 xtreg","清空设置","上一步","population-averaged","固定效应（FE）","随机效应（RE）","between"}){AbstractButton b=button(form,txt);check(b!=null,"missing button "+txt);checkInside(b,form,txt+" @"+sz[0]+" r="+ratio);}check(dep.getHeight()>=24&&dep.getHeight()<=40,"Y bad height "+dep.getHeight());check(panel.getHeight()>=24&&panel.getHeight()<=40,"panel bad height "+panel.getHeight());check(time.getHeight()>=24&&time.getHeight()<=40,"time bad height "+time.getHeight());if(sz[0]==1366&&ratio==.45)render(frame,"/tmp/ui-audit/xtreg-1366-45.png");if(sz[0]==1100&&ratio==.40)render(frame,"/tmp/ui-audit/xtreg-1100-40.png");}
                TransferHandler.TransferSupport p=new TransferHandler.TransferSupport(panel,new StringSelection("make"));TransferHandler.TransferSupport t=new TransferHandler.TransferSupport(time,new StringSelection("rep78"));TransferHandler.TransferSupport y=new TransferHandler.TransferSupport(dep,new StringSelection("price"));TransferHandler.TransferSupport x1=new TransferHandler.TransferSupport(indep,new StringSelection("mpg"));TransferHandler.TransferSupport x2=new TransferHandler.TransferSupport(indep,new StringSelection("weight"));check(panel.getTransferHandler().importData(p),"panel DnD failed");check(time.getTransferHandler().importData(t),"time DnD failed");check(dep.getTransferHandler().importData(y),"Y DnD failed");check(indep.getTransferHandler().importData(x1),"X1 DnD failed");check(indep.getTransferHandler().importData(x2),"X2 DnD failed");check(indep.getSelectedValuesList().contains("mpg")&&indep.getSelectedValuesList().contains("weight"),"multi-X DnD lost selection");
                AbstractButton clear=button(form,"清空设置");clear.doClick();check(Objects.toString(dep.getSelectedItem(),"").isBlank(),"clear did not reset Y");
                m(c,"refreshDataset",boolean.class).invoke(frame,false);check(panel.getItemCount()>1&&dep.getItemCount()>1&&indep.getModel().getSize()>1,"xtreg variable controls lost after refresh");
                setSize(frame,1366,768);split.setDividerLocation(.55);layout(frame.getContentPane());int before=split.getDividerLocation();m(c,"toggleSidebarCollapsed").invoke(frame);frame.validate();layout(frame.getContentPane());int after=split.getDividerLocation();JPanel sidebar=(JPanel)f(c,"sidebarPanel").get(frame);check(sidebar.getPreferredSize().width<=60,"sidebar not collapsed");check(Math.abs(after-before)<=40,"split reset on collapse");@SuppressWarnings("unchecked") Map<String,JButton> nav=(Map<String,JButton>)f(c,"sidebarButtons").get(frame);for(String key:new String[]{"home","data","stats","graph","oneclick","history","settings"})check(nav.containsKey(key)&&nav.get(key).isVisible(),"missing nav "+key);render(frame,"/tmp/ui-audit/xtreg-collapsed.png");
                JTable table=(JTable)f(c,"dataTable").get(frame);check(table.getTableHeader().getTransferHandler()!=null,"header DnD source missing");check(!table.getTableHeader().getReorderingAllowed(),"header reordering conflicts with DnD");frame.dispose();
              }catch(Throwable t){err[0]=t;}});if(err[0]!=null){err[0].printStackTrace();System.exit(2);}System.out.println("HX_UI_AUDIT_V133_OK");System.exit(0);
            }
          }
          EOF
          javac --release 11 -cp /tmp/classes -d /tmp/classes /tmp/UiAuditV133.java
          xvfb-run -a java -cp /tmp/classes UiAuditV133

      - name: Version and source checks
        run: |
          grep -q 'VERSION = "1.3.3"' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'd Version 1.3.3' hxempirical.pkg
          grep -q 'hxempirical 1.3.3' hxempirical.ado
          grep -q 'new GridLayout(4, 1, 0, 4)' src/main/java/com/hexie/stata/HxWorkbench.java
          grep -q 'new GridLayout(1, 3, 8, 0)' src/main/java/com/hexie/stata/HxWorkbench.java

      - name: Upload audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-selfcheck-v133
          path: /tmp/ui-audit/*.png
          if-no-files-found: error

      - name: Commit audited clean result
        shell: bash
        run: |
          rm -f scripts/apply_ui_selfcheck_fix_v133.py .github/workflows/ui-selfcheck-fix-v133.yml .github/workflows/ui-selfcheck-v132b.yml .github/workflows/ui-selfcheck-v132c.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/main/java/com/hexie/stata/HxWorkbench.java hxworkbench.jar hxempirical.ado hxempirical.pkg scripts .github/workflows
          git commit -m 'Fix narrow xtreg layout after extended self-check [ui-audit]' || exit 0
          git push
