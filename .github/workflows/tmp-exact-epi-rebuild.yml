name: Temporary exact and epidemiology rebuild

on:
  push:
    branches:
      - ui-consistency-audit-20260815
    paths:
      - .hx-exact-epi-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-consistency-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make family-level patch target the final occurrence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp_patch_exact_epi_catalog.py')
          lines = p.read_text(encoding='utf-8').splitlines()

          replacements = {
              '"epidemiology family",': [
                  'old_family = "    else if strpos(\\\" cc cs ir \\\", \\\" `cmd\' \\\") {\\n"',
                  'new_family = "    else if strpos(\\\" cc cs ir mcc dstdize \\\", \\\" `cmd\' \\\") {\\n"',
                  'idx = s.rfind(old_family)',
                  'if idx < 0:',
                  '    raise SystemExit("epidemiology family-level block not found")',
                  's = s[:idx] + new_family + s[idx + len(old_family):]',
              ],
              '"exact family",': [
                  'old_family = "    else if strpos(\\\" bitesti tabi \\\", \\\" `cmd\' \\\") {\\n"',
                  'new_family = "    else if strpos(\\\" exlogistic expoisson bitest bitesti ksmirnov symmetry tetrachoric tabi \\\", \\\" `cmd\' \\\") {\\n"',
                  'idx = s.rfind(old_family)',
                  'if idx < 0:',
                  '    raise SystemExit("exact family-level block not found")',
                  's = s[:idx] + new_family + s[idx + len(old_family):]',
              ],
          }

          for label, replacement in replacements.items():
              hit = next((i for i, line in enumerate(lines) if label in line), None)
              if hit is None:
                  raise SystemExit(f'missing patch label {label}')
              start = hit
              while start >= 0 and lines[start].strip() != 's = once(':
                  start -= 1
              end = hit
              while end < len(lines) and lines[end].strip() != ')':
                  end += 1
              if start < 0 or end >= len(lines):
                  raise SystemExit(f'cannot isolate patch block {label}')
              lines[start:end+1] = replacement
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Patch exact and epidemiology catalog
        run: python tools/tmp_patch_exact_epi_catalog.py
      - name: Rebuild managed release
        shell: pwsh
        run: ./tools/build_release_bundle.ps1
      - name: Verify managed release and static contracts
        run: |
          python tools/verify_release.py
          python tools/verify_static_contracts.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hxregistry.ado hxsemantics.ado tools/verify_static_contracts.py hxempirical-release.zip hxempirical-release.index release
          git diff --cached --quiet && exit 0
          git commit -m "Complete exact statistics and epidemiology navigation"
          git push origin HEAD:ui-consistency-audit-20260815
